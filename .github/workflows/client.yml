# Test the recipe manager client: the FastAPI server and the web client.
#
# The full test suite needs the scientific packages and runs locally only. This
# workflow runs the server, graph and fixture tests, which need only the server,
# dev and docs extras, and checks that the committed OpenAPI document and the
# TypeScript types made from it are current. The web job typechecks, tests and
# builds the client.

name: client

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "web/**"
      - "docs/recipes/**"
      - "pyproject.toml"
      - ".github/workflows/client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[server,dev,docs]"

      - name: Test the server and the recipe graph
        run: >-
          pytest tests/server tests/test_client_fixtures.py
          tests/test_recipe_graph.py tests/test_site_data.py -q

      - name: Check that the committed OpenAPI document is current
        run: |
          python -m aa_recipe_manager.server.openapi "$RUNNER_TEMP/openapi.json"
          diff -u web/src/api/openapi.json "$RUNNER_TEMP/openapi.json"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Check that the API types match openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/types.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
