<!doctype html>
<!-- The page a pane opened in a new window loads. Dockview moves the pane into
     it and copies the main page's stylesheets; the client sets data-theme. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AA-SI Recipe Manager</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body></body>
</html>
