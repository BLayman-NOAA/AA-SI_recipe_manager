# Documentation copy of AA-SI_Full_Pipeline_Example/example_recipes/HB1603/UC1/sub_recipes/processing_lvl_2_survey.yaml

# Processing level 2a (survey): per-file calibration, Sv and depth, cropped.
#
#   extract_cal_params -> compute_sv -> compute_transducer_depth
#                      -> ep_add_depth -> crop_range
#
# The shared survey artifact: the checkpointed per-file Sv, computed once per
# cruise. Every recipe that includes this file loads it from the cache.
#
# There is no survey fan-in here. HB1603's files have different sample
# intervals, so sample k is a different depth in different files. Each
# consumer bins onto a shared depth grid before it merges the files.
#
# The steps below are frozen: editing any of them, or changing
# crop_max_range_m, recomputes the whole survey Sv. They map over
# per_file_source, as level 1 does.

recipe:
  name: "hb1603_processing_lvl_2_survey"
  description: "Per-file Sv with surface-referenced depth, cropped. The shared survey artifact."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  per_file_source:
    type: str
    description: >
      The list the per-file steps map over, normally ${query_ncei.raw_urls}.
      Every level in the per-file chain must be given the same value.
  calibration_dict:
    type: dict
    description: "Standardized calibration data, from build_cal_mapping."
  mapping_dict:
    type: dict
    description: "Raw channel to calibration key mapping, from build_cal_mapping."
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Range ceiling applied per file. Changing it recomputes the whole survey Sv."

steps:

  # Matches each file to its calibration by bare filename, so a URL works like
  # a local path. A channel no calibration file matched falls back to the raw
  # file's own recorded values, with a warning; set unmapped_channels to
  # "error" to stop instead. On HB1603 this affects the first 151 files, 27
  # and 28 June, whose pulse lengths differ from the calibration. No dive is
  # affected. mapping_files/calibration_provenance.yaml records it per channel.
  - id: extract_cal_params
    op: extract_standardized_cal_params
    map_over: ${inputs.per_file_source}
    inputs:
      calibration_dict: ${inputs.calibration_dict}
      mapping_dict: ${inputs.mapping_dict}
      echodata: ${combine_raw.echodata}
    params:
      raw_file_path: ${_item}

  - id: compute_sv
    op: compute_sv
    map_over: ${inputs.per_file_source}
    checkpoint: always
    inputs:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}

  # The transducer depth below the surface, computed explicitly. echopype's
  # use_platform_vertical_offsets puts an EK60 transducer above the surface.
  # The heave sign was verified on HB2407, not yet on HB1603; it is worth at
  # most half a metre.
  - id: compute_transducer_depth
    op: compute_transducer_depth
    map_over: ${inputs.per_file_source}
    checkpoint: always
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${combine_raw.echodata}
    params:
      use_heave: true
      heave_sign: 1.0

  # Surface-referenced depth. It needs this file's EchoData, so it is added
  # here.
  - id: ep_add_depth
    op: ep_add_depth
    map_over: ${inputs.per_file_source}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${combine_raw.echodata}
    params:
      depth_offset: ${compute_transducer_depth.transducer_depth}

  # Checkpointed because it is the chain's surviving output: later steps read
  # it from the cache after read_raw's scratch stores are deleted.
  - id: crop_survey_range
    op: crop_range
    map_over: ${inputs.per_file_source}
    checkpoint: always
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
    params:
      max_range_m: ${inputs.crop_max_range_m}
      drop_trailing_all_nan: false
      outlier_sigma: null
