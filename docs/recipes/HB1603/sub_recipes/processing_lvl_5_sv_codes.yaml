# Documentation copy of AA-SI_Full_Pipeline_Example/example_recipes/HB1603/UC1/sub_recipes/processing_lvl_5_sv_codes.yaml

# Processing level 5: dive products. SVCodes and the depth-interval tables.
#
#   generate_sv_codes -> sv_code_depth_table
#
# The clustering projected back onto each dive as per-ping SVCodes, and the
# NEFSC report's percent-of-dive-duration tables. Each dive is coded on its
# own slice of the pooled grid between its own 99% confidence lines, so
# overlapping dives are each coded over their shared minutes and the combined
# table counts those minutes once per dive. Cluster ids are run scoped: read
# the codes against the per-code Sv in the CSVs.

recipe:
  name: "hb1603_processing_lvl_5_sv_codes"
  description: "Per-dive SVCode CSVs and the depth-interval duration tables."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  # Wire it to embed_results.ds_normalized.
  clustered:
    type: Dataset
    description: "Dataset carrying the cluster label of every MVBS cell, from the clustering level."
  dive_windows:
    type: list
    description: "Dive time windows, a list of dicts each with start and end, one per dive."
  # Must be the value level 3 gridded on; wire both from one parent input.
  ping_time_bin:
    type: str
    default: "10s"
    description: >
      Ping-time bin of the level 3 grid, as a duration string such as "10s".
      Each ping counts one bin of it in the duration tables.
  code_output_dir:
    type: path
    default: "./outputs/sv_codes"
    description: "Folder the per-dive SV code CSVs and the duration tables are written to."
  depth_interval_m:
    type: float
    default: 200.0
    description: "Depth bin of the SV code duration tables, in metres. 200 m matches the report."

steps:

  # Per-cell CSVs in the reference layout, plus the per-ping summary the
  # duration table uses: each ping adds one ping_time_bin to the code that
  # dominates the cells between its 99% bounds. Each row carries the cell's 18
  # and 38 kHz Sv, so grouping by code describes each cluster. The dive lines
  # are read here, per dive, from the paths on its window.
  - id: generate_sv_codes
    op: custom
    checkpoint: always
    inputs:
      ds: ${inputs.clustered}
    params:
      windows: ${inputs.dive_windows}
      output_dir: ${inputs.code_output_dir}
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      range_var: "depth"
      ping_time_bin: ${inputs.ping_time_bin}
    custom_spec:
      description: Write per-dive SVCode CSVs from the embedded clustering.
      callable_path: aa_si_utils.dive_profiles.generate_sv_codes
      cache_key: dive_profiles_generate_sv_codes
      version: "3"
      inputs:
        ds: {type: Dataset}
      params:
        windows: {type: list}
        output_dir:
          type: path
          constraints:
            must_exist: false
        dataset_name: {type: str}
        ml_result_name: {type: str}
        range_var: {type: str}
        ping_time_bin: {type: str}
      outputs:
        code_csv_paths: {type: list}
        summary_csv_path: {type: path}
        dive_labels: {type: list}
      output_map:
        code_csv_paths: "['code_csv_paths']"
        summary_csv_path: "['summary_csv_path']"
        dive_labels: "['dive_labels']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git

  # "Percent of total dive duration the whale spent at 200 m depth intervals
  # per code." Depth comes from the fitted dive profile, not from the cells:
  # the question is how long the whale spent at a depth, and the code says what
  # was around it there.
  - id: sv_code_depth_table
    op: custom
    checkpoint: always
    params:
      summary_csv_path: ${generate_sv_codes.summary_csv_path}
      output_dir: ${inputs.code_output_dir}
      depth_interval_m: ${inputs.depth_interval_m}
    custom_spec:
      description: Percent of dive duration per depth interval per code.
      callable_path: aa_si_utils.dive_profiles.sv_code_depth_table
      cache_key: dive_profiles_sv_code_depth_table
      version: "1"
      params:
        summary_csv_path: {type: path}
        output_dir:
          type: path
          constraints:
            must_exist: false
        depth_interval_m: {type: float}
      outputs:
        per_dive_csv_path: {type: path}
        combined_csv_path: {type: path}
        totals_csv_path: {type: path}
      output_map:
        per_dive_csv_path: "['per_dive_csv_path']"
        combined_csv_path: "['combined_csv_path']"
        totals_csv_path: "['totals_csv_path']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
