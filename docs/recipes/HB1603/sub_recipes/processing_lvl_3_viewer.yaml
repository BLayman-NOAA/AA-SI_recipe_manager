# Documentation copy of AA-SI_Full_Pipeline_Example/example_recipes/HB1603/UC1/sub_recipes/processing_lvl_3_viewer.yaml

# Processing level 3 (viewer): sparse masking and MVBS for the whole survey.
#
#   [per file]  mask_sparse_bins -> compute_mvbs (pinned depth grid)
#   [fan-in]    merge every file -> rechunk -> the survey MVBS store
#
# The per-file steps continue the chain from processing_lvl_2_viewer.yaml or
# its seabed variant, so include this file directly after it.
#
# WHY THE VIEWER IS BUILT FROM MVBS AND NOT FROM Sv
#
#   A pyramid needs one vertical axis for the survey, and HB1603 has 17
#   range_sample lengths at full resolution. compute_mvbs bins by the value of
#   depth, so with a pinned grid_max_depth every file shares one axis. Depth,
#   not echo_range, because the viewer only layers stores with the same
#   vertical reference and the per-dive analysis store is on depth.
#
# THE GRID IS THE ANALYSIS GRID BY DEFAULT
#
#   2 m by 10 s, as dive_analysis.yaml clusters on, so a cluster-label layer
#   registers cell for cell. At level zero that is about 350,000 columns by 905
#   rows by 5 channels, roughly 6 GB before compression. A context-only store
#   can be far coarser: 10 m by 30 s is about a fifteenth of that.
#
# The per-file MVBS is checkpointed: it is the chain's surviving output, so an
# interrupted run resumes and the fan-in reloads durable artifacts.

recipe:
  name: "hb1603_processing_lvl_3_viewer"
  description: "Per-file sparse masking and MVBS on a pinned depth grid, fanned in to one survey-wide store."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  range_bin:
    type: str
    default: "2m"
    description: >
      Depth bin height of the MVBS grid, as a length string such as "2m". The
      sparse-bin mask uses the same bin.
  ping_time_bin:
    type: str
    default: "10s"
    description: >
      Ping-time bin width of the MVBS grid, as a duration string such as
      "10s". The sparse-bin mask uses the same bin.
  range_var:
    type: str
    default: "depth"
    description: >
      Variable the bins are built on: "depth" (below the surface, shared
      across files and channels) or "echo_range" (from the transducer face).
      Keep "depth" to layer this store with the analysis store.
  # 1810m clears HB1603's 1800 m range crop plus the 8.9 m transducer depth.
  # Pinning also keeps the step lazy.
  grid_max_depth:
    type: str
    default: "1810m"
    description: >
      Deepest depth the bins cover, such as "1810m", pinned so every file
      shares one axis. It must clear the range crop plus the transducer depth;
      deeper samples are dropped.
  # 0.99 keeps a cell averaged from one surviving noisy sample, deep on a high
  # frequency, from being drawn as a speckle.
  nan_threshold:
    type: float
    default: .99
    description: "Fraction of NaN samples (0 to 1) above which the sparse-bin mask drops a bin."
  viewer_chunk_ping_time:
    type: int
    default: 2048
    description: >
      Ping-time chunk size of the survey MVBS store; the pyramid build reads it
      in segments, so a few chunks per segment suits it.

steps:

  - id: viewer_mask_sparse
    op: mask_sparse_bins
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${viewer_remove_noise.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      nan_threshold: ${inputs.nan_threshold}

  - id: viewer_file_mvbs
    op: compute_mvbs
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      ds_Sv: ${viewer_mask_sparse.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      range_var_max: ${inputs.grid_max_depth}

  # Fan-in: safe because every file shares one depth axis.

  # Time bins anchor to a global origin, so a file boundary inside a bin makes
  # both files emit it; averaging keeps the index unique. Recording gaps are not
  # filled, so the columns are recorded time laid end to end.
  #
  # Not checkpointed: the rechunk below is, and writing both would store the
  # survey twice.
  - id: merge_viewer_mvbs
    op: merge_datasets
    collect: ${viewer_file_mvbs.ds_MVBS}
    inputs:
      datasets: ${viewer_file_mvbs.ds_MVBS}
    params:
      dim: "ping_time"
      on_duplicate: "mean"

  - id: rechunk_viewer_mvbs
    op: rechunk_dataset
    checkpoint: always
    inputs:
      ds_Sv: ${merge_viewer_mvbs.merged}
    params:
      ping_time_chunk: ${inputs.viewer_chunk_ping_time}
