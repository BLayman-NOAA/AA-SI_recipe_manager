# Documentation copy of AA-SI_Full_Pipeline_Example/example_recipes/RL2307/save_calibration.yaml

# RL2307 calibration, phase 3: archive the finished calibration
#
# Runs after calibration_standardize.yaml and calibration_mapping.yaml and
# copies what the survey keeps into archive_dir.
#
#   aa-recipe run save_calibration.yaml --input archive_dir=./archive
#   aa-recipe run save_calibration.yaml --input archive_dir=gs://bucket/RL2307/calibration
#
# Run locally with only archive_dir set, and it reads the folder phase 2 wrote.
# Keep its run config identical to the other two phases so it finds that folder.
# A caller with no folder passes phase 2's mapping_dict, provenance and
# single_channel_data instead.
# A non-empty archive_dir is refused unless overwrite is true.
#
#   <archive_dir>/channel_mapping.yaml
#   <archive_dir>/calibration_provenance.yaml
#   <archive_dir>/Standardized_Reports/     one file per standardized channel

recipe:
  name: "rl2307_save_calibration"
  description: "Archive the finished RL2307 calibration outputs to a user-specified directory."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  archive_dir:
    type: path
    required: true
    description: "Directory to archive the calibration into, a local path or a gs:// URL."
  calibration_outputs:
    type: str
    default: "calibration"
    description: >
      Subdirectory under the outputs folder the earlier phases wrote to. Keep it
      the same as in the other two phase recipes.
  output_base:
    type: path
    required: false
    description: >
      Calibration outputs folder to read unset inputs from. Defaults to this
      run's own; set it to archive a run made elsewhere.
  overwrite:
    type: bool
    default: false
    description: "Replace an archive already in archive_dir, clearing Standardized_Reports/ first."
  single_channel_data:
    type: dict
    required: false
    description: "Phase 2's single_channel_data output. Read from the outputs folder when unset."
  mapping_dict:
    type: dict
    required: false
    description: "Phase 2's mapping_dict output. Read from the outputs folder when unset."
  provenance:
    type: dict
    required: false
    description: "Phase 2's provenance output. Read from the outputs folder when unset."

steps:

  # Always runs: the archive is outside the outputs directory, so a cache hit
  # could not tell whether it still exists.
  - id: save_calibration
    op: save_calibration_archive
    checkpoint: never
    regenerate: always
    inputs:
      single_channel_data: ${inputs.single_channel_data}
      mapping_dict: ${inputs.mapping_dict}
      provenance: ${inputs.provenance}
    params:
      archive_dir: ${inputs.archive_dir}
      output_base: ${inputs.output_base}
      calibration_outputs: ${inputs.calibration_outputs}
      overwrite: ${inputs.overwrite}

outputs:
  archive_dir:
    step_id: save_calibration
    output_name: archive_dir
    description: "The directory the calibration was archived to."
  mapping_path:
    step_id: save_calibration
    output_name: mapping_path
    description: "Full path of the archived channel_mapping.yaml."
  provenance_path:
    step_id: save_calibration
    output_name: provenance_path
    description: "Full path of the archived calibration_provenance.yaml."
  reports_dir:
    step_id: save_calibration
    output_name: reports_dir
    description: "The Standardized_Reports folder holding the channel files."
  channel_count:
    step_id: save_calibration
    output_name: channel_count
    description: "How many standardized channel files were archived."
  files_written:
    step_id: save_calibration
    output_name: files_written
    description: "Every file the archive holds, in write order."
