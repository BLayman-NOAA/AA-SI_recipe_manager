# Recipes the documentation site shows. `aa-recipe site-data` reads this and
# writes each one's Flow diagram / YAML / Notebook tabs under docs/data, plus
# the graph of every full recipe, which the site's diagram viewer draws. Paths
# are relative to this folder.
#
#   slug     names the partial; a page embeds a recipe with
#            --8<-- "data/partials/<slug>.md"
#   page     the page that embeds it, used for relative links and for the
#            links the viewer shows to that page
#   parent   the full recipe that includes this file. Its diagram is the
#            parent's graph drilled into this file's include, and its notebook
#            tab is cut from the parent's generated notebook. Without a parent,
#            the recipe is a full recipe, drawn and generated on its own.
#   level    the processing level it documents

recipes:

  - slug: quickstart
    path: recipes/quickstart/quickstart.yaml
    title: Quickstart
    page: quickstart.md

