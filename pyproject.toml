[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aa-recipe-manager"
version = "0.1.0"
description = "Define, share, generate, and execute standardized scientific workflow recipes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "NOAA Fisheries AA-SI" },
]
keywords = [
    "noaa",
    "fisheries",
    "acoustics",
    "workflow",
    "recipe",
    "pipeline",
    "DAG",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2",
    "ruamel.yaml>=0.17",
    "click>=8.0",
    "nbformat>=5.7",
    "packaging>=21.0",
    "fsspec>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "jsonschema>=4.0",
]
# Google Cloud Storage backend for checkpoint cache / exe_temp / outputs on
# gs:// URLs. gcsfs registers the fsspec "gs" protocol; credentials come from
# Application Default Credentials (gcloud auth application-default login).
gcs = [
    "gcsfs>=2024.1",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]
dask = [
    "dask[distributed]>=2023.1.0",
]
prefect = [
    "prefect>=2.0",
]
# Bundle of every dependency declared by the built-in spec registry, plus the
# Jupyter packages needed to run a generated notebook. Lets users install one
# environment that can execute any recipe built from built-in specs without
# running `aa-recipe env create`. Keep this list in sync with the
# `dependency:` blocks under src/aa_recipe_manager/registry/builtin/specs/.
#
# Specs under specs/experimental/ are deliberately not covered. They may pin a
# package to an unreleased build, and one environment cannot hold two builds of
# the same package, so including them would force every user onto an unreleased
# dependency for ops most will never call. Use `aa-recipe env create` on a
# recipe that needs one.
all-builtin-specs = [
    "echopype>=0.6.0",
    "aa-si-utils @ git+https://github.com/BLayman-NOAA/AA-SI_Utils.git",
    "aa-si-calibration @ git+https://github.com/BLayman-NOAA/AA-SI_calibration.git",
    "aa-si-ml @ git+https://github.com/BLayman-NOAA/AA-SI_ML.git",
    "aa-si-visualization @ git+https://github.com/BLayman-NOAA/AA-SI_Visualization.git",
    "ipykernel",
    "ipywidgets",
]

[project.scripts]
aa-recipe = "aa_recipe_manager.cli:main"
aa-recipe-manager = "aa_recipe_manager.cli:main"
aa_recipe_manager = "aa_recipe_manager.cli:main"

[project.urls]
Repository = "https://github.com/BLayman-NOAA/AA-SI_recipe_manager.git"
Issues = "https://github.com/BLayman-NOAA/AA-SI_recipe_manager/issues"
Changelog = "https://github.com/BLayman-NOAA/AA-SI_recipe_manager/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aa_recipe_manager"]

[tool.hatch.metadata]
# Required so the `all-builtin-specs` extra can pull in dependencies hosted on
# GitHub via `package @ git+https://…` direct references.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "e2e: end-to-end tests using real recipe files and example data",
    "slow: heavier tests (e.g. spawning Dask worker processes)",
]

[tool.coverage.run]
source = ["src/aa_recipe_manager"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
