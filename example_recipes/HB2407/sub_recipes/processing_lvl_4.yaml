# Processing Level 4 - Machine Learning
#
# Reshapes MVBS for ML, adds auxiliary features, normalizes the ML dataset,
# runs HDBSCAN clustering, and produces the clustering report outputs.

recipe:
  name: "processing_lvl_4"
  description: "ML reshape, normalization, clustering, and reporting."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  mvbs:
    type: dataset
    description: "MVBS dataset with line overlay variables added."
  echodata:
    type: echodata
    required: false
    description: >
      EchoData object used for the 'seafloor_depth' and 'altitude' auxiliary ML
      features. Only needed when seafloor_depth below is not wired, and not at
      all for the features list this recipe currently uses.
  seafloor_depth:
    type: dataarray
    required: false
    description: >
      Pre-detected seafloor line, 1-D over ping_time, wired from a
      detect_seafloor step. Takes precedence over echodata for the
      'seafloor_depth' and 'altitude' features, so the ML features use the same
      line the masking stack used rather than a channel mean recomputed
      internally. In a per-file map_over pipeline, wire it straight from the
      mapped step: the reference resolves to the list of per-file lines, which
      is concatenated along ping_time in segment order.
  overlay_line_var:
    type: str
    default: "overlay_line"
    description: "Line variable to overlay on the clustering report plot."
  sv_clean_unmasked:
    type: dataset
    description: >
      Pre-sparse-mask Sv used as the backdrop and ping-index reference for ML
      and cluster echogram plots.
  cell_stats_sv:
    type: dataset
    description: "Per-cell statistics dataset produced from the clean unmasked Sv dataset."
  min_depth:
    type: float
    default: 0
    description: "Shallowest depth in meters shown by the ML and clustering echograms."
  max_depth:
    type: float
    default: 100
    description: "Deepest depth in meters shown by the ML and clustering echograms."
  ping_min:
    type: int
    default: 0
    description: "First ping index shown by the ML and clustering echograms."
  ping_max:
    type: int
    description: "Last ping index shown by the ML and clustering echograms. Omit for every ping."
  x_axis_units:
    type: str
    default: "seconds"
    description: "Units for the x-axis of the ML and clustering echograms."
  y_axis_units:
    type: str
    default: "meters"
    description: "Units for the y-axis of the ML and clustering echograms."

steps:

  - id: reshape_ml
    op: reshape_for_ml
    inputs:
      ds_MVBS: ${inputs.mvbs}
    params:
      data_var: "Sv"
      dataset_name: "ml_dataset"
      feature_strategy: "mean_centered"
      baseline_channel: 0

  - id: add_aux_features
    op: add_auxiliary_features
    inputs:
      ds_ml: ${reshape_ml.ds_ml_ready}
      echodata: ${inputs.echodata}
      ds_sv: ${inputs.cell_stats_sv}
      seafloor_depth: ${inputs.seafloor_depth}
    params:
      dataset_name: "ml_dataset"
      features:
        - cell_cv

  - id: normalize_ml
    op: normalize_ml_data
    checkpoint: always
    inputs:
      ds_ml: ${add_aux_features.ds_ml_ready}
    params:
      method: "flatten"
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      shift_positive: false

  - id: plot_normalized_ml
    op: plot_ml_echogram
    regenerate: if-missing
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      ping_min: ${inputs.ping_min}
      ping_max: ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 30

  - id: run_hdbscan
    op: run_hdbscan
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      ml_result_name: "hdbscan_results"
      min_cluster_size_fraction: .005 
      min_samples: 2
      sample_size: 1000000
      cluster_selection_method: "eom"
      use_hdbscan: true
      soft_membership_threshold: 0.6

  - id: embed_results
    op: embed_clustering_results
    checkpoint: always
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"

  - id: plot_clustering_report
    op: plot_clustering_report
    regenerate: if-missing
    inputs:
      ds_normalized: ${embed_results.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
      clustering_model: ${run_hdbscan.clustering_model}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      # [min_depth, max_depth, ping_min, ping_max]
      plot_window:
        - ${inputs.min_depth}
        - ${inputs.max_depth}
        - ${inputs.ping_min}
        - ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50
      cluster_stats_dpi: 200
      overlay_line_var: ${inputs.overlay_line_var}
      cluster_colors:
        - "#9D00FF"
        - "#35E200"
        - "#FF0000"
        - "#2F00FF"
        - "#FF8800"
        - "#FFFB1C"
        - "#FF44E9"
        - "#00BE8BCA"
        - "#00FFE5"
        - "#3D8D00FF"
        - "#9C67FFFF"
      cluster_stats_sv_data_var: "Sv"