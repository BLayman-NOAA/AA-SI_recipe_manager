op: compute_transducer_depth
cache_key: compute_transducer_depth  # pinned cache identity - keep stable across op renames
description: >
  Compute per-ping transducer depth in metres below the water surface from the
  EK Platform group, for feeding ``ep_add_depth`` as its ``depth_offset``. Use
  it instead of ``use_platform_vertical_offsets``, which gets the sign wrong.
notes: >
  Reads the Platform group directly rather than going through
  ``ep_add_depth(use_platform_vertical_offsets=true)``, which gets the sign
  wrong on both EK families for different reasons.

  On an EK80 drop keel vessel the transducers ride on a retractable keel and
  ``drop_keel_offset`` records how far it was lowered, while the
  ``transducer_offset_z`` and ``water_level`` fields echopype's formula reads
  are left at zero. echopype carries ``drop_keel_offset`` for provenance and
  never reads it.

  An EK60 file has no ``drop_keel_offset`` at all, and echopype maps the ER60
  per-ping transducer depth into ``water_level``, whose value its formula then
  subtracts (``transducer_offset_z - (water_level + vertical_offset)``, with
  ``transducer_offset_z`` zero because the ER60 does not populate it). The
  transducer comes out above the water surface and every depth is short by
  twice the draft. This step reads ``water_level`` directly instead.

  ``drop_keel_offset`` is preferred when both are present; the field actually
  used is recorded in the output's ``static_offset_field`` attr.

  The static position is per file and heave is per ping, so the result is
  ``static offset + datum_correction_m + heave_sign * vertical_offset``.
  Heave is interpolated onto ds_Sv's ping_time here, which also means
  ``ep_add_depth`` passes the array straight through instead of resampling it
  again with nearest neighbour.

  The output is small (one value per ping) and is the record of what vertical
  reference a run actually used, so checkpointing it is cheap and makes the
  reference auditable without recomputing Sv.
category: consolidate
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Calibrated Sv dataset supplying the target ``ping_time`` coordinate.
  echodata:
    type: EchoData
    description: Source EchoData supplying the Platform group.
outputs:
  transducer_depth:
    type: DataArray
    description: >
      Transducer depth in metres below the surface on ds_Sv's ping_time. Wire
      it into ``ep_add_depth``'s ``depth_offset``. Attributes record where the
      value came from.
    notes: >
      The attrs record the static offset and which Platform field it came
      from, the correction applied, the heave sign and coverage.
params:
  datum_correction_m:
    type: float
    units: m
    description: >
      Metres added to the static offset when it is measured from a hull datum
      rather than the waterline. Positive pushes the transducer deeper. The
      default 0.0 takes the recorded offset as waterline referenced.
    required: false
    default: 0.0
  use_heave:
    type: bool
    description: >
      Add the per-ping ``vertical_offset`` (heave) term. False holds the static
      keel depth on every ping. Without usable heave the step says so and uses
      the static depth.
    required: false
    default: true
  heave_sign:
    type: float
    description: >
      Sign applied to ``vertical_offset`` (1.0 or -1.0). The default was
      verified on HB2407 (EK80); check it on a new vessel or instrument setup.
    notes: >
      The default 1.0 was determined empirically on HB2407 (EK80, Henry B.
      Bigelow) by correlating raw heave against the hand-verified EVL seabed
      line: the correct sign left a 0.14 m residual against 0.75 m for the
      wrong one. The convention is not recorded in the file attributes and is
      not the sign echopype's own platform vertical offsets formula uses (that
      formula is referenced from a hull datum, not drop_keel_offset).
      Re-verify the same way on a new vessel or instrument setup rather than
      assuming.
    required: false
    default: 1.0
  interp_method:
    type: str
    description: >
      Interpolation used to put heave on ping_time, such as "linear" (default)
      or "nearest".
    notes: >
      Heave is typically sampled several times coarser than the ping rate, so
      linear is preferred over nearest.
    required: false
    default: "linear"
implementations:
  - key: default
    callable_path: aa_si_utils.utils.compute_transducer_depth
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      transducer_depth: __return__
