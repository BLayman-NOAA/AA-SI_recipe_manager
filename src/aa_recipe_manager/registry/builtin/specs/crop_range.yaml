op: crop_range
cache_key: crop_range  # pinned cache identity - keep stable across op renames
description: >
  Trim the deep range samples that hold no data after seafloor masking. Run it
  on the whole survey, after the per-file fan-in. Active criteria each give a
  cut and the shallowest wins.
notes: >
  A raw file records to the sonar's configured range, so after seafloor masking
  the deep end of ``range_sample`` is entirely NaN. Those samples still cost
  memory and time in every downstream step, and they widen the binned cell grid
  that ``compute_mvbs`` and ``compute_per_cell_statistics`` build. The flox
  reduction behind the latter allocates dense bookkeeping sized by channels x
  ping bins x range bins, so an over-wide range axis pushes it into a
  MemoryError on a long survey.

  It is a standalone step rather than a parameter on ``apply_sv_mask`` for the
  same reason ``rechunk_dataset`` is: masking is ping-local and runs correctly
  per file, but the crop point is a property of the whole survey. Cropping per
  file would leave segments with different ``range_sample`` lengths, and the
  ping_time concatenation pads the short ones back out with NaN. That undoes
  the crop and leaves NaN in ``echo_range``, where downstream range binning
  reads it.

  ``outlier_sigma`` rejects anomalous pings and then crops to the deepest
  retained ping. Prefer it survey-wide: a single glitch ping reaching far past
  the seafloor otherwise holds the whole range axis open, which defeats the
  lossless mode. The threshold is deliberately generous, so uncommon but real
  depths survive and only wild outliers go.

  ``max_range_m`` is a hard ceiling, cheapest when the answer is already known,
  for example from the deepest point in the survey's seabed lines.
  ``drop_trailing_all_nan`` is the lossless fallback used when no outlier test
  is requested.
category: preprocessing
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Survey Sv Dataset to crop, normally after apply_sv_mask so the seafloor
      returns are already NaN.
    expected_variables:
      - Sv
outputs:
  ds_Sv:
    type: Dataset
    description: The same Dataset with the trailing empty range samples dropped.
    expected_variables:
      - Sv
params:
  max_range_m:
    type: float
    units: m
    description: >
      Hard cap on range. Samples deeper than this are dropped whether or not
      they hold data. Unset derives the crop from the data.
    required: false
    default: null
  outlier_sigma:
    type: float
    description: >
      Standard deviations above the mean of each ping's deepest finite sample
      at which a ping counts as an outlier and is ignored. Unset disables
      outlier rejection and uses drop_trailing_all_nan.
    notes: >
      The reject threshold is outlier_margin x (mean + outlier_sigma x sd),
      taken over the per-ping deepest finite sample. The crop then goes to the
      deepest retained ping.
    required: false
    default: null
  outlier_margin:
    type: float
    description: >
      Multiplier on (mean + outlier_sigma x sd) giving the outlier threshold.
      Raise it to flag fewer pings. Only used when outlier_sigma is set.
    notes: >
      The default 1.5 is deliberately loose: on HB2407's 2024-10-15 window it
      puts the threshold at 424 m against a deepest retained ping of 214 m, so
      it catches only genuine anomalies.
    required: false
    default: 1.5
  drop_trailing_all_nan:
    type: bool
    description: >
      Crop to one past the deepest sample with a finite value anywhere
      (lossless). Ignored when outlier_sigma is set. False, with the other two
      unset, turns the step into a no-op.
    required: false
    default: true
  data_var:
    type: str
    description: Variable inspected for finite values.
    required: false
    default: "Sv"
  range_var:
    type: str
    description: Variable supplying each sample's range in metres.
    required: false
    default: "echo_range"
implementations:
  - key: default
    callable_path: aa_si_utils.utils.crop_range_samples
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      ds_Sv: __return__
