op: extract_standardized_cal_params
cache_key: extract_standardized_cal_params  # pinned cache identity - keep stable across op renames
description: >
  Extract calibration parameters (gain, sa-correction, EBA) and environmental
  parameters (sound speed, absorption) from standardized calibration files,
  cross-referenced against the EchoData object for channel alignment.
category: calibration
inputs:
  calibration_dict:
    type: dict
    description: >
      Parsed standardized calibration data keyed by calibration key, from
      generate_standardized_cal_mapping. Holds the values themselves.
  mapping_dict:
    type: dict
    description: >
      Raw channel to calibration key mapping, from
      generate_standardized_cal_mapping. Says which entry of
      calibration_dict belongs to each channel of each file.
  echodata:
    type: EchoData
    description: >
      EchoData whose channels the outputs are keyed by, normally from
      combine_raw_files, so they pass straight to compute_sv.
outputs:
  cal_params:
    type: dict
    description: >
      Calibration parameters (gain_correction, sa_correction, EBA, beam widths
      and angle offsets), one value per channel, or per channel and frequency
      for FM calibrations.
    notes: >
      For a frequency dependent (FM) calibration, each per-frequency parameter
      is an xarray DataArray with dims (cal_channel_id, cal_frequency), the
      form echopype interpolates at each ping's centre frequency; such an
      output is checkpointed as a pickle. An FM record's single equivalent
      beam angle, beam width or angle sensitivity is its nominal-frequency
      value and is carried across the band as echopype carries its own.
  env_params:
    type: dict
    description: "Environmental parameters keyed by channel (sound_speed, sound_absorption)"
  other_params:
    type: dict
    description: >
      Other calibration metadata by channel and source file. Its
      unmapped_channels entry names channels that fell back to the raw file's
      own values; empty when the mapping covered every channel.
    required: false
params:
  raw_file_path:
    type: path
    required: false
    description: >
      Raw file whose mapping to use, matched by basename. Wire to ${_item} in
      a per-file chain. Unset uses the first file in the survey, which suits
      whole-survey recipes.
  unmapped_channels:
    type: str
    required: false
    default: "warn"
    description: >
      What to do with a channel no calibration file matched. "warn" (default)
      reports it and uses the values the raw file records. "error" stops the
      run.
    notes: >
      The raw file's own values are what echopype would calibrate that channel
      with given no calibration file at all. The fallback needs the echodata
      input; without it "warn" raises the way "error" would.
  output_logs_folder:
    type: path
    required: false
    description: >
      Where the fallback writes its calibration flags. Unset uses a temporary
      folder.
    notes: >
      The temporary folder is what a per-file chain wants: several files
      falling back at once would otherwise race on one flags file.
    constraints:
      must_exist: false
  waveform_mode:
    type: str
    required: false
    description: >
      The waveform_mode compute_sv uses, "CW" or "BB". Selects which beam
      group's channels are extracted, for EK80 files mixing CW and FM. Unset
      uses the first beam group.
    notes: >
      echopype calibrates one beam group at a time and needs parameters for
      exactly its channels. A broadband channel with no matching calibration
      is an error, since the values the raw file records are CW only.
  encode_mode:
    type: str
    required: false
    description: >
      The encode_mode the compute_sv step passes to echopype, "complex" or
      "power". Set it together with waveform_mode, or leave both unset.
implementations:
  - key: default
    callable_path: aa_si_calibration.calibration.extract_standardized_calibration_parameters
    default: true
    dependency:
      name: aa-si-calibration
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_calibration.git
    output_map:
      cal_params: "['cal_params']"
      env_params: "['env_params']"
      other_params: "['other_params']"
