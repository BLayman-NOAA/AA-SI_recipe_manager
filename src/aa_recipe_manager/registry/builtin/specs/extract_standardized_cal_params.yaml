op: extract_standardized_cal_params
cache_key: extract_standardized_cal_params  # pinned cache identity - keep stable across op renames
description: >
  Extract calibration parameters (gain, sa-correction, EBA) and environmental
  parameters (sound speed, absorption) from standardized calibration files,
  cross-referenced against the EchoData object for channel alignment.
category: calibration
inputs:
  calibration_dict:
    type: dict
    description: >
      Parsed standardized calibration data keyed by calibration key, from
      generate_standardized_cal_mapping. Holds the values themselves.
  mapping_dict:
    type: dict
    description: >
      Raw channel to calibration key mapping, from
      generate_standardized_cal_mapping. Says which entry of
      calibration_dict belongs to each channel of each file.
  echodata:
    type: EchoData
    description: >
      EchoData whose channel labels the calibration values are aligned to,
      normally the combined object from combine_raw_files. The outputs are
      keyed by that object's channels, so they can be passed straight to
      compute_sv.
outputs:
  cal_params:
    type: dict
    description: "Calibration parameters keyed by channel (gain_correction, sa_correction, EBA)"
  env_params:
    type: dict
    description: "Environmental parameters keyed by channel (sound_speed, sound_absorption)"
  other_params:
    type: dict
    description: >
      Additional extracted calibration metadata keyed by channel and source
      file details. Its unmapped_channels entry names the channels that fell
      back to the raw file's own recorded values, and is empty when the
      mapping covered every channel.
    required: false
params:
  raw_file_path:
    type: path
    required: false
    description: >
      Path to the specific raw file whose channel mapping should be
      selected from mapping_dict (matched by basename). Wire this to
      ${_item} in a per-file map_over chain so each instance picks its own
      file's calibration mapping instead of defaulting to the first file
      in the survey. Leave unset for whole-survey recipes.
  unmapped_channels:
    type: str
    required: false
    default: "warn"
    description: >
      What to do about a channel the mapping does not cover, which happens
      when no calibration file matched it. "warn" (the default) reports the
      channel on the terminal and falls back to the values the raw file itself
      records, which is what echopype would calibrate that channel with given
      no calibration file at all. "error" stops the run instead. The fallback
      needs the echodata input; without it "warn" raises the way "error"
      would.
  output_logs_folder:
    type: path
    required: false
    description: >
      Where the fallback writes its calibration flags. A temporary folder is
      used when omitted, which is what a per-file chain wants: several files
      falling back at once would otherwise race on one flags file.
    constraints:
      must_exist: false
implementations:
  - key: default
    callable_path: aa_si_calibration.calibration.extract_standardized_calibration_parameters
    default: true
    dependency:
      name: aa-si-calibration
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_calibration.git
    output_map:
      cal_params: "['cal_params']"
      env_params: "['env_params']"
      other_params: "['other_params']"
