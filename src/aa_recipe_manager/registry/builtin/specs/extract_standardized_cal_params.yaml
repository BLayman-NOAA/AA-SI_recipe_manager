op: extract_standardized_cal_params
cache_key: extract_standardized_cal_params  # pinned cache identity - keep stable across op renames
description: >
  Extract calibration parameters (gain, sa-correction, EBA) and environmental
  parameters (sound speed, absorption) from standardized calibration files,
  cross-referenced against the EchoData object for channel alignment.
category: calibration
inputs:
  calibration_dict:
    type: dict
  mapping_dict:
    type: dict
  echodata:
    type: EchoData
outputs:
  cal_params:
    type: dict
    description: "Calibration parameters keyed by channel (gain_correction, sa_correction, EBA)"
  env_params:
    type: dict
    description: "Environmental parameters keyed by channel (sound_speed, sound_absorption)"
  other_params:
    type: dict
    description: "Additional extracted calibration metadata keyed by channel and source file details"
    required: false
params:
  raw_file_path:
    type: path
    required: false
    description: >
      Path to the specific raw file whose channel mapping should be
      selected from mapping_dict (matched by basename). Wire this to
      ${_item} in a per-file map_over chain so each instance picks its own
      file's calibration mapping instead of defaulting to the first file
      in the survey. Leave unset for whole-survey recipes.
implementations:
  - key: default
    callable_path: aa_si_calibration.calibration.extract_standardized_calibration_parameters
    default: true
    dependency:
      name: aa-si-calibration
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_calibration.git
    output_map:
      cal_params: "['cal_params']"
      env_params: "['env_params']"
      other_params: "['other_params']"
