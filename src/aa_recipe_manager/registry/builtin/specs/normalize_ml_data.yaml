op: normalize_ml_data
cache_key: normalize_ml_data  # pinned cache identity - keep stable across op renames
description: >
  Normalize ML features in the flattened Dataset. Supports per-feature
  normalization methods via per_group_methods.
category: ml_preprocessing
inputs:
  ds_ml:
    type: Dataset
    description: >
      Flattened ML Dataset to normalize, from reshape_for_ml or
      add_auxiliary_features. Auxiliary columns are on unrelated scales
      (metres, seconds, a coefficient of variation); per_group_methods
      handles them.
  normalizer:
    type: object
    description: >
      Fitted normalizer from an earlier normalize_ml_data step. When wired,
      nothing is fitted: its scaling is applied to this Dataset.
    notes: >
      For putting a second segment on the scale a model was fitted on, so
      assign_clusters_to_all_points can label it with predict_all. The
      feature coordinate must equal the one the normalizer was fitted on;
      the step fails naming both lists otherwise. method, shift_positive,
      feature_weights and per_group_methods are then ignored, since the
      normalizer carries them.
    required: false
    default: null
outputs:
  ds_normalized:
    type: Dataset
    description: Dataset with normalized feature values
  normalizer:
    type: object
    description: >
      The fitted scaling, for a later normalize_ml_data step to apply to
      another Dataset.
    notes: >
      Kept separate from ds_normalized so the Dataset checkpoints as Zarr
      while the normalizer falls back to pickle, which the tiered store
      writes to the user tier only. Methods without a reusable fit (umap,
      flatten_plus_umap, l2) make the step fail.
    required: false
    default: null
params:
  method:
    type: str
    description: "Global normalization method (e.g. 'flatten', 'minmax', 'zscore')"
    required: true
  dataset_name:
    type: str
    description: >
      ML dataset to normalize. Must match the dataset_name used by
      reshape_for_ml.
    required: true
  normalization_name:
    type: str
    description: >
      Name this normalized result is stored under. run_hdbscan, the ML plots,
      and filter_normalized_by_cluster take the same name to find it, so
      several normalizations of one dataset can coexist and be compared.
    required: true
  shift_positive:
    type: bool
    description: Shift all values to be non-negative after normalization
    required: false
    default: false
  feature_weights:
    type: list
    description: Per-feature weight multipliers applied before normalization
    required: false
    default: []
  per_group_methods:
    type: dict
    description: Map of feature name to individual normalization method override
    required: false
    default: {}
implementations:
  - key: default
    callable_path: aa_si_ml.ml.normalize_ml_data_step
    default: true
    dependency:
      name: aa-si-ml
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_ML.git
    param_map:
      ds_ml: ds_ml_ready
    output_map:
      ds_normalized: "['ds_normalized']"
      normalizer: "['normalizer']"
