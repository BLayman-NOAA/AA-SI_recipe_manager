op: normalize_ml_data
cache_key: normalize_ml_data  # pinned cache identity - keep stable across op renames
description: >
  Normalize ML features in the flattened Dataset. Supports per-feature
  normalization methods via per_group_methods.
category: ml_preprocessing
inputs:
  ds_ml:
    type: Dataset
    description: >
      Flattened ML Dataset to normalize, from reshape_for_ml, or from
      add_auxiliary_features when auxiliary columns were appended. Those
      columns are on unrelated scales (metres, seconds, a coefficient of
      variation), which is what per_group_methods exists to handle.
outputs:
  ds_normalized:
    type: Dataset
    description: Dataset with normalized feature values
params:
  method:
    type: str
    description: "Global normalization method (e.g. 'flatten', 'minmax', 'zscore')"
    required: true
  dataset_name:
    type: str
    description: >
      ML dataset to normalize. Must match the dataset_name used by
      reshape_for_ml.
    required: true
  normalization_name:
    type: str
    description: >
      Name this normalized result is stored under. run_hdbscan, the ML plots,
      and filter_normalized_by_cluster take the same name to find it, so
      several normalizations of one dataset can coexist and be compared.
    required: true
  shift_positive:
    type: bool
    description: Shift all values to be non-negative after normalization
    required: false
    default: false
  feature_weights:
    type: list
    description: Per-feature weight multipliers applied before normalization
    required: false
    default: []
  per_group_methods:
    type: dict
    description: Map of feature name to individual normalization method override
    required: false
    default: {}
implementations:
  - key: default
    callable_path: aa_si_ml.ml.normalize_data
    default: true
    dependency:
      name: aa-si-ml
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_ML.git
    param_map:
      ds_ml: ds_ml_ready
    output_map:
      ds_normalized: __return__
