op: compute_mvbs
cache_key: compute_mvbs  # pinned cache identity - keep stable across op renames
description: >
  Compute Mean Volume Backscattering Strength by averaging Sv over range and
  time bins. Returns a gridded MVBS Dataset.

  This step is echopype.commongrid.compute_MVBS called directly, so the bin
  edges and the averaging (in the linear domain, converted back to dB) are
  echopype's.
category: processing
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Cleaned Sv Dataset to average. Normally the output of mask_sparse_bins,
      so bins that failed the sparsity check are already NaN and do not pull
      the bin means toward the noise floor.
    expected_variables:
      - Sv
outputs:
  ds_MVBS:
    type: Dataset
    description: Gridded MVBS Dataset
    expected_variables:
      - Sv
    expected_coords:
      - ping_time
      - echo_range
      - channel
params:
  range_bin:
    type: str
    description: "Depth bin size for averaging (e.g. '2m')"
    required: true
  ping_time_bin:
    type: str
    description: "Ping-time bin size for averaging (e.g. '10s')"
    required: true
implementations:
  - key: default
    callable_path: echopype.commongrid.compute_MVBS
    default: true
    dependency:
      name: echopype
      version: ">=0.6.0"
      source: pypi
    output_map:
      ds_MVBS: __return__
