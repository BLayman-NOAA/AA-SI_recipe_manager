op: merge_clustering_passes
cache_key: merge_clustering_passes  # pinned cache identity - keep stable across op renames
description: >
  Merge a first-pass clustering result with one or more second-pass results
  into one Dataset. Second-pass labels get new numbers that do not collide
  with pass-1 labels.
notes: >
  Noise points from the second pass override the parent label for those
  samples. When retain_parent_labels is true, each sample's original pass-1
  label is stored as a parent_labels variable, for parent and child lineage
  queries.

  clustering_results_pass2 is declared many: true, so it accepts a single
  Dataset, an explicit list such as ["${step_a.clustering_results}",
  "${step_b.clustering_results}"], or a list collected from a mapped
  run_hdbscan step.
category: ml_clustering
inputs:
  clustering_results_pass1:
    type: Dataset
    description: >
      First-pass clustering result from run_hdbscan, covering all samples.
  clustering_results_pass2:
    type: Dataset
    many: true
    description: >
      One or more second-pass results from run_hdbscan, each covering a subset
      of the pass-1 samples. A single Dataset or a list is accepted.
outputs:
  clustering_results:
    type: Dataset
    description: >
      Merged clustering result covering the same samples as
      clustering_results_pass1, with a parent_labels variable when
      retain_parent_labels is true.
    notes: >
      Child labels are offset above the highest pass-1 label so they never
      collide. The result works with embed_clustering_results and
      plot_clustering_report unchanged.
params:
  ml_result_name:
    type: str
    description: Name assigned to the merged result for downstream tracking.
    required: true
  dataset_name:
    type: str
    description: >
      ML dataset both passes were clustered from. Must match the
      dataset_name used by reshape_for_ml.
    required: true
  normalization_name:
    type: str
    description: >
      Normalized feature set both passes were clustered from, matching the
      normalization_name used by normalize_ml_data. Recorded on the merged
      result so it stays traceable to the features it came from.
    required: false
    default: null
  retain_parent_labels:
    type: bool
    description: >
      When true, stores each sample's original pass-1 cluster label in a
      parent_labels variable alongside the merged labels for lineage queries.
    required: false
    default: true
implementations:
  - key: default
    callable_path: aa_si_ml.ml.merge_clustering_passes
    default: true
    dependency:
      name: aa-si-ml
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_ML.git
    output_map:
      clustering_results: "['clustering_results']"
