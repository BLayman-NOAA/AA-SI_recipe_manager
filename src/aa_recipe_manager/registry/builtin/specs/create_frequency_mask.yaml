op: create_frequency_mask
cache_key: create_frequency_mask  # pinned cache identity - keep stable across op renames
description: >
  Build a mask that excludes selected frequency channels.
  Implementation can be swapped to use different exclusion criteria.
category: masking
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Sv Dataset the mask is shaped to. Supplies the nominal channel
      frequencies matched against frequencies_to_mask.
outputs:
  mask:
    type: DataArray
    description: Boolean mask DataArray; True means valid data
params:
  frequencies_to_mask:
    type: list
    units: kHz
    description: >
      Nominal channel frequencies to exclude, as numbers in kHz
      (e.g. [70, 120, 200]). Every sample on a listed channel is marked
      invalid and every other channel is left untouched. The default empty
      list masks nothing.
    required: false
    default: []
implementations:
  - key: default
    callable_path: aa_si_utils.utils.create_frequency_mask
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      mask: __return__
