op: plot_clustering_report
cache_key: plot_clustering_report  # pinned cache identity - keep stable across op renames
description: >
  Render a full clustering report for one or more clustering results. Produces
  the clustering echogram, per-cluster statistics report, and the HDBSCAN
  hierarchy plot when the clustering result includes a model and hierarchy
  plotting is applicable. This is a sink step: it produces figures with no
  data output.
category: visualization
sink: true
inputs:
  ds_normalized:
    type: Dataset
    description: Embedded normalized ML Dataset containing stored cluster-label variables
  clustering_results:
    type: Dataset
    many: true
    description: >
      Clustering result Dataset from run_hdbscan or
      assign_clusters_to_all_points. Legacy dict results and collected lists
      are also accepted (many: true). Optional: every panel but the HDBSCAN
      hierarchy reads the labels embed_clustering_results stored in
      ds_normalized, so a report can be drawn from that checkpointed dataset
      alone and the fit never has to be rerun for it. Leave it out to do that;
      the hierarchy panel is then skipped.
    required: false
    default: null
  clustering_model:
    type: object
    description: >
      Optional fitted clustering model from run_hdbscan, used only for the
      HDBSCAN hierarchy plot. Other report panels use clustering_results.
    required: false
    default: null
  ds_Sv:
    type: Dataset
    description: Original Sv Dataset for echogram depth reference
    required: false
outputs: {}
params:
  dataset_name:
    type: str
    description: >
      ML dataset to report on. Must match the dataset_name used by
      reshape_for_ml.
    required: true
  ml_result_name:
    type: str
    description: >
      Clustering result to report on. Must match the ml_result_name used by
      embed_clustering_results, which is the name the labels were stored
      under in ds_normalized.
    required: true
  plot_window:
    type: list
    description: "[min_depth, max_depth, ping_min, ping_max] for echogram display"
    required: false
    default: []
  time_min:
    type: str
    description: >
      Start of the displayed window as a UTC timestamp, for example
      "2024-10-15T12:30". Resolved to the closest ping and used instead of the
      ping_min entry in plot_window. Omit to window by ping index.
    required: false
    default: null
  time_max:
    type: str
    description: >
      End of the displayed window as a UTC timestamp. Resolved to the closest
      ping and used instead of the ping_max entry in plot_window. Omit to
      window by ping index.
    required: false
    default: null
  x_axis_units:
    type: str
    description: >
      Units for the clustering echogram x-axis: 'datetime' (default, absolute
      UTC clock times), 'seconds' from the first ping shown, 'pings', 'bins',
      or 'meters'.
    required: false
    default: "datetime"
  y_axis_units:
    type: str
    description: "Units for the clustering echogram y-axis ('meters', 'range_sample', or 'bins')"
    required: false
    default: "meters"
  overlay_line_var:
    type: str
    description: Name of a variable in ds_normalized to draw as a line overlay
    required: false
    default: null
  overlay_windows:
    type: list
    description: >
      Window dicts (as plan_dive_datasets emits) whose line files are drawn
      onto the echogram. Each window's lines are read onto its own pings, so
      every window is a separate segment and windows that overlap in time each
      keep their own line. Empty draws nothing.
    required: false
    default: []
  overlay_window_keys:
    type: list
    description: >
      Window keys naming the line files to draw. Defaults to the three dive
      profile keys dive_fit_evl, dive_u99_evl and dive_l99_evl. A window
      missing a key is skipped for that key.
    required: false
    default: []
  normalization_name:
    type: str
    description: >
      Normalized feature set to plot statistics for when
      cluster_stats_sv_data_var is "ml_features" and no clustering_results
      input is wired. Ignored otherwise; with a result wired, its own
      normalization_name is used.
    required: false
    default: null
  cluster_colors:
    type: list
    description: Hex color strings for each cluster label
    required: false
    default: []
  y_to_x_aspect_ratio_override:
    type: float
    description: Override the echogram aspect ratio; null uses the default
    required: false
    default: null
  cluster_stats_sv_data_var:
    type: str
    description: Sv variable name used when computing per-cluster statistics, or "ml_features" to plot the flattened ML features used for clustering
    required: false
    default: "Sv"
  cluster_stats_compute_pairwise_differences:
    type: bool
    description: >
      Compute inter-channel diffs in cluster statistics, taken against the
      second-lowest-frequency channel
    required: false
    default: true
  cluster_stats_dpi:
    type: int
    description: >
      DPI for the cluster statistics figure, which holds much smaller text
      than the echogram. Null falls back to dpi.
    required: false
    default: 200
  save_image:
    type: bool
    description: Save the rendered figures to image files; null uses runtime defaults
    required: false
    default: null
  save_formats:
    type: list
    description: Image formats to save, chosen from png, svg, jpeg, jpg, and pdf
    required: false
    default: null
  save_dir:
    type: str
    description: Optional directory override for saved image artifacts
    required: false
    default: null
  show:
    type: bool
    description: Whether to display figures interactively or inline; null uses runtime defaults
    required: false
    default: null
  dpi:
    type: int
    description: Optional DPI override for raster image outputs
    required: false
    default: 50
implementations:
  - key: default
    callable_path: aa_si_ml.ml.plot_clustering_report
    default: true
    dependency:
      name: aa-si-ml
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_ML.git