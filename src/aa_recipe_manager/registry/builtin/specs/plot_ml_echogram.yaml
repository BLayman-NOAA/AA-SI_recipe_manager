op: plot_ml_echogram
cache_key: plot_ml_echogram  # pinned cache identity - keep stable across op renames
description: >
  Render a normalized ML feature echogram for inspection.
  This is a sink step: it produces a side-effect (figure) with no data output.
category: visualization
sink: true
inputs:
  ds_normalized:
    type: Dataset
    description: >
      Normalized ML Dataset from normalize_ml_data. Its flattened features
      are folded back onto the ping and range grid for display, which is the
      quickest way to see what the clustering will actually be given.
  ds_Sv:
    type: Dataset
    description: >
      Original Sv Dataset supplying the depth and ping coordinates the axes
      are drawn against. Use the same Sv the MVBS grid was built from, so
      this plot lines up with the Sv echograms next to it.
outputs: {}
params:
  dataset_name:
    type: str
    description: >
      ML dataset to plot. Must match the dataset_name used by
      reshape_for_ml.
    required: true
  normalization_name:
    type: str
    description: >
      Normalized feature set to plot. Must match the normalization_name used
      by normalize_ml_data.
    required: true
  min_depth:
    type: float
    description: Minimum depth (y-axis) in meters
    required: false
    default: 0
  max_depth:
    type: float
    description: >
      Maximum depth (y-axis) in meters. Omit to use the deepest depth present
      in the data.
    required: false
  ping_min:
    type: int
    description: First ping index to display
    required: false
    default: 0
  ping_max:
    type: int
    description: Last ping index to display. Omit to display through the last ping.
    required: false
  time_min:
    type: str
    description: >
      Start of the displayed window as a UTC timestamp, for example
      "2024-10-15T12:30". Resolved to the closest ping and used instead of
      ping_min. Omit to window by ping index.
    required: false
    default: null
  time_max:
    type: str
    description: >
      End of the displayed window as a UTC timestamp. Resolved to the closest
      ping and used instead of ping_max. Omit to window by ping index.
    required: false
    default: null
  x_axis_units:
    type: str
    description: >
      Units for the x-axis: 'datetime' (default, absolute UTC clock times),
      'seconds' from the first ping shown, 'pings', 'meters' (distance
      travelled, derived from the GPS track), or 'bins' (MVBS-derived data
      only).
    required: false
    default: "datetime"
  y_axis_units:
    type: str
    description: >
      Units for the y-axis: 'meters' (default), 'range_sample', or 'bins'
      (MVBS-derived data only).
    required: false
    default: "meters"
  save_image:
    type: bool
    description: Save the rendered figure to an image file; null uses runtime defaults
    required: false
    default: null
  save_formats:
    type: list
    description: Image formats to save, chosen from png, svg, jpeg, jpg, and pdf
    required: false
    default: null
  save_dir:
    type: str
    description: Optional directory override for saved image artifacts
    required: false
    default: null
  show:
    type: bool
    description: Whether to display the figure interactively or inline; null uses runtime defaults
    required: false
    default: null
  dpi:
    type: int
    description: Optional DPI override for raster image outputs
    required: false
    default: 50
implementations:
  - key: default
    callable_path: aa_si_visualization.echogram.plot_flattened_data_echogram
    default: true
    dependency:
      name: aa-si-visualization
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Visualization.git
    param_map:
      ds_normalized: ds_ml
      dataset_name: ml_dataset_name
      normalization_name: ml_specific_data_name
      ds_Sv: ds_Sv_original
