op: reshape_for_ml
cache_key: reshape_for_ml  # pinned cache identity - keep stable across op renames
description: >
  Reshape an MVBS Dataset into a flat, ML-ready xarray Dataset where each
  observation corresponds to one spatial or temporal bin.
category: ml_preprocessing
inputs:
  ds_MVBS:
    type: Dataset
    description: >
      Gridded MVBS Dataset to flatten, from compute_mvbs, or from
      add_line_overlay when a line variable should travel with it. One MVBS
      cell becomes one ML sample, with the channels of that cell as its
      features.
outputs:
  ds_ml_ready:
    type: Dataset
    description: Flattened ML-ready Dataset
params:
  data_var:
    type: str
    description: Name of the data variable to use as features
    required: true
  dataset_name:
    type: str
    description: >
      Name this ML dataset is stored under inside the returned Dataset. Every
      later ML step (add_auxiliary_features, normalize_ml_data, run_hdbscan,
      the ML plots) takes the same dataset_name to find the feature matrix
      again, so a recipe can carry several independent ML datasets side by
      side.
    required: true
  feature_strategy:
    type: str
    description: "Feature construction strategy (e.g. 'mean_centered')"
    required: true
  baseline_channel:
    type: int
    description: Channel index used as the baseline when computing relative features
    required: false
    default: 0
implementations:
  - key: default
    callable_path: aa_si_ml.ml.reshape_data_for_ml
    default: true
    dependency:
      name: aa-si-ml
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_ML.git
    param_map:
      ds_MVBS: ds_Sv
    output_map:
      ds_ml_ready: __return__
