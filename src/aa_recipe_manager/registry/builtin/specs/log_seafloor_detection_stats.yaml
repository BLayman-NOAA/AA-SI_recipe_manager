op: log_seafloor_detection_stats
cache_key: log_seafloor_detection_stats  # pinned cache identity - keep stable across op renames
description: >
  Print per-channel seafloor detection statistics (depth range, valid ping
  count, 10th, 50th and 90th percentile depths). Use before detect_seafloor to
  choose its channel. Produces no data output.
category: detection
sink: true
inputs:
  echodata:
    type: EchoData
    description: "EchoData object containing .bot bottom-detection data"
  ds_Sv:
    type: Dataset
    description: "Baseline Sv dataset used for channel-label alignment reference"
    required: false
outputs: {}
params:
  min_valid_depth_m:
    type: float
    units: m
    description: Minimum depth (m) to consider a detection valid; shallower readings are excluded from statistics
    required: false
    default: 10.0
implementations:
  - key: default
    callable_path: aa_si_utils.utils.log_seafloor_detection_stats
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
