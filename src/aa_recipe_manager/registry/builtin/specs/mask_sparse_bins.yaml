op: mask_sparse_bins
cache_key: mask_sparse_bins  # pinned cache identity - keep stable across op renames
description: >
  Remove spatiotemporal bins with fewer valid samples than a threshold,
  reducing noise in MVBS computation.
category: preprocessing
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Sv Dataset to screen, normally the noise-removed Sv from
      remove_background_noise. Masking has already emptied parts of the grid,
      which is what leaves some bins with too few samples to average.
    expected_variables:
      - Sv
outputs:
  ds_Sv:
    type: Dataset
    description: >
      The same Dataset with samples in under-populated bins set to NaN.
      Feed this to compute_mvbs using the same bin sizes.
    expected_variables:
      - Sv
params:
  range_bin:
    type: str
    description: "Range bin size (e.g. '2m')"
    required: true
  ping_time_bin:
    type: str
    description: "Ping-time bin size (e.g. '10s')"
    required: true
  nan_threshold:
    type: float
    description: Fraction of NaN values above which a bin is masked (0.0 to 1.0)
    required: false
    default: 0.5
  range_var:
    type: str
    description: >
      Meter-valued variable to bin along, which must match the value given to
      compute_mvbs and compute_per_cell_statistics or the sparse mask lands on
      a different grid than the one it is meant to clean. 'echo_range'
      measures from the transducer face, 'depth' from the surface and needs
      the dataset to carry a depth variable. The bin edges are read from the
      first ping of the first channel, so a range variable that varies from
      ping to ping, as depth does under platform vertical offsets, is
      approximated by its first ping.
    required: false
    default: "echo_range"
implementations:
  - key: default
    callable_path: aa_si_utils.utils.mask_sparse_bins
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      ds_Sv: __return__
