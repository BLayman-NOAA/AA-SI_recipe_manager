op: merge_datasets
cache_key: merge_datasets  # pinned cache identity - keep stable across op renames
description: >
  Reconsolidate a collected list of xarray Datasets into a single Dataset by
  concatenating along a dimension. This is the recipe system's fan-in (collect)
  target for segment-parallel work: a mapped step that produces one Dataset per
  data segment (e.g. per-file MVBS) is gathered via ``collect`` and merged back
  into one Dataset along ``dim`` (default ``ping_time``). A single Dataset
  passes through unchanged (single-item transparency).
category: processing
inputs:
  datasets:
    type: Dataset | DataArray
    many: true
    description: >
      Collected list of Datasets (one per mapped/swept instance), supplied by a
      ``collect: ${mapped_step.output}`` directive on the recipe step.
outputs:
  merged:
    type: Dataset | DataArray
    description: >
      Single concatenated result, matching the collected element type: a
      Dataset for collected Datasets, a DataArray for collected DataArrays
      (e.g. a per-file detect_seafloor line collected into a survey-wide one).
params:
  dim:
    type: str
    required: false
    default: ping_time
    description: Dimension to concatenate the collected Datasets along.
  on_duplicate:
    type: str
    description: >
      What to do when two collected segments carry the same label on ``dim``.

      Unset (the default) leaves both, which is right when segments cannot
      overlap - per-file Sv concatenated on raw ping_time, for instance.

      "mean" averages them into one entry. That is what a fan-in over per
      segment BINNED products needs: compute_mvbs and
      compute_per_cell_statistics anchor their time bins to a global origin, so
      a segment boundary falling inside a bin makes the segment on each side
      emit that bin, each holding part of its pings. Left alone the merged store
      carries a duplicate index, which every downstream reindex rejects -
      add_auxiliary_features raises InvalidIndexError on it.

      "first" keeps the first entry for a label and sorts the result. That is
      what a fan-in over overlapping SLICES OF ONE STORE needs: dive windows
      cut from the survey grid, where two dives sharing a minute are the same
      cells twice, so nothing should be averaged. A per-segment variable that
      differs on the overlap is kept from the first segment only, which is the
      sign it does not belong on the shared axis; attach it per segment after
      the fan-in.

      Variables carrying "units: dB" are averaged in the linear domain and
      converted back, since a mean of decibels is not the mean of what they
      measure. The average is unweighted: the partial bins do not record how
      many pings each held.
    required: false
    default: null
implementations:
  - key: default
    callable_path: aa_si_utils.utils.concat_datasets
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    param_map:
      datasets: datasets
      dim: dim
      on_duplicate: on_duplicate
    output_map:
      merged: __return__
