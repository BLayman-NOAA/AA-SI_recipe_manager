op: merge_datasets
cache_key: merge_datasets  # pinned cache identity - keep stable across op renames
description: >
  Concatenate a collected list of Datasets into one along ``dim``, for example
  per-file MVBS gathered with ``collect``. A single Dataset passes through
  unchanged.
notes: >
  The fan-in target for segment-parallel work: a mapped step produces one
  Dataset per data segment, and ``collect`` hands the list to this op.
category: processing
inputs:
  datasets:
    type: Dataset | DataArray
    many: true
    description: >
      Collected list of Datasets, one per mapped or swept instance, supplied by
      ``collect: ${mapped_step.output}`` on the recipe step.
outputs:
  merged:
    type: Dataset | DataArray
    description: >
      The concatenated result: a Dataset for collected Datasets, a DataArray
      for collected DataArrays (such as per-file seafloor lines).
params:
  dim:
    type: str
    required: false
    default: ping_time
    description: Dimension to concatenate the collected Datasets along.
  on_duplicate:
    type: str
    description: >
      How to handle two collected segments with the same label on ``dim``.
      Unset keeps both (fine when segments can't overlap). "mean" averages them
      (binned products split at a segment boundary). "first" keeps the first
      and sorts (overlapping slices of one store).
    notes: >
      Unset suits per-file Sv concatenated on raw ping_time, where segments
      never overlap.

      "mean" suits a fan-in over per segment binned products. compute_mvbs and
      compute_per_cell_statistics anchor their time bins to a global origin, so
      a segment boundary inside a bin makes the segments on both sides emit
      that bin, each holding part of its pings. Left alone, the merged store
      carries a duplicate index that every downstream reindex rejects;
      add_auxiliary_features raises InvalidIndexError on it.

      "first" suits a fan-in over overlapping slices of one store, such as dive
      windows cut from the survey grid, where two dives sharing a minute hold
      the same cells twice and nothing should be averaged. A per segment
      variable that differs on the overlap is kept from the first segment only,
      a sign it does not belong on the shared axis; attach it per segment after
      the fan-in.

      With "mean", variables with "units: dB" are averaged in the linear domain
      and converted back, since a mean of decibels is not the mean of what they
      measure. The average is unweighted: the partial bins do not record how
      many pings each held.
    required: false
    default: null
implementations:
  - key: default
    callable_path: aa_si_utils.utils.concat_datasets
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    param_map:
      datasets: datasets
      dim: dim
      on_duplicate: on_duplicate
    output_map:
      merged: __return__
