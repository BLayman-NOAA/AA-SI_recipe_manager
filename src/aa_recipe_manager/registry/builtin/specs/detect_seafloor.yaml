op: detect_seafloor
cache_key: detect_seafloor  # pinned cache identity - keep stable across op renames
description: >
  Detect the seafloor depth per ping, in metres, from the echosounder's own
  bottom pick or from Sv. Use log_seafloor_detection_stats first to compare
  channels.
notes: >
  Multiple implementations are supported (.bot-based, algorithmic Sv-based,
  external or manual sources). The output is always 1-D (ping_time,), whether
  the channel is chosen automatically or given.
category: detection
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Optional calibrated Sv. When it carries depth, the line is measured from
      the surface rather than the transducer.
    notes: >
      Sv-based methods read it. Detection from the echosounder's own bottom
      pick reads echodata alone.
    required: false
  echodata:
    type: EchoData
    description: >
      Raw EchoData carrying the pings and any bottom detection the
      echosounder recorded (the .bot data read by read_raw_files when
      include_bot is true).
outputs:
  seafloor_depth:
    type: DataArray
    description: >
      Detected seafloor depth in metres per ping, with no channel dimension.
params:
  channel:
    type: str
    description: >
      Channel label to use for seafloor detection, matching the channel label
      as it appears in the EchoData (e.g. "38000"). When null (the default),
      the implementation selects the highest-quality channel automatically.
    required: false
    default: null
  min_valid_depth_m:
    type: float
    units: m
    description: Minimum depth (m) to consider a detection valid; shallower readings are discarded
    required: false
    default: 10.0
implementations:
  - key: default
    callable_path: aa_si_utils.utils.detect_seafloor
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      seafloor_depth: __return__
