op: rechunk_dataset
cache_key: rechunk_dataset  # pinned cache identity - keep stable across op renames
description: >
  Rechunk a Dataset along ping_time. A standalone step rather than a
  parameter on any particular masking or reduction op, so a recipe can
  insert (or remove) chunking wherever a downstream op should run
  dask-parallel, independent of which step happens to run immediately
  before it.
category: preprocessing
inputs:
  ds_Sv:
    type: Dataset
    expected_variables:
      - Sv
outputs:
  ds_Sv:
    type: Dataset
    expected_variables:
      - Sv
params:
  ping_time_chunk:
    type: int
    description: "Target chunk size along ping_time."
    required: true
implementations:
  - key: default
    callable_path: aa_si_utils.utils.rechunk_dataset
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      ds_Sv: __return__
