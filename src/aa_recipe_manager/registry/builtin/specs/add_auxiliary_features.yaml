op: add_auxiliary_features
cache_key: add_auxiliary_features  # pinned cache identity - keep stable across op renames
description: >
  Append auxiliary coordinate-derived features (e.g. depth, ping_time_seconds)
  to the flattened ML-ready Dataset. Optional step; omit when no auxiliary
  features are needed.
category: ml_preprocessing
inputs:
  ds_ml:
    type: Dataset
    description: >
      Flattened ML Dataset from reshape_for_ml. The new features are appended
      as extra columns on its feature matrix.
  echodata:
    type: EchoData
    description: >
      Raw EchoData supplying the echosounder's own bottom pick, used for the
      'seafloor_depth' and 'altitude' features when the seafloor_depth input
      is not wired. Ignored when it is.
    required: false
  ds_sv:
    type: Dataset
    required: false
    description: >
      Dataset returned by compute_per_cell_statistics, carrying per-MVBS-cell
      statistic variables (e.g. cell_cv). Required when 'cell_cv' is listed
      in features.
  seafloor_depth:
    type: DataArray
    required: false
    description: >
      Pre-detected seafloor line, 1-D over ping_time, typically wired from a
      detect_seafloor step. Takes precedence over echodata for the
      'seafloor_depth' and 'altitude' features, so the ML features use the
      same line the masking stack used instead of a channel mean recomputed
      internally. Either this or echodata is required for those features.

      In a per-file map_over pipeline, wire it straight from the mapped
      detect_seafloor step (${detect_seafloor.seafloor_depth}): the reference
      resolves to the list of per-file lines, which is concatenated along
      ping_time in segment order. No separate collect step is needed.

      Vertical reference: 'altitude' is a difference (seafloor minus sample),
      so a constant offset shared by both terms cancels and the frame does not
      matter as long as they agree. They normally do: detect_seafloor promotes
      its line to surface-referenced only when its ds_Sv carries depth, the
      same condition under which depth reaches the ML dataset, and 'altitude'
      prefers depth over echo_range to pair with it.
outputs:
  ds_ml_ready:
    type: Dataset
    description: ML-ready Dataset with auxiliary features appended
params:
  dataset_name:
    type: str
    description: >
      ML dataset to append the features to. Must match the dataset_name used
      by reshape_for_ml.
    required: true
  features:
    type: list
    description: >
      List of built-in feature name strings to append. Supported built-ins:
      'depth', 'ping_time_seconds', 'seafloor_depth', 'altitude', 'cell_cv'.
      'seafloor_depth' and 'altitude' require the echodata input.
      'cell_cv' requires the ds_sv input (from compute_per_cell_statistics).
    required: true
implementations:
  - key: default
    callable_path: aa_si_ml.ml.add_auxiliary_features
    default: true
    dependency:
      name: aa-si-ml
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_ML.git
    param_map:
      ds_ml: ds_ml_ready
    output_map:
      ds_ml_ready: __return__

