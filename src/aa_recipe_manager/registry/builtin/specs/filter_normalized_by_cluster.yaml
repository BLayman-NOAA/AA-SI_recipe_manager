op: filter_normalized_by_cluster
cache_key: filter_normalized_by_cluster  # pinned cache identity - keep stable across op renames
description: >
  Subset the normalised ML Dataset to the samples of one cluster label from a
  run_hdbscan result, such as the noise points (-1). The result can go
  straight to run_hdbscan for a second pass.
notes: >
  It processes one cluster_label at a time so a map_over can fan it out across
  all cluster labels (for example map_over: ${run_hdbscan.cluster_labels})
  without changes to this op or its spec.
category: ml_clustering
inputs:
  ds_normalized:
    type: Dataset
    description: Normalised ML Dataset produced by normalize_ml_data.
  clustering_results:
    type: Dataset
    description: Clustering result Dataset from run_hdbscan.
outputs:
  ds_normalized_filtered:
    type: Dataset
    description: >
      Copy of ds_normalized subsetted to the samples of the requested
      cluster_label, ready for run_hdbscan.
    notes: >
      Only the normalised feature variable is subsetted. The full
      sample_index_to_grid_index mapping is preserved.
params:
  cluster_label:
    type: int
    description: >
      Label of the cluster to isolate. Use -1 (default) to select noise
      points for re-clustering. Any non-negative integer selects that
      specific cluster for sub-cluster refinement.
    required: false
    default: -1
  dataset_name:
    type: str
    description: >
      ML dataset to subset. Must match the dataset_name used by
      reshape_for_ml.
    required: true
  normalization_name:
    type: str
    description: >
      Normalized feature set to subset, matching the normalization_name used
      by normalize_ml_data. The filtered copy keeps this name, so the
      second-pass run_hdbscan takes the same value.
    required: true
implementations:
  - key: default
    callable_path: aa_si_ml.ml.filter_normalized_by_cluster
    default: true
    dependency:
      name: aa-si-ml
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_ML.git
    output_map:
      ds_normalized_filtered: "['ds_normalized_filtered']"
