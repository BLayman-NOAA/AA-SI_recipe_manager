op: combine_raw_files
cache_key: combine_raw_files  # pinned cache identity - keep stable across op renames
description: >
  Combine the per-file stores or EchoData objects from read_raw_files into one
  EchoData object. Mark the step checkpoint: always so the combined output is
  written once and reused.
notes: >
  The reading and the combine itself are echopype.open_converted and
  echopype.combine_echodata, opening stores lazily. Around them this step adds
  store-path handling, input ordering, and the ping_time chunking of the
  combined result.
category: io
inputs:
  raw_stores:
    type: list
    description: Store paths (zarr/netcdf strings) or in-memory EchoData objects
outputs:
  echodata:
    type: EchoData
    description: Combined echopype EchoData object
params:
  ping_time_chunk:
    type: int
    required: false
    default: 1000
    description: >
      Chunk length along ping_time for the combined EchoData and its
      checkpoint, in pings. Larger values write faster to gs:// but use more
      memory; try 2000 to 4000 for bucket caches.
    notes: >
      Larger values mean fewer, bigger objects: faster remote checkpoint writes
      and fewer read requests, at the cost of more RAM per computed chunk and
      coarser lazy-read granularity for windowed access. 1000 is a balanced
      default; raise it for bucket-backed caches when the combined checkpoint
      write is slow and memory allows.
implementations:
  - key: default
    callable_path: aa_si_utils.utils.combine_raw_stores
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      echodata: __return__
