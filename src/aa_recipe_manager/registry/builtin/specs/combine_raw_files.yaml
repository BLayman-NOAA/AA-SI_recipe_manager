op: combine_raw_files
description: >
  Lazily open per-file intermediate stores (zarr or netcdf paths) produced by
  read_raw_files, or combine in-memory EchoData objects (none mode), into a
  single combined EchoData object. Mark this step checkpoint: always in your
  recipe so the checkpoint system writes the combined output once and reuses it
  on subsequent runs.
category: io
inputs:
  raw_stores:
    type: list
    description: Store paths (zarr/netcdf strings) or in-memory EchoData objects
outputs:
  echodata:
    type: EchoData
    description: Combined echopype EchoData object
params:
  ping_time_chunk:
    type: int
    required: false
    default: 1000
    description: >
      Target chunk length along ping_time for the combined EchoData, which
      directly sets the chunking of the downstream zarr checkpoint. Larger
      values mean fewer, bigger objects — faster remote (gs://) checkpoint
      writes and fewer read requests, at the cost of more RAM per computed
      chunk and coarser lazy-read granularity for windowed access. 1000 is a
      balanced default; try 2000-4000 for bucket-backed caches if the combined
      checkpoint write is slow and memory allows.
implementations:
  - key: default
    callable_path: aa_si_utils.utils.combine_raw_stores
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      echodata: __return__
