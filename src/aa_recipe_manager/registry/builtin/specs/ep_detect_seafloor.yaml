op: ep_detect_seafloor
cache_key: ep_detect_seafloor  # pinned cache identity - keep stable across op renames
description: >
  Detect the seafloor in metres per ping with echopype's "basic" or
  "blackwell" detector. Swaps in for ``detect_seafloor``; the step takes no
  ``echodata`` input.
notes: >
  This step is echopype.mask.api.detect_seafloor called directly, so the
  detection itself is entirely echopype's. ``method`` selects the
  implementation and ``method_params`` carries its keyword arguments.

  The output port name (``seafloor_depth``) and shape (1-D, ping_time) match
  ``detect_seafloor``, so downstream steps such as ``create_seafloor_mask``
  work unchanged. The recipe step's ``inputs`` must drop the ``echodata``
  line (echopype's detector does not use a separate EchoData source) and the
  ``params`` block must use ``method`` and ``method_params`` instead of
  ``channel`` and ``min_valid_depth_m``.
category: detection
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Calibrated Sv dataset with ping_time, a vertical coordinate such as
      depth, and Sv; "blackwell" also needs split-beam angles.
outputs:
  seafloor_depth:
    type: DataArray
    description: >
      Detected seafloor depth in metres per ping, with no channel dimension.
params:
  method:
    type: str
    description: >
      Echopype detection method: "basic" (Sv threshold) or "blackwell" (Sv and
      split-beam angle).
    required: false
    default: "basic"
  method_params:
    type: dict
    description: >
      Keyword arguments for the chosen echopype method, such as var_name,
      channel, threshold (dB) and offset_m ("basic") or offset ("blackwell").
      Unset keys use the method's defaults; the full list is in the notes.
    notes: >
      basic: var_name (str), the Sv variable in dB, e.g. "Sv"; channel (str),
      the channel to select; threshold (float or (float, float), default
      -50.0), the Sv threshold in dB, where a single value is the lower bound
      (upper = lower + 10 dB) and a 2-tuple gives (tmin, tmax); offset_m
      (float, default 0.5), metres subtracted from the detected crossing;
      bin_skip_from_surface (int, default 200), shallow range bins ignored
      before searching.

      blackwell: var_name (str), the Sv variable; channel (str), the channel
      to select; threshold (float or (float, float, float), default -75),
      either a single Sv dB threshold (angle thresholds use defaults) or a
      3-tuple (tSv_dB, ttheta, tphi) after angle smoothing; offset (float,
      default 0.3), metres subtracted from the detected bottom; r0 (float,
      default 0) and r1 (float, default 500), the shallow and deep bounds in m
      of the detection range; wtheta (int, default 28) and wphi (int, default
      52), square smoothing windows in pixels for the along-ship and
      athwart-ship angles.
    required: false
    default: {}
implementations:
  - key: default
    callable_path: echopype.mask.api.detect_seafloor
    default: true
    dependency:
      name: echopype
      version: ">=0.6.0"
      source: pypi
    param_map:
      ds_Sv: ds
      method_params: params
    output_map:
      seafloor_depth: __return__
