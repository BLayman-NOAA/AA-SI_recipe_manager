op: generate_standardized_cal_mapping
cache_key: generate_standardized_cal_mapping  # pinned cache identity - keep stable across op renames
description: >
  Read manufacturer calibration files, convert them to per-channel standardized
  files, match each raw channel to its calibration data, and return a mapping
  dict and a calibration dict.
category: calibration
inputs: {}
outputs:
  mapping_dict:
    type: dict
    description: Maps each raw channel to its standardized calibration file path
  calibration_dict:
    type: dict
    description: Parsed standardized calibration data keyed by channel
params:
  raw_input_folder:
    type: path
    description: >
      Folder containing raw acoustic files; used to determine channel
      configuration. May be a local path or a remote fsspec URL (e.g.
      gs://bucket/survey/raw). Remote raw files are scanned one at a time:
      each is downloaded to local scratch, read for its channel config, and
      the local copy deleted before the next file is fetched.
    required: true
    constraints:
      # Auto-create if missing: typically populated by download_ncei_data.
      create_if_missing: true
  cal_input_folder:
    type: path
    description: >
      Folder containing manufacturer calibration files (.cal / .xml). May be a
      local path or a remote fsspec URL; a remote folder is downloaded to a
      local scratch directory for the duration of the parse (these files are
      small) and removed afterwards.
    required: true
    constraints:
      # Auto-create if missing so dry-run does not fail before the user has
      # placed calibration files. The step itself will error at run time if
      # the folder is empty.
      create_if_missing: true
  output_base:
    type: path
    required: true
    constraints:
      must_exist: false
  cruise_id:
    type: str
    required: true
  record_author:
    type: str
    required: true
  short_filenames:
    type: bool
    required: false
    default: true
  keep_unused:
    type: bool
    description: Retain standardized files not matched to any channel
    required: false
    default: true
  conflict_resolution:
    type: str
    description: "'error' or 'interactive' when multiple cal files match a channel"
    required: false
    default: "error"
  verbose:
    type: bool
    description: Print progress information during mapping; implementation-specific
    required: false
    default: true
  file_time_start:
    type: str
    required: false
    description: >-
      Optional inclusive ISO datetime restricting the scanned raw files to those
      whose filename-encoded time (D{YYYYMMDD}-T{HHMMSS}) is at or after this
      bound. Should match the initial_setup window so the channel-configuration
      scan covers exactly the files being processed. For remote folders the
      filter is applied before any file is downloaded.
  file_time_end:
    type: str
    required: false
    description: >-
      Optional inclusive ISO datetime upper bound for filename-encoded file
      times. See file_time_start.
implementations:
  - key: default
    callable_path: aa_si_calibration.calibration.generate_standardized_cal_mapping
    default: true
    dependency:
      name: aa-si-calibration
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_calibration.git
    output_map:
      mapping_dict: "['mapping_dict']"
      calibration_dict: "['calibration_dict']"
