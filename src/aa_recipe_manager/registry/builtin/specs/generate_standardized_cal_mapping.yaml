op: generate_standardized_cal_mapping
cache_key: generate_standardized_cal_mapping  # pinned cache identity - keep stable across op renames
description: >
  Read manufacturer calibration files, convert them to per-channel standardized
  files, match each raw channel to its calibration data, and return a mapping
  dict and a calibration dict.
category: calibration
inputs: {}
outputs:
  mapping_dict:
    type: dict
    description: Maps each raw channel to its standardized calibration file path
  calibration_dict:
    type: dict
    description: Parsed standardized calibration data keyed by channel
params:
  raw_input_folder:
    type: path
    description: >
      Folder of raw files whose channel configuration is scanned, local or a
      remote URL such as gs://bucket/survey/raw.
    notes: >
      Remote raw files are scanned one at a time: each is downloaded to local
      scratch, read for its channel config, and the local copy deleted before
      the next file is fetched.
    required: true
    constraints:
      # Auto-create if missing: typically populated by download_ncei_data.
      create_if_missing: true
  cal_input_folder:
    type: path
    description: >
      Folder of manufacturer calibration files (.cal or .xml), local or a
      remote URL.
    notes: >
      A remote folder is downloaded to a local scratch directory for the
      duration of the parse (these files are small) and removed afterwards.
    required: true
    constraints:
      # Auto-create if missing so dry-run does not fail before the user has
      # placed calibration files. The step itself will error at run time if
      # the folder is empty.
      create_if_missing: true
  output_base:
    type: path
    description: >
      Root directory the standardized calibration files, mapping files, and
      logs are written under. Normally wired to
      ${initial_setup.calibration_output_dir}.
    required: true
    constraints:
      must_exist: false
  cruise_id:
    type: str
    description: >
      Cruise identifier recorded in every generated single-channel
      calibration file (e.g. "HB1603"), so a standardized file stays
      traceable to the survey it came from.
    required: true
  record_author:
    type: str
    description: >
      Name recorded as the author of every generated single-channel
      calibration file. Not used in any calculation.
    required: true
  short_filenames:
    type: bool
    description: >
      Use compact names for the generated single-channel files and the keys
      in mapping_dict. Set false for fully descriptive names, which are
      easier to read and longer.
    required: false
    default: true
  keep_unused:
    type: bool
    description: Retain standardized files not matched to any channel
    required: false
    default: true
  conflict_resolution:
    type: str
    description: "'error' or 'interactive' when multiple cal files match a channel"
    required: false
    default: "error"
  verbose:
    type: bool
    description: Print progress information during mapping; implementation-specific
    required: false
    default: true
  file_time_start:
    type: str
    required: false
    description: >-
      Inclusive ISO datetime; only raw files whose filename time
      (D{YYYYMMDD}-T{HHMMSS}) is at or after it are scanned. Match the
      initial_setup window. Unset scans from the first file.
    notes: >-
      Matching the initial_setup window makes the channel-configuration scan
      cover exactly the files being processed. For remote folders the filter
      is applied before any file is downloaded.
  file_time_end:
    type: str
    required: false
    description: >-
      Optional inclusive ISO datetime upper bound for filename-encoded file
      times. See file_time_start.
implementations:
  - key: default
    callable_path: aa_si_calibration.calibration.generate_standardized_cal_mapping
    default: true
    dependency:
      name: aa-si-calibration
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_calibration.git
    output_map:
      mapping_dict: "['mapping_dict']"
      calibration_dict: "['calibration_dict']"
