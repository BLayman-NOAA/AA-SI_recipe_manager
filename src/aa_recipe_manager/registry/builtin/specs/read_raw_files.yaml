op: read_raw_files
cache_key: read_raw_files  # pinned cache identity - keep stable across op renames
description: >
  Open raw echosounder files with echopype and write each one to an
  intermediate store. Returns the store paths, or in-memory EchoData objects
  when intermediate_format is "none".
notes: >
  The per-file conversion is echopype.open_raw, and sonar_model, include_bot,
  and use_swap are forwarded to it. Around that call this step adds remote
  file staging, .bot companion handling, and writing each result to an
  intermediate store. It is the future map_over target for parallel per-file
  processing.
category: io
inputs:
  raw_file_paths:
    type: list
    description: >
      Paths to .raw files to open, local or remote URLs such as
      gs://bucket/survey/file.raw. Remote files are copied locally one at a
      time and never modified.
    notes: >
      Each remote file is downloaded to a local scratch directory, converted,
      and the local copy deleted before the next file is fetched, so the
      machine only ever holds about one raw file at a time. Bucket objects are
      never modified or deleted.
    # Harvested into run provenance for recipes that read raw files directly
    # (no initial_setup step that materializes the list as an output).
    provenance_role: raw_file_list
outputs:
  raw_stores:
    type: list
    description: >
      Store path strings (zarr/netcdf) written to exe_temp/data, or in-memory
      EchoData objects when intermediate_format is "none".
params:
  sonar_model:
    type: str
    description: "Sonar model string recognized by echopype (e.g. 'EK60', 'EK80')"
    required: true
  include_bot:
    type: bool
    description: Include bottom-detection (.bot) data if available
    required: false
    default: true
  intermediate_format:
    type: str
    description: >
      Store format written between reading and combining. "netcdf" (default,
      recommended) writes temporary .nc files. "none" keeps everything in
      memory. "zarr" writes zarr stores, which can live on a gs:// temp dir.
    notes: >
      "netcdf": each raw file is written as a temporary .nc file, reopened,
      and combined. After combining, all EchoData groups are rechunked to a
      single uniform chunk so the downstream zarr v2 checkpoint write
      (combine_raw with checkpoint: always) always succeeds.

      "none" suits a dataset that fits comfortably in RAM.

      "zarr": each raw file is written as a temporary zarr store
      (zarr_format=2, matching the checkpoint writer) and reopened lazily for
      combining. Unlike netcdf, zarr stores can live on remote object storage
      by passing a gs:// --temp-dir, the intended path for surveys too large
      to stage on local disk. Combined with gs:// raw_file_paths, local disk
      usage stays at roughly one raw file for the whole run. It is otherwise
      not recommended over netcdf.
    required: false
    default: "netcdf"
  use_swap:
    type: str
    description: >
      Whether echopype swaps data to disk while reading. "auto" (default)
      swaps a file whose expanded data would exceed about 40% of total RAM.
    notes: >
      Passed to echopype open_raw as use_swap.
    required: false
    default: "auto"
implementations:
  - key: default
    callable_path: aa_si_utils.utils.read_raw_files_to_stores
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      raw_stores: __return__
