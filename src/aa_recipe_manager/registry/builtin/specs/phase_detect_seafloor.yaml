op: phase_detect_seafloor
cache_key: phase_detect_seafloor  # pinned cache identity - keep stable across op renames
# 2: absolute seabed Sv floor (min_seabed_sv_db) and empty-window pings
# skipped instead of raising; lines cached under 1 picked scattering layers
# on files with no seabed in range.
version: "2"
description: >
  Detect the seafloor from Sv and split-beam phase, returning the seabed
  echo's leading edge in metres per ping. Swaps in for the other seafloor
  ops, so ``create_seafloor_mask`` works unchanged; put any dead-zone offset
  in its ``seafloor_buffer_m``.
notes: >
  On the primary channel the detector finds phase-stable, loud seed regions
  and scores every sample inside a search window on Sv, local phase
  stability, echo asymmetry, SNR and the leading-edge energy gradient (Mode 1
  of the v4 design). ``mode: 2`` adds the below versus above Sv contrast,
  below-region stationarity and below-region phase activity, for when dense
  near-bottom aggregations are confused with the seabed. A Viterbi pass then
  runs over the top score maxima per ping with a Huber transition whose
  break-point scales with the distance the vessel travelled between pings.
  The pick is walked back to the -10 dB point of the echo, and a
  forward-backward pass gives a confidence and margin per ping.

  The output port name (``seafloor_depth``) and shape (1-D, ping_time) match
  ``detect_seafloor``, ``ep_detect_seafloor``, ``read_seafloor_line`` and
  ``hdbscan_detect_seafloor``. By default the line is the leading edge, not
  an integration line. ``line: integration`` returns the Ona-Mitson
  backstepped line with the slope correction instead, which on the HB1603
  canyon walls clears the up-slope echo that a 10 m buffer above the leading
  edge left in the 18 kHz channel. Every intermediate is available through
  ``diagnostics_path``.

  With no window or prior given, the op first runs a fast slab estimator
  (Mode 0b) over the whole recorded range. It averages a few dozen slabs of
  pings, scores them and joins them with the same line search, adding slabs
  where the seabed moves; its line and uncertainty become the per-ping search
  window for the full detector. ``r_min`` and ``r_max`` bound that search and
  ``z_prior`` replaces it.

  Split-beam angles come from ``ds_Sv`` when ``ep_add_splitbeam_angle`` ran
  upstream. Without them the detector runs amplitude-only with a warning:
  seeds are picked on Sv and extent alone, so a dense aggregation can be
  taken for the seabed. Pings where no candidate clears ``min_score`` are
  bridged by the line search and interpolated up to ``max_gap_s``; longer
  runs and the ends of the file stay NaN, which ``create_seafloor_mask``
  masks entirely. Aliased-seabed detection is off by default: it is
  single-channel only, and on HB1603 the water-column angle noise alone
  tripped it and the mask covered the true seabed.

  Measured 2026-09-24 on one file each: HB1603 38 kHz at 1750 m (EK60, 8 s
  pinging) followed the seabed through a 100 m step with a median 8 m offset
  above the .bot line, which itself sits below the Sv rise; HB2407 18 kHz at
  57 m (EK80) sat 2 m below the Echoview line with no gross errors. Both take
  a few seconds per file after Sv is computed.
category: detection
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Calibrated Sv dataset, ideally from ``ep_add_splitbeam_angle`` so depth
      and phase are available. Without ``depth`` the line is measured from the
      transducer.
    notes: >
      Needs ``echo_range`` and the ``tau_effective``, ``sound_speed`` and
      beamwidth variables that ``compute_sv`` attaches. The ``ep_add_depth``
      dataset makes the line surface-referenced; ``ep_add_splitbeam_angle``
      adds the angles the phase features need.
  echodata:
    type: EchoData
    description: >
      Accepted for interface parity with the other seafloor detection ops;
      not read.
    required: false
  z_prior:
    type: DataArray
    description: >
      Optional expected seabed depth per ping, such as another detector's
      line, on any ping grid. Sets the search window to z_prior +/- 3
      sigma_prior_m, overriding r_min and r_max where they conflict.
    required: false
outputs:
  seafloor_depth:
    type: DataArray
    description: >
      Seabed leading edge in metres on ds_Sv's ping_time. Attributes record
      the vertical reference, channel, regime, ping coverage and the counts of
      flagged and interpolated pings.
params:
  channel:
    type: str
    description: >
      Primary channel, as its label or its frequency in Hz or kHz as a string
      (e.g. "38"). Null picks the lowest frequency with enough seabed seeds.
    notes: >
      Null picks the lowest frequency channel whose seeds span at least a
      fifth of the pings, falling back to the lowest frequency with a warning.
    required: false
    default: null
  r_min:
    type: float
    units: m
    description: >
      Lower bound of the search window on the dataset's range reference.
      Default 10 m past the first sample, which skips the transmit pulse.
    required: false
    default: null
  r_max:
    type: float
    units: m
    description: >
      Upper bound of the search window. Default the end of the channel's
      range. Set both bounds on deep surveys to keep the run fast.
    notes: >
      The crop the two bounds define is what keeps a 15000-sample ping
      affordable.
    required: false
    default: null
  sigma_prior_m:
    type: float
    units: m
    description: >
      Uncertainty of z_prior; default 2 % of z_prior. Ignored without it.
    required: false
    default: null
  regime:
    type: str
    description: >
      Depth regime preset: "shelf" (< 200 m), "slope" (200 to 1000 m),
      "deep" (> 1000 m) or "auto" from the search window midpoint. Sets
      the SNR reference, the seed Sv floor and the Mode 2 shape window.
    required: false
    default: "auto"
  mode:
    type: int
    description: >
      Scoring mode. 1 scores the six point features; 2 adds three local shape
      features, a little slower, which help where a school sits on the bottom.
    notes: >
      Mode 2 is Stage 3b of the design. Both modes are deterministic.
    required: false
    default: 1
  line:
    type: str
    description: >
      Line to return: "leading_edge" (default), the start of the seabed echo,
      or "integration", the backstepped line with slope correction.
    required: false
    default: "leading_edge"
  prior:
    type: str
    description: >
      "auto" (default) runs the Mode 0 slab estimator when no z_prior is
      given and uses it as the search window; "none" searches only the
      fixed r_min / r_max window.
    required: false
    default: "auto"
  missing:
    type: str
    description: >
      Value for pings with no seabed found after gap filling. "nan" (default)
      masks the whole ping downstream, for analysis. "max_range" uses the last
      recorded range, keeping the ping for survey pictures.
    notes: >
      "max_range" suits a survey picture where the seabed is sometimes below
      the recording. The ping_coverage attribute still counts only detections.
    required: false
    default: "nan"
  min_seabed_sv_db:
    type: float
    units: dB
    description: >
      Minimum mean Sv over one pulse length below a pick for it to count as
      seabed. Null disables the check.
    notes: >
      Applied both in the prior's slabs and in the final line. The scores are
      relative to each ping, so without a floor a file whose seabed lies
      beyond the recorded range picks its loudest scattering layer instead (on
      HB1603, a -57 dB layer just past the near field). Seabed echoes on
      HB1603 and HB2407 run -13 to -40 dB.
    required: false
    default: -50.0
  prior_budget:
    type: int
    description: >
      Number of slabs (small groups of pings) the prior estimator reads.
    notes: >
      Each slab reads a few pings across the range; on a zarr store chunked
      along ping_time a slab costs one chunk read.
    required: false
    default: 64
  n_candidates:
    type: int
    description: Score maxima kept per ping for the line search.
    required: false
    default: 5
  max_slope_deg:
    type: float
    units: deg
    description: >
      Maximum plausible seabed slope; larger depth jumps between pings are
      penalized. Use 45 on rocky or canyon terrain.
    notes: >
      With the distance travelled between pings it sets the depth change the
      transition cost treats as ordinary; larger jumps are tolerated at linear
      cost.
    required: false
    default: 30.0
  alpha:
    type: float
    description: Transition strength multiplier in [0.5, 2].
    required: false
    default: 1.0
  beta_fraction:
    type: float
    description: >
      Shallow-first tie-break prior as a fraction of the candidate score
      spread; 0 disables it. Targets ghost bottoms and the echo tail.
    required: false
    default: 0.1
  min_score:
    type: float
    description: >
      Candidates below this score are dropped; a ping with none is skipped
      and bridged. Scores are sums of tanh terms, so 0 means neutral.
    required: false
    default: 0.0
  walkback_db:
    type: float
    units: dB
    description: Drop below the echo peak that marks the leading edge.
    required: false
    default: 10.0
  effective_beamwidth_deg:
    type: float
    units: deg
    description: >
      Effective beamwidth for the backstepped integration line in the
      diagnostics; default nominal times 12/7 (the ES38B ratio).
    required: false
    default: null
  vessel_speed_m_s:
    type: float
    units: m/s
    description: >
      Vessel speed for along-track distance when ds_Sv has no latitude and
      longitude. Set it for transects without position data.
    notes: >
      Without position or speed, the transition break-point falls to one pulse
      length per ping, which suits a station but over-smooths a transect.
    required: false
    default: null
  min_confidence:
    type: float
    description: Pings whose posterior confidence is below this are flagged.
    required: false
    default: 0.8
  phase_weight:
    type: float
    description: >
      Weight of the two phase features. Raise to 1.5 where fish
      aggregations are the main confuser.
    required: false
    default: 1.0
  max_gap_s:
    type: float
    units: s
    description: >
      Interior runs of skipped pings up to this long are interpolated;
      longer runs stay NaN. Null interpolates nothing.
    required: false
    default: 30.0
  transition:
    type: str
    description: '"huber" or "truncated" (quadratic capped at the break-point, for cliffs).'
    required: false
    default: "huber"
  pulse_length_s:
    type: float
    units: s
    description: Pulse duration when ds_Sv has no tau_effective.
    required: false
    default: null
  beamwidth_deg:
    type: float
    units: deg
    description: Nominal beamwidth when ds_Sv has none.
    required: false
    default: null
  detect_aliases:
    type: bool
    description: >
      Detect aliased seabed echoes on the primary channel and exclude them.
      Off by default; it can mask the true seabed in noisy water.
    notes: >
      Runs the single-channel Blackwell aliased-seabed detector. On HB1603 the
      water-column angle noise alone tripped it and the mask covered the true
      seabed.
    required: false
    default: false
  phase_threshold_deg2:
    type: float
    units: deg2
    description: >
      Seed phase-stability threshold on the summed angle variance within
      one pulse length; default (beamwidth / 2)^2.
    required: false
    default: null
  confidence_tolerance_pulses:
    type: float
    description: >
      Alternatives within this many pulse lengths of the pick (plus the
      beam-geometry spread, or inside the same loud run) count as the same
      pick when computing confidence and margin.
    required: false
    default: 2.0
  diagnostics_path:
    type: str
    description: >
      Optional zarr path for the full diagnostics (features, scores,
      candidates, lines, confidence and flags). Local runs only.
    notes: >
      Holds the masks, features, score, candidates, raw pick, leading edge,
      backstepped integration line, confidence, margin and flags on the
      cropped grid. The path is written as given.
    required: false
    default: null
implementations:
  - key: default
    callable_path: aa_si_utils.seabed.detect_seafloor_phase
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      seafloor_depth: __return__
