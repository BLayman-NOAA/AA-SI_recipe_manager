op: compute_per_cell_statistics
cache_key: compute_per_cell_statistics  # pinned cache identity - keep stable across op renames
description: >
  Compute per-MVBS-cell statistics (e.g. coefficient of variation) from
  fine-resolution Sv data before masking or MVBS averaging. Results are
  stored as new DataArrays in the returned dataset at MVBS-bin resolution.
  Must be called with the same range_bin, ping_time_bin and range_var values
  used by mask_sparse_bins and compute_mvbs so that bin grids align exactly.
  Pass the returned dataset to add_auxiliary_features via the ds_sv input
  to absorb the statistics into the ML feature matrix.
category: ml_preprocessing
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Fine-resolution Sv Dataset to summarize, normally the noise-removed Sv
      from remove_background_noise. Take it from before mask_sparse_bins:
      the within-cell spread is the signal here, and dropping sparse bins
      first would hide the cells whose variability is most informative.
    expected_variables:
      - Sv
outputs:
  ds_Sv:
    type: Dataset
    description: >
      Input Dataset with per-cell statistic variables appended
      (e.g. cell_cv with dims channel x cell_ping_time x cell_echo_range)
    expected_variables:
      - Sv
params:
  range_bin:
    type: str
    description: "Range bin size. Must match mask_sparse_bins and compute_mvbs (e.g. '2m')"
    required: true
  ping_time_bin:
    type: str
    description: "Ping-time bin size. Must match mask_sparse_bins and compute_mvbs (e.g. '10s')"
    required: true
  statistics:
    type: list
    description: "List of statistics to compute. Supported: ['cv']"
    required: false
    default:
      - cv
  data_var:
    type: str
    description: Name of the Sv variable in the input Dataset
    required: false
    default: "Sv"
  range_var:
    type: str
    description: >
      Meter-valued variable to bin along, which must match the value given to
      mask_sparse_bins and compute_mvbs or the cell statistics describe cells
      offset from the MVBS cells they are joined to. 'echo_range' measures
      from the transducer face, 'depth' from the surface and needs the dataset
      to carry a depth variable. The cell dimension names stay
      cell_ping_time and cell_echo_range either way, since
      add_auxiliary_features selects on them by name.
    required: false
    default: "echo_range"
  range_var_max:
    type: str
    units: m
    description: >
      Deepest value the cells cover, as a unit string (e.g. '1810m'), matching
      the value given to compute_mvbs.

      When unset the extent is read from the data. That forces a compute on a
      lazy dataset, and it lets each dataset choose its own cell grid length,
      which is only safe when this step runs once on one merged dataset. Mapped
      over a survey's per-file Sv it is the bug: each file bins to its own
      extent and the fan-in outer-joins cell_echo_range and NaN-pads the short
      ones, the same trap the survey tier guards against on range_sample.

      Pin it whenever the results will be merged.
    required: false
    default: null
  cells_only:
    type: bool
    description: >
      Return only the statistic arrays instead of a copy of ds_Sv carrying
      them.

      The default keeps the source variables, which is what a single call on a
      merged dataset wants. Set it true whenever this step is checkpointed or
      its results are merged: otherwise the fine-resolution Sv is written a
      second time, and a merge on cell_ping_time drags ping_time and
      range_sample into the join, which across files with differing
      range_sample lengths outer-joins and NaN-pads them. That is the same trap
      the survey tier exists to avoid, reintroduced one dimension over.
    required: false
    default: false
implementations:
  - key: default
    callable_path: aa_si_ml.ml.compute_per_cell_statistics
    default: true
    dependency:
      name: aa-si-ml
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_ML.git
    output_map:
      ds_Sv: __return__
