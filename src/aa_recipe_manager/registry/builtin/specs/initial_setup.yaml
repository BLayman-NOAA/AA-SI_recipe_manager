op: initial_setup
description: >
  Validate the raw file set in the input directory, create calibration output
  directories if they do not exist, and return a list of raw file paths and the
  resolved calibration output directory ready for processing.
category: utility
inputs: {}
outputs:
  raw_file_paths:
    type: list
    description: Ordered list of absolute paths to raw acoustic files
  calibration_output_dir:
    type: path
    description: >
      Resolved full path to the calibration outputs directory. Pass this to
      generate_standardized_cal_mapping as output_base.
params:
  raw_input_folder:
    type: path
    required: true
    constraints:
      # Auto-create if missing: an upstream step (e.g. download_ncei_data)
      # may populate this folder, and at dry-run time it may not yet exist.
      create_if_missing: true
  calibration_outputs:
    type: str
    required: false
    default: "calibration"
    description: >-
      Subdirectory name under the pipeline's user-facing outputs folder where
      calibration artifacts are written. Resolved automatically relative to the
      outputs directory when run via the executor; treated as a CWD-relative path
      when called standalone (e.g. in a notebook). Calibration JSON logs are
      always written to a logs/ subdirectory within this folder.
  raw_file_names:
    type: list
    description: Explicit file name list; empty means include all files in folder
    required: false
    default: []
  clear_previous_json_logs:
    type: bool
    required: false
    default: true
implementations:
  - key: default
    callable_path: aa_si_utils.utils.initial_setup_and_validation
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    param_map:
      calibration_outputs: calibration_outputs_string
    output_map:
      raw_file_paths: "['raw_file_paths']"
      calibration_output_dir: "['calibration_output_dir']"
