op: initial_setup
cache_key: initial_setup  # pinned cache identity - keep stable across op renames
description: >
  Validate the raw file set in the input directory, create calibration output
  directories if they do not exist, and return a list of raw file paths and the
  resolved calibration output directory ready for processing.
category: utility
inputs: {}
outputs:
  raw_file_paths:
    type: list
    description: Ordered list of absolute paths to raw acoustic files
    # Harvested into run provenance as the raw input file list (names + sizes).
    provenance_role: raw_file_list
  calibration_output_dir:
    type: path
    description: >
      Resolved full path to the calibration outputs directory. Pass this to
      generate_standardized_cal_mapping as output_base.
params:
  raw_input_folder:
    type: path
    required: true
    description: >
      Folder containing .raw files. May be a local path or a remote fsspec URL
      (e.g. gs://bucket/survey/raw); remote folders are listed without
      downloading any data, and existence checks are skipped at validation
      time for remote URLs.
    # Fold folder membership into the cache hash so adding/removing a raw file
    # invalidates correctly, without the mtime churn of the old contents mode:
    # "auto" = names+size locally, names+checksum on GCS. The folder path itself
    # is excluded from the hash. Set to "off" to restore path-only keying.
    fingerprint_mode: auto
    constraints:
      # Auto-create if missing: an upstream step (e.g. download_ncei_data)
      # may populate this folder, and at dry-run time it may not yet exist.
      create_if_missing: true
  calibration_outputs:
    type: str
    required: false
    default: "calibration"
    description: >-
      Subdirectory name under the pipeline's user-facing outputs folder where
      calibration artifacts are written. Resolved automatically relative to the
      outputs directory when run via the executor; treated as a CWD-relative path
      when called standalone (e.g. in a notebook). Calibration JSON logs are
      always written to a logs/ subdirectory within this folder.
  raw_file_names:
    type: list
    description: Explicit file name list; empty means include all files in folder
    required: false
    default: []
  clear_previous_json_logs:
    type: bool
    description: >
      Delete the calibration_flags.json left by a previous run before this
      one starts, so the flags reflect this run alone. Set false to let the
      flags accumulate across runs.
    required: false
    default: true
  file_time_start:
    type: str
    required: false
    description: >-
      Optional inclusive ISO datetime (e.g. "2016-07-25T20:58") restricting the
      raw file set to files whose filename-encoded time (D{YYYYMMDD}-T{HHMMSS})
      is at or after this bound. Filenames without a parseable datetime are
      excluded when a bound is set. Applies to local and gs:// folders alike;
      filtering is name-based, so no data is read (or downloaded) to filter.
  file_time_end:
    type: str
    required: false
    description: >-
      Optional inclusive ISO datetime upper bound for filename-encoded file
      times. See file_time_start.
implementations:
  - key: default
    callable_path: aa_si_utils.utils.initial_setup_and_validation
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    param_map:
      calibration_outputs: calibration_outputs_string
    output_map:
      raw_file_paths: "['raw_file_paths']"
      calibration_output_dir: "['calibration_output_dir']"
