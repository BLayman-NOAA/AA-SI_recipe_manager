op: run_hdbscan
cache_key: run_hdbscan  # pinned cache identity - keep stable across op renames
description: >
  Run HDBSCAN unsupervised clustering on normalized feature data. A good sweep
  target for comparing hyperparameters.
notes: >
  Pure compute: it reads the normalized features and returns a clustering
  result without modifying any Dataset.
category: ml_clustering
inputs:
  ds_normalized:
    type: Dataset
    description: >
      Normalized ML Dataset from normalize_ml_data, or the single-cluster
      subset from filter_normalized_by_cluster for a second-pass run. Only
      the feature matrix is read; the Dataset is not modified.
outputs:
  clustering_results:
    type: Dataset
    description: >
      Checkpoint-friendly xarray Dataset containing cluster labels, sample
      indices, and scalar metadata. Saved as Zarr by default.
  clustering_model:
    type: object
    description: >
      The fitted clustering model, used for HDBSCAN hierarchy plots and by
      assign_clusters_to_all_points.
    notes: >
      Kept separate from clustering_results so the label data can checkpoint
      as Zarr while the model falls back to pickle.
    required: false
    default: null
  background_label:
    type: int
    description: >
      Cluster label identified as background. Only populated when
      find_background_cluster is true; null otherwise.
    required: false
    default: null
  cluster_labels:
    type: list
    description: >
      Sorted list of non-noise cluster labels found in this result (all
      labels >= 0).
    notes: >
      Lets map_over: ${this_step.cluster_labels} fan
      filter_normalized_by_cluster across every discovered cluster without
      changes to that op or its spec.
    required: false
    default: null
params:
  dataset_name:
    type: str
    description: >
      ML dataset to cluster. Must match the dataset_name used by
      reshape_for_ml.
    required: true
  normalization_name:
    type: str
    description: >
      Normalized feature set to cluster. Must match the normalization_name
      used by normalize_ml_data.
    required: true
  ml_result_name:
    type: str
    description: >
      Name this clustering result is stored under. embed_clustering_results
      and plot_clustering_report take the same name to find it, so a recipe
      can keep several clusterings of one dataset side by side.
    required: true
  min_cluster_size:
    type: int
    description: Absolute minimum cluster size. Mutually exclusive with min_cluster_size_fraction.
    required: false
    constraints:
      exclusive_with: [min_cluster_size_fraction]
  min_cluster_size_fraction:
    type: float
    description: >
      Minimum cluster size as a fraction of the points fitted, used when
      min_cluster_size is omitted. Mutually exclusive with min_cluster_size.
      Unset uses 0.03.
    notes: >
      Taken of the subsample when sample_size binds, so the number means the
      same thing at any scale: a cluster must hold this share of what the
      model saw. Raising sample_size therefore raises the absolute floor
      proportionally, and lowering it lowers it.
    required: false
    default: null
    constraints:
      exclusive_with: [min_cluster_size]
  min_samples:
    type: int
    description: >
      Neighbourhood size HDBSCAN uses to judge how dense a point is. Higher
      values make the run more conservative, pushing sparse points into noise
      instead of into a cluster.
    required: false
    default: 2
  sample_size:
    type: int
    description: >
      Cap on how many samples are clustered. A larger dataset is clustered on
      a random subset of this size and the rest get no label (see
      assign_clusters_to_all_points). Set it above the sample count to cluster
      everything.
    notes: >
      A survey flattens to more points than HDBSCAN can handle in memory,
      which is why the cap exists.
    required: false
    default: 100000
  cluster_selection_method:
    type: str
    description: "HDBSCAN cluster selection method ('eom' or 'leaf')"
    required: false
    default: "leaf"
  use_hdbscan:
    type: bool
    description: Use HDBSCAN; set false to fall back to a simpler clustering method
    required: false
    default: true
  epsilon:
    type: float
    description: DBSCAN epsilon distance parameter
    required: false
    default: 0.004
  find_background_cluster:
    type: bool
    description: >
      Run background-cluster detection path instead of standard HDBSCAN.
      When true, background_label output is populated.
    required: false
    default: false
  soft_membership_threshold:
    type: float
    description: >
      Reassign noise points via soft-membership probabilities when set.
      null disables soft-membership reassignment.
    required: false
    default: null
implementations:
  - key: default
    callable_path: aa_si_ml.ml.run_hdbscan
    default: true
    dependency:
      name: aa-si-ml
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_ML.git
    output_map:
      clustering_results: "['clustering_results']"
      clustering_model: "['clustering_model']"
      background_label: "['background_label']"
      cluster_labels: "['cluster_labels']"
