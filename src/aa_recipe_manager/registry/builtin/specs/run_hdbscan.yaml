op: run_hdbscan
cache_key: run_hdbscan  # pinned cache identity - keep stable across op renames
description: >
  Run HDBSCAN unsupervised clustering on normalized feature data.
  Pure-compute step: accepts normalized features and returns a clustering
  result dict without modifying any Dataset. Designed to be a sweep target
  for hyperparameter comparison.
category: ml_clustering
inputs:
  ds_normalized:
    type: Dataset
outputs:
  clustering_results:
    type: Dataset
    description: >
      Checkpoint-friendly xarray Dataset containing cluster labels, sample
      indices, and scalar metadata. Saved as Zarr by default.
  clustering_model:
    type: object
    description: >
      Optional fitted clustering model used for HDBSCAN hierarchy plots.
      This output is intentionally separate from clustering_results so the
      label data can checkpoint as Zarr while the model falls back to pickle.
    required: false
    default: null
  background_label:
    type: int
    description: >
      Cluster label identified as background. Only populated when
      find_background_cluster is true; null otherwise.
    required: false
    default: null
  cluster_labels:
    type: list
    description: >
      Sorted list of non-noise cluster labels found in this result (all
      labels >= 0). Provided as scaffolding for a future map_over fan-out:
      map_over: ${this_step.cluster_labels} will fan
      filter_normalized_by_cluster across every discovered cluster without
      any changes to the op or its spec.
    required: false
    default: null
params:
  dataset_name:
    type: str
    required: true
  normalization_name:
    type: str
    required: true
  ml_result_name:
    type: str
    description: Label assigned to this clustering result for downstream tracking
    required: true
  min_cluster_size:
    type: int
    description: Absolute minimum cluster size. Mutually exclusive with min_cluster_size_fraction.
    required: false
  min_cluster_size_fraction:
    type: float
    description: >
      Fraction of extracted data points used to derive min_cluster_size when
      min_cluster_size is omitted. Mutually exclusive with min_cluster_size.
      When omitted, the ML function defaults to 0.03.
    required: false
    default: null
  min_samples:
    type: int
    required: false
    default: 2
  sample_size:
    type: int
    description: Maximum number of samples drawn for clustering; 
    required: false
    default: 100000
  cluster_selection_method:
    type: str
    description: "HDBSCAN cluster selection method ('eom' or 'leaf')"
    required: false
    default: "leaf"
  use_hdbscan:
    type: bool
    description: Use HDBSCAN; set false to fall back to a simpler clustering method
    required: false
    default: true
  epsilon:
    type: float
    description: DBSCAN epsilon distance parameter
    required: false
    default: 0.004
  find_background_cluster:
    type: bool
    description: >
      Run background-cluster detection path instead of standard HDBSCAN.
      When true, background_label output is populated.
    required: false
    default: false
  soft_membership_threshold:
    type: float
    description: >
      Reassign noise points via soft-membership probabilities when set.
      null disables soft-membership reassignment.
    required: false
    default: null
implementations:
  - key: default
    callable_path: aa_si_ml.ml.run_hdbscan
    default: true
    dependency:
      name: aa-si-ml
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_ML.git
    output_map:
      clustering_results: "['clustering_results']"
      clustering_model: "['clustering_model']"
      background_label: "['background_label']"
      cluster_labels: "['cluster_labels']"
