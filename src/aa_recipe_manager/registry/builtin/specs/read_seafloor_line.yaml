op: read_seafloor_line
cache_key: read_seafloor_line  # pinned cache identity - keep stable across op renames
description: >
  Read a seafloor line from Echoview ``.evl`` files and align it to the Sv
  pings, in metres. Swaps in for the seafloor detection ops. Pings the line
  does not cover are NaN and get masked entirely downstream.
notes: >
  Use it when a hand-verified Echoview bottom line is more trustworthy than
  running detection over the Sv data.

  Echoview exports a survey as a series of part-day line files, so
  ``evl_path`` may be a folder: the files whose names span
  ``file_time_start`` to ``file_time_end`` are selected and concatenated into
  one line before interpolation. Give it the same window that selected the
  raw files.

  The output port name (``seafloor_depth``) and shape (1-D, ping_time) match
  ``detect_seafloor`` and ``ep_detect_seafloor``, so downstream steps such as
  ``create_seafloor_mask`` work unchanged. The recipe step's ``inputs`` drop
  the ``echodata`` line (no detection is run) and the ``params`` block takes
  ``evl_path`` plus the alignment settings instead of ``channel`` and
  ``min_valid_depth_m`` or ``method`` and ``method_params``.

  ``create_seafloor_mask`` rejects every sample of a ping whose seafloor is
  NaN, because the comparison is False against NaN. The step therefore prints
  its ping coverage on every run; set ``min_coverage`` to turn a shortfall
  into a hard error, or widen ``edge_extend_s`` or ``max_gap_s`` if the gaps
  are benign.
category: detection
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Calibrated Sv dataset supplying the target pings. Pass one that has been
      through ``ep_add_depth`` so the line matches ``depth``, metres below the
      surface.
    notes: >
      ds_Sv also supplies the vertical reference. Metres below the surface is
      what an Echoview seabed line normally records.
outputs:
  seafloor_depth:
    type: DataArray
    description: >
      Seafloor depth in metres on ds_Sv's ping_time, with no channel
      dimension. NaN wherever the line does not cover a ping.
params:
  evl_path:
    type: path
    description: >
      An Echoview ``.evl`` line file, or a folder of them selected with
      file_time_start and file_time_end. Local or remote (e.g. gs://...). Give
      exactly one of this and ``window``.
    notes: >
      Remote files are read in place (no download) since line files are small.
      The must_exist check is skipped at validation time for remote URLs and
      enforced by the step at run time instead.
    required: false
    constraints:
      must_exist: true
      exclusive_with: [window]
    # Content-addressed so re-exporting or hand-editing a line invalidates the
    # cached step, while merely moving the file does not. For a folder the hash
    # covers every .evl in it, not just the ones the window selects, so adding an
    # unrelated line file also invalidates the step (same as raw_input_folder).
    fingerprint_mode: checksum
  window:
    type: dict
    description: >
      Mapping with the line path under ``window_key``, used instead of
      ``evl_path`` in a mapped step (``window: ${_item}``). It can also supply
      file_time_start and file_time_end.
    notes: >
      This is the form a mapped fan-out needs. ${_item} is an all-or-nothing
      token with no attribute access (there is no ${_item.seabed_evl}), so a
      step mapped over a list of window dicts cannot pull the path out of the
      item as its own param and has to take the dict.

      A window supplies file_time_start and file_time_end when those are not
      given directly, so a folder of part-day seabed exports narrows to the
      window without repeating its bounds. Extra keys are ignored, and an
      optional ``label`` names the instance in errors.

      A window's path is not content-fingerprinted the way evl_path is: it
      arrives as a runtime value rather than a declared param, so re-exporting
      that line does not by itself invalidate the step. The upstream step that
      produced the window is what carries its identity.
    required: false
    default: null
    constraints:
      exclusive_with: [evl_path]
  window_key:
    type: str
    description: >
      Key the line path is read from when ``window`` is given. Defaults to
      "seabed_evl", which is what plan_dive_datasets emits.
    required: false
    default: "seabed_evl"
  vertical_reference:
    type: str
    description: >
      What the EVL depths are measured from: "surface" (default, Echoview's
      usual) or "transducer" (range along the beam). The line is converted to
      ds_Sv's own reference.
    notes: >
      ds_Sv's reference is depth when ep_add_depth ran upstream, otherwise
      echo_range.
    required: false
    default: "surface"
  min_status:
    type: int
    description: >
      Drop line points whose Echoview status is below this value (0 = none,
      1 = unverified, 2 = bad, 3 = good). Null (default) keeps every point.
      Dropped points leave a gap, subject to max_gap_s.
    required: false
    default: null
  max_gap_s:
    type: float
    units: s
    description: >
      Widest hole in the line to interpolate across; pings in a wider hole are
      NaN. Null (default) interpolates across holes of any width.
    notes: >
      A ping landing exactly on a line point always keeps that point's depth.
    required: false
    default: null
  edge_extend_s:
    type: float
    units: s
    description: >
      Seconds past the line's first and last point to hold its end depths.
      0.0 (default) leaves pings outside the line NaN; null holds the end
      depths indefinitely.
    notes: >
      The 0.0 default keeps a line covering only part of a survey from
      silently asserting a constant seafloor over the rest.
    required: false
    default: 0.0
  depth_offset_m:
    type: float
    units: m
    description: >
      Constant metres added to the line, for when the transducer draft
      configured in Echoview differs from the one baked into ds_Sv['depth'].
      Positive pushes the seafloor deeper.
    required: false
    default: 0.0
  min_coverage:
    type: float
    description: >
      Fraction of pings (0-1) that must end up with a finite seafloor depth;
      below it the step fails instead of silently masking the uncovered pings
      away. Default 0.0 never fails.
    required: false
    default: 0.0
  file_time_start:
    type: str
    description: >
      Optional inclusive ISO datetime (e.g. "2024-10-12T00:15") selecting line
      files in an evl_path folder by the times in their names. Use the window
      that selected the raw files. Ignored for a single file.
    notes: >
      Names carry a d{YYYYMMDD}_t{HHMMSS}-t{HHMMSS} span. A file's span runs
      from its own name stamp to the next file's, not to the end stamp in its
      own name: Echoview's end stamp under-reports the line's real last point
      by about one raw file's duration, so trusting it would drop the export
      straddling the window start and leave the leading pings with no
      seafloor. Selection is name-based, so no line data is read (or
      downloaded) to filter.
    required: false
  file_time_end:
    type: str
    description: >
      Optional inclusive ISO datetime upper bound for line file selection.
      See file_time_start.
    required: false
implementations:
  - key: default
    callable_path: aa_si_utils.utils.read_seafloor_line_evl
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      seafloor_depth: __return__
