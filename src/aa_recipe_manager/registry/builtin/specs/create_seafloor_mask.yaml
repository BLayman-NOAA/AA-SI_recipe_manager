op: create_seafloor_mask
cache_key: create_seafloor_mask  # pinned cache identity - keep stable across op renames
description: >
  Build a seafloor mask from baseline Sv and detected seafloor depth.
  The seafloor depth is passed as an explicit input, enabling swappable
  detection methods without modifying masking logic.
category: masking
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Sv Dataset the mask is shaped to. Supplies the meter-valued range
      variable that each sample's depth is compared against.
  seafloor_depth:
    type: DataArray
    description: >
      Seafloor depth per ping from any seafloor detection op. Pings where it
      is NaN are masked entirely rather than guessed at.
outputs:
  mask:
    type: DataArray
    description: Boolean DataArray shaped like ds_Sv['Sv']; True means valid data (above seafloor)
params:
  seafloor_buffer_m:
    type: float
    units: m
    description: >
      Height above the seafloor line to also mask, covering detection error
      and the near-bottom dead zone at the cost of some real backscatter.
    required: false
    default: 0.0
  range_var:
    type: str
    description: >
      Meter-valued variable on ds_Sv compared against the seafloor line, on
      the same vertical reference. Null (default) uses "depth" if present,
      otherwise "echo_range".
    required: false
    default: null
implementations:
  - key: default
    callable_path: aa_si_utils.utils.create_seafloor_mask
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      mask: __return__
