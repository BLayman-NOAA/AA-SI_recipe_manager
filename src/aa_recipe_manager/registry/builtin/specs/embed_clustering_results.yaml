op: embed_clustering_results
cache_key: embed_clustering_results  # pinned cache identity - keep stable across op renames
description: >
  Embed clustering results into the normalized ML Dataset as cluster-label
  variables. A collected list of results embeds one variable per result,
  named from ml_result_name.
category: ml_clustering
inputs:
  ds_normalized:
    type: Dataset
    description: Normalized ML Dataset to enrich with cluster-label variables
  clustering_results:
    type: Dataset
    many: true
    description: >
      Clustering result dataset from run_hdbscan. When collect is used for
      ensemble runs, a list of result datasets is accepted (many: true).
outputs:
  ds_normalized:
    type: Dataset
    description: Normalized ML Dataset enriched with cluster-label variables
  gridded_results:
    type: DataArray
    many: true
    description: >
      Gridded cluster labels as a DataArray for a single result, or a dict
      keyed by embedded result name for multi-result fan-in (many: true).
params:
  dataset_name:
    type: str
    description: >
      ML dataset the labels are embedded into. Must match the dataset_name
      used by reshape_for_ml.
    required: true
  ml_result_name:
    type: str
    description: >
      Name the embedded cluster labels are stored under, normally the
      ml_result_name from run_hdbscan so plot_clustering_report finds it. For
      a collected list, the stem of the per-result variable names.
    required: true
implementations:
  - key: default
    callable_path: aa_si_ml.ml.embed_clustering_results
    default: true
    dependency:
      name: aa-si-ml
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_ML.git
    output_map:
      ds_normalized: "['ds_normalized']"
      gridded_results: "['gridded_results']"
