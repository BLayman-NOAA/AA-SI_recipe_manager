op: select_ping_time_range
cache_key: select_ping_time_range  # pinned cache identity - keep stable across op renames
description: >
  Narrow a Dataset to a ping_time window. The user-facing entry point into a
  survey-wide Sv store: a survey-level recipe computes and checkpoints Sv once
  for the whole cruise, and a user recipe reuses that checkpoint and calls this
  to work on its own segment.

  Cheap on a zarr-backed Dataset. ``sel`` narrows the dask graph to the chunks
  the window touches, so only those are read - measured on a 39570-ping store
  with 3305-ping chunks, a 4001-ping window read 4 of 24 partitions in 1.5 s
  and 1.4 GB against 16.5 s and 8.9 GB for the whole array. Chunk the survey
  store along ping_time (see ``rechunk_dataset``) at roughly the window size
  users ask for.

  PLACEMENT MATTERS. Step hashes are a Merkle chain: each step folds in its
  parents' hashes. Wiring a user's window into an upstream step's params - for
  example ``initial_setup``'s file_time_start - changes that step's hash and
  every hash below it, so no two windows ever share a cached Sv. Keep the
  window on this step, downstream of everything whose checkpoint you want
  shared, and give the survey-level steps a fixed survey-wide window instead.
category: preprocessing
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Dataset carrying a ping_time coordinate, normally the merged survey Sv
      loaded from a shared checkpoint.
    expected_coords:
      - ping_time
outputs:
  ds_Sv:
    type: Dataset
    description: >
      The ping_time slice of the input, lazy when the input is lazy. ``None``
      when the window selects no pings and ``allow_empty`` is set.
    expected_coords:
      - ping_time
params:
  start:
    type: str
    description: >
      Inclusive ISO datetime lower bound (e.g. "2024-10-15T13:38:52"). Leave
      unset to leave the start open.
    required: false
    default: null
  end:
    type: str
    description: >
      Inclusive ISO datetime upper bound. Leave unset to leave the end open.
      The step fails rather than returning an empty Dataset when the window
      selects no pings.
    required: false
    default: null
  window:
    type: dict
    description: >
      Mapping supplying start and end instead of passing them directly.
      Mutually exclusive with them: giving both is an error rather than a
      silent precedence rule.

      This is the form a mapped fan-out needs. ${_item} is an all-or-nothing
      token with no attribute access - there is no ${_item.start} - so a step
      mapped over a list of window dicts cannot pull the two bounds out of the
      item as separate params and has to take the dict itself. Wire it as
      ``window: ${_item}``.

      Extra keys are ignored, so one dict can carry everything an instance
      needs (a label, its line files, its raw file list) while this step reads
      only the bounds. An optional ``label`` key is printed to identify the
      instance in the run log.
    required: false
    default: null
  dim:
    type: str
    description: >
      Time coordinate to slice. Binned products carry the bin's left edge under
      a different name, so a compute_per_cell_statistics dataset is windowed
      with "cell_ping_time" while raw Sv uses the default. The coordinate has to
      be datetime-valued either way, which the cell grid's left edges are.
    required: false
    default: "ping_time"
  windows:
    type: list
    description: >
      Several window dicts at once, each with ``start`` and ``end`` as the
      single ``window`` form takes. Keeps every ping inside at least one of
      them, in time order, each ping once even where windows overlap.

      This is how a step mapped over the survey's per-file Sv pulls a whole
      set of dive windows out of each file in one pass: the instance sees one
      file and cannot loop over the list itself. Wire it straight from the
      planner, ``windows: ${plan_dives.windows}``, and pair it with
      ``allow_empty: true`` so the files no window touches drop out at the
      fan-in. Mutually exclusive with ``window`` and ``start``/``end``.
    required: false
    default: []
  allow_empty:
    type: bool
    description: >
      Return nothing instead of failing when the window selects no pings.

      This is what lets the step be mapped over a whole survey's per-file Sv
      rather than applied to one merged store. Most files lie outside any one
      window, and ``merge_datasets`` drops the empty instances when it collects,
      so the fan-in keeps exactly the files the window touches. That is the
      route to a windowed analysis that reuses the per-file checkpoints without
      a survey-wide merge ever being built.

      Left false by default: against a single merged store, a window that
      selects nothing is a mistake and should fail loudly.
    required: false
    default: false
implementations:
  - key: default
    callable_path: aa_si_utils.utils.select_ping_time_range
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    param_map:
      start: start
      end: end
      window: window
      windows: windows
      allow_empty: allow_empty
      dim: dim
    output_map:
      ds_Sv: __return__
