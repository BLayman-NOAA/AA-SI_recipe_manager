op: add_line_overlay
cache_key: add_line_overlay  # pinned cache identity - keep stable across op renames
description: >
  Join a depth line from an Echoview .evl or a click .csv onto a Dataset's
  ping_time, after any gridding. An EVL adds one variable named line_name; a
  CSV adds four prefixed by it.
notes: >
  The enriched Dataset is passed downstream for plotting, for the ML reshape,
  or for a step that selects cells between two lines. The format is worked
  out from the extension, so a recipe names the file rather than the reader.

  An .evl is an Echoview export with one line per file. Seabed exports and
  individual dive lines arrive this way, so a dive profile with its two
  confidence bounds is three files and three steps.

  A .csv is the R-written click file, which carries a whole dive profile at
  once. It adds <line_name>_depth (the raw click depths), <line_name>_fit (the
  LOESS smoothed curve), <line_name>_lower_ci and <line_name>_upper_ci. So
  line_name is an exact name for an EVL and a prefix for a CSV; the asymmetry
  is in the data, not in the op.

  Apply it after the grid you intend to plot or analyse on, since the line is
  interpolated onto whatever ping_time the input carries. Attaching a line to
  Sv and then computing MVBS would average the line along with the data.
category: annotation
inputs:
  ds:
    type: Dataset
    description: >
      Dataset the line is joined onto, normally gridded MVBS. For a dive
      profile or seabed line, pass one that carries depth.
    notes: >
      The line is aligned to this Dataset's ping_time, so join it after the
      grid the plot or the ML reshape will actually use. For an EVL it also
      supplies the vertical reference the line is converted to: depth when
      ep_add_depth ran upstream, otherwise echo_range. Dive profiles and seabed
      lines are recorded in metres below the surface.
    expected_coords:
      - ping_time
outputs:
  ds:
    type: Dataset
    description: >
      Input Dataset with the line variable (EVL) or variables (CSV) added. NaN
      wherever the line does not cover a ping.
    expected_coords:
      - ping_time
params:
  line_file_path:
    type: path
    description: >
      The line file; for .evl also a folder or list of them, selected with
      file_time_start and file_time_end. Local or remote (e.g. gs://...). Give
      exactly one of this and ``window``.
    notes: >
      Remote files are read in place with no download, since line files are
      small. The must_exist check is skipped at validation time for remote
      URLs and enforced by the step at run time instead.
    required: false
    constraints:
      must_exist: true
      exclusive_with: [window]
    # Content-addressed so re-exporting or hand-editing a line invalidates the
    # cached step, while merely moving the file does not. For a folder the hash
    # covers every .evl in it, not just the ones the window selects.
    fingerprint_mode: checksum
  line_name:
    type: str
    description: >
      Variable name for an EVL, variable prefix for a CSV. Downstream steps
      refer to the line by this name, so keep it stable across a recipe.
    required: true
  window:
    type: dict
    description: >
      Mapping with the line path under ``window_key``, used instead of
      ``line_file_path`` in a mapped step (``window: ${_item}``). It can also
      supply file_time_start and file_time_end.
    notes: >
      This is the form a mapped fan-out needs. ${_item} is an all-or-nothing
      token with no attribute access, so a step mapped over a list of window
      dicts cannot pull the path out of the item as its own param and has to
      take the dict.

      A window supplies file_time_start and file_time_end when those are not
      given directly. Extra keys are ignored, and an optional ``label`` names
      the instance in errors.

      A dive profile is three separate .evl exports, so attaching a whole one
      from a window is three steps differing only in window_key and line_name.
      The click .csv form carries the whole profile in one file and needs only
      one step.

      A window's path is not content-fingerprinted the way line_file_path is:
      it arrives as a runtime value rather than a declared param, so
      re-exporting that line does not by itself invalidate the step. The
      upstream step that produced the window carries its identity instead.
    required: false
    default: null
    constraints:
      exclusive_with: [line_file_path]
  window_key:
    type: str
    description: >
      Key the line path is read from when ``window`` is given, e.g.
      "dive_fit_evl", "dive_u99_evl" or "dive_l99_evl". Required with window.
    notes: >
      The example keys are the ones plan_dive_datasets emits. There is no
      default because a window normally carries several lines and none is a
      sensible choice among them.
    required: false
    default: null
  file_format:
    type: str
    description: >
      "auto" (default) reads a .csv as CSV and anything else, including a
      folder or list, as EVL. Set "evl" or "csv" to say so outright.
    required: false
    default: "auto"
  vertical_reference:
    type: str
    description: >
      EVL only. What the line's depths are measured from: "surface" (default,
      usual for dive profiles and seabed lines) or "transducer" (range along
      the beam).
    required: false
    default: "surface"
  min_status:
    type: int
    description: >
      EVL only. Drop line points whose Echoview status is below this value
      (0 = none, 1 = unverified, 2 = bad, 3 = good). Null (default) keeps every
      point. Dropped points leave a gap, subject to max_gap_s.
    required: false
    default: null
  max_gap_s:
    type: float
    units: s
    description: >
      EVL only. Widest hole in the line to interpolate across; pings in a
      wider hole are NaN. Null (default) interpolates across holes of any
      width.
    notes: >
      A ping landing exactly on a line point always keeps that point's depth.
    required: false
    default: null
  edge_extend_s:
    type: float
    units: s
    description: >
      EVL only. Seconds past the line's first and last point to hold its end
      depths. 0.0 (default) leaves pings outside the line NaN, right for a
      dive profile; null holds the end depths indefinitely, for sparse seabed
      exports.
    notes: >
      A dive profile covers the localized dive and nothing either side of it,
      so holding its end depth outward would invent whale positions.
    required: false
    default: 0.0
  depth_offset_m:
    type: float
    units: m
    description: >
      EVL only. Constant metres added to the line, for when the draft
      configured in Echoview differs from the one baked into ds['depth'].
    required: false
    default: 0.0
  min_coverage:
    type: float
    description: >
      EVL only. Fraction of pings (0-1) that must get a finite depth, or the
      step fails. Default 0.0 never fails; keep it for a dive profile on a
      dataset longer than the dive.
    required: false
    default: 0.0
  file_time_start:
    type: str
    description: >
      EVL only. Optional inclusive ISO datetime selecting line files in an evl
      folder by the times in their names. Ignored for a single file.
    notes: >
      Names carry a d{YYYYMMDD}_t{HHMMSS}-t{HHMMSS} span. A file's span runs
      from its own name stamp to the next file's, not to the end stamp in its
      own name. Selection is name-based, so no line data is read to filter.
    required: false
  file_time_end:
    type: str
    description: >
      EVL only. Optional inclusive ISO datetime upper bound for line file
      selection. See file_time_start.
    required: false
  long_name:
    type: str
    description: >
      EVL only. Optional long_name attribute for the added variable. Defaults
      to "<line_name> from Echoview line file".
    required: false
    default: null
implementations:
  - key: default
    callable_path: aa_si_utils.utils.add_line_overlay
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      ds: __return__
