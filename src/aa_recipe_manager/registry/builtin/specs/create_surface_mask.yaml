op: create_surface_mask
cache_key: create_surface_mask  # pinned cache identity - keep stable across op renames
description: >
  Build a surface-interference mask from baseline Sv using a selectable method.
category: masking
inputs:
  ds_Sv:
    type: Dataset
    description: >
      Sv Dataset the mask is shaped to. Supplies the range variable each
      sample's depth is read from.
outputs:
  mask:
    type: DataArray
    description: Boolean mask DataArray; True means valid data
params:
  surface_depth_m:
    type: float
    units: m
    description: >
      Depth above which samples are masked out, removing the transmit pulse
      ringdown and near-surface bubble layer. The default of 0.0 masks
      nothing.
    required: false
    default: 0.0
implementations:
  - key: default
    callable_path: aa_si_utils.utils.create_surface_mask
    default: true
    dependency:
      name: aa-si-utils
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
    output_map:
      mask: __return__
