op: read_raw_file_config
cache_key: read_raw_file_config  # pinned cache identity - keep stable across op renames
description: >
  Read one raw file's channel configuration from its datagram headers. Map it
  over the raw file paths and collect the results with record_raw_file_configs.
notes: >
  The fan-out unit of the calibration raw scan. Mapped with checkpoint: always,
  each file becomes its own cache entry, so a run interrupted at file 400 of
  500 keeps the 399 already scanned. record_raw_file_configs collects the
  results into the survey's raw_file_configs.yaml.
category: calibration
inputs: {}
outputs:
  file_config:
    type: dict
    required: false
    description: >
      This file's channel configuration: filename, metadata_start_time, and
      one entry per channel. Null when the instrument type cannot be detected,
      and record_raw_file_configs drops those entries.
params:
  raw_file_path:
    type: path
    required: true
    description: >
      One .raw file, as a local path or a remote URL. Normally wired to
      ${_item}.
    notes: >
      A remote file is downloaded to local scratch, read, and deleted before
      the step returns. Not fingerprinted, because the mapped item already
      content-addresses the instance.
  verify_start_time:
    type: bool
    required: false
    default: false
    description: >
      If true, also read EK80 files in full to verify metadata_start_time,
      which is slower. The default single pass scan is enough for channel
      configuration.
    notes: >
      The full read uses SimradFileReader.
  verbose:
    type: bool
    required: false
    default: true
    description: >
      Print per-file progress. Set false on a long fan-out to keep the log
      readable.
  max_scan_bytes:
    type: int
    required: false
    description: >
      Most leading bytes of a remote EK60 or EK80 file to read instead of the
      whole file, in bytes. Unset reads whole files. Around 1 MiB suits EK60;
      FM EK80 needs tens of MiB. Too low only costs a whole-file read.
    notes: >
      The scan starts at min(8 MiB, this) and doubles up to this cap, stopping
      as soon as the configuration settles every channel, so a file that
      settles early pays only the small read and the local prefix grows in
      place rather than being re-read from zero. Size it for the deepest
      configuration in the survey. Local files and verify_start_time always get
      the whole-file read.

      EK80 CW files settle within a fraction of a MiB; FM files sit behind much
      larger RAW3 payloads and scale with file size, so a survey of about
      1 GiB FM files needs a cap in the tens of MiB.

      EK60 settles far earlier, and the cap doubles as the starting read, so
      1 MiB turns a cruise-wide scan into one small read per file. Measured on
      HB1603 (52 MB files, five channels), the configuration settles at
      256 KiB. Do not go lower on the strength of the channel list alone: at
      64 KiB every channel is already listed and looks complete, but three of
      the five carry CON0's configured 2000 W rather than the 500, 300 and
      750 W actually transmitted. The step guards against that by requiring
      one RAW0 datagram per channel before it trusts a prefix, so a too-small
      cap costs a whole-file read rather than wrong calibration.

      Because a prefix cannot measure them, the per-file datagram counts and
      gps_data come back null; last_ping_time is recovered from the file's
      tail.
implementations:
  - key: default
    callable_path: aa_si_calibration.calibration.read_raw_file_config
    default: true
    dependency:
      name: aa-si-calibration
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_calibration.git
    output_map:
      file_config: "__return__"
