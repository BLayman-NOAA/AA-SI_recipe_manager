op: read_raw_file_config
cache_key: read_raw_file_config  # pinned cache identity - keep stable across op renames
description: >
  Read ONE raw file's channel configuration from its datagram headers.

  The fan-out unit of the calibration raw scan. Map it over
  initial_setup.raw_file_paths with checkpoint: always and each file becomes
  its own cache entry, so a run interrupted at file 400 of 500 keeps the 399
  already scanned. Pair it with record_raw_file_configs, which collects the
  results into the survey's raw_file_configs.yaml.
category: calibration
inputs: {}
outputs:
  file_config:
    type: dict
    required: false
    description: >
      This file's channel configuration: filename, metadata_start_time, and
      one entry per channel. Null when the instrument type cannot be detected,
      and record_raw_file_configs drops those entries.
params:
  raw_file_path:
    type: path
    required: true
    description: >
      One .raw file. May be a local path or a remote fsspec URL, which is
      downloaded to local scratch, read, and deleted before this step returns.
      Normally wired to ${_item}. Not fingerprinted, because the mapped item
      already content-addresses the instance.
  verify_start_time:
    type: bool
    required: false
    default: false
    description: >
      If true, EK80 files are additionally read with the full SimradFileReader
      to verify metadata_start_time, which is slower. The default single pass
      scan is enough for channel configuration.
  verbose:
    type: bool
    required: false
    default: true
    description: >
      Print per-file progress. Worth setting false on a long fan-out, where
      one banner per file buries the rest of the log.
  max_scan_bytes:
    type: int
    required: false
    description: >
      Ceiling on how many leading bytes of a remote EK80 file may be read in
      place of transferring it whole. The scan starts at 8 MiB and doubles up
      to this cap, stopping as soon as the Configuration and Parameter
      datagrams settle every channel, so a file that settles early pays only
      the small read and the local prefix grows in place rather than being
      re-read from zero.

      Size it for the deepest configuration in the survey. CW files settle
      within a fraction of a MiB; FM files sit behind much larger RAW3
      payloads and scale with file size, so a survey of ~1 GiB FM files needs
      a cap in the tens of MiB. Too low is expensive, not wrong: files that
      never settle are read whole.

      Because a prefix cannot measure them, raw3_count and gps_data come back
      null; last_ping_time is recovered from the file's tail. Leave unset for
      the whole-file read, which is also what local files and
      verify_start_time always get.
implementations:
  - key: default
    callable_path: aa_si_calibration.calibration.read_raw_file_config
    default: true
    dependency:
      name: aa-si-calibration
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_calibration.git
    output_map:
      file_config: "__return__"
