op: read_raw_file_config
cache_key: read_raw_file_config  # pinned cache identity - keep stable across op renames
description: >
  Read ONE raw file's channel configuration from its datagram headers.

  The fan-out unit of the calibration raw scan. Map it over
  initial_setup.raw_file_paths with checkpoint: always and each file becomes
  its own cache entry, so a run interrupted at file 400 of 500 keeps the 399
  already scanned. Pair it with record_raw_file_configs, which collects the
  results into the survey's raw_file_configs.yaml.
category: calibration
inputs: {}
outputs:
  file_config:
    type: dict
    required: false
    description: >
      This file's channel configuration: filename, metadata_start_time, and
      one entry per channel. Null when the instrument type cannot be detected,
      and record_raw_file_configs drops those entries.
params:
  raw_file_path:
    type: path
    required: true
    description: >
      One .raw file. May be a local path or a remote fsspec URL, which is
      downloaded to local scratch, read, and deleted before this step returns.
      Normally wired to ${_item}. Not fingerprinted, because the mapped item
      already content-addresses the instance.
  verify_start_time:
    type: bool
    required: false
    default: false
    description: >
      If true, EK80 files are additionally read with the full SimradFileReader
      to verify metadata_start_time, which is slower. The default single pass
      scan is enough for channel configuration.
  verbose:
    type: bool
    required: false
    default: true
    description: >
      Print per-file progress. Worth setting false on a long fan-out, where
      one banner per file buries the rest of the log.
  max_scan_bytes:
    type: int
    required: false
    description: >
      Ceiling on how many leading bytes of a remote EK60 or EK80 file may be
      read in place of transferring it whole. The scan starts at
      min(8 MiB, this) and doubles up to this cap, stopping as soon as the
      configuration settles every channel, so a file that settles early pays
      only the small read and the local prefix grows in place rather than
      being re-read from zero.

      Size it for the deepest configuration in the survey. Too low is
      expensive, not wrong: a file that never settles is read whole.

      EK80: CW files settle within a fraction of a MiB; FM files sit behind
      much larger RAW3 payloads and scale with file size, so a survey of
      ~1 GiB FM files needs a cap in the tens of MiB.

      EK60 settles far earlier, and the cap doubles as the starting read, so
      setting it to 1 MiB turns a cruise-wide scan into one small read per
      file. Measured on HB1603 (52 MB files, five channels), the configuration
      settles at 256 KiB. Do not be tempted lower on the strength of the
      channel list alone: at 64 KiB every channel is already listed and looks
      complete, but three of the five carry CON0's configured 2000 W rather
      than the 500, 300 and 750 W actually transmitted. The step guards
      against that by requiring one RAW0 datagram per channel before it trusts
      a prefix, so a too-small cap costs a whole-file read rather than wrong
      calibration.

      Because a prefix cannot measure them, the per-file datagram counts and
      gps_data come back null; last_ping_time is recovered from the file's
      tail. Leave unset for the whole-file read, which is also what local
      files and verify_start_time always get.
implementations:
  - key: default
    callable_path: aa_si_calibration.calibration.read_raw_file_config
    default: true
    dependency:
      name: aa-si-calibration
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_calibration.git
    output_map:
      file_config: "__return__"
