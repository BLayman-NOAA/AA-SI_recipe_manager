op: plot_sv_echogram
cache_key: plot_sv_echogram  # pinned cache identity - keep stable across op renames
description: >
  Render an Sv echogram. Supports two call patterns: (1) single dataset,
  plots ds_Sv directly; (2) dual dataset, plots ds_Sv using coordinate axes
  from ds_Sv_source (useful for MVBS overlaid on the original Sv grid).
  This is a sink step: it produces a side-effect (figure) with no data output.
category: visualization
sink: true
inputs:
  ds_Sv:
    type: Dataset
    description: Primary Sv dataset to plot
  ds_Sv_source:
    type: Dataset
    description: Reference Sv dataset whose coordinates set the axes
    required: false
    default: null
outputs: {}
params:
  min_depth:
    type: float
    description: Minimum depth (y-axis) in meters
    required: false
    default: 0
  max_depth:
    type: float
    description: >
      Maximum depth (y-axis) in meters. Omit to use the deepest depth present
      in the data.
    required: false
  ping_min:
    type: int
    description: First ping index to display
    required: false
    default: 0
  ping_max:
    type: int
    description: Last ping index to display. Omit to display through the last ping.
    required: false
  time_min:
    type: str
    description: >
      Start of the displayed window as a UTC timestamp, for example
      "2024-10-15T12:30". Resolved to the closest ping and used instead of
      ping_min. Omit to window by ping index.
    required: false
    default: null
  time_max:
    type: str
    description: >
      End of the displayed window as a UTC timestamp. Resolved to the closest
      ping and used instead of ping_max. Omit to window by ping index.
    required: false
    default: null
  x_axis_units:
    type: str
    description: >
      Units for the x-axis: 'datetime' (default, absolute UTC clock times),
      'seconds' from the first ping shown, 'pings', 'meters' (distance
      travelled, derived from the GPS track), or 'bins' (MVBS input only).
    required: false
    default: "datetime"
  y_axis_units:
    type: str
    description: >
      Units for the y-axis: 'meters' (default), 'range_sample', or 'bins'
      (MVBS input only).
    required: false
    default: "meters"
  panel_width_to_height:
    type: float
    description: >
      Force each frequency panel to be this many times wider than tall
      (for example 8 for a long strip). Omit for automatic sizing.
    required: false
    default: null
  overlay_lines:
    type: list
    description: >
      Optional list of line overlays. Each entry is a dict with 'var'
      (variable name in ds_Sv) and 'style' (dict of matplotlib kwargs).
    required: false
    default: []
  save_image:
    type: bool
    description: Save the rendered figure to an image file; null uses runtime defaults
    required: false
    default: null
  save_formats:
    type: list
    description: Image formats to save, chosen from png, svg, jpeg, jpg, and pdf
    required: false
    default: null
  save_dir:
    type: str
    description: Optional directory override for saved image artifacts
    required: false
    default: null
  show:
    type: bool
    description: Whether to display the figure interactively or inline; null uses runtime defaults
    required: false
    default: null
  dpi:
    type: int
    description: Optional DPI override for raster image outputs
    required: false
    default: 100
implementations:
  - key: default
    callable_path: aa_si_visualization.echogram.plot_sv_echogram
    default: true
    dependency:
      name: aa-si-visualization
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_Visualization.git
    param_map:
      ds_Sv_source: ds_Sv_original
      panel_width_to_height: y_to_x_aspect_ratio_override
