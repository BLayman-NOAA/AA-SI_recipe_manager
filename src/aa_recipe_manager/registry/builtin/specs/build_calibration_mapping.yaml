op: build_calibration_mapping
cache_key: build_calibration_mapping  # pinned cache identity - keep stable across op renames
description: >
  Match each raw channel to its calibration data and save the mapping files.

  Loads the raw file configurations and the standardized single-channel files,
  runs the matching algorithm, moves aside any calibration file no raw channel
  matched, resolves conflicts, writes mapping_files/channel_mapping.yaml,
  calibration_configurations.yaml and calibration_provenance.yaml, and
  verifies the result.

  Reads the single-channel files from disk rather than taking them as data.
  The mapping keys are those files' names, which only the on-disk loader
  attaches, and this step rewrites that folder.

  Mark it regenerate: always in a recipe. Its real product is the files on
  disk, and a hand-deleted single-channel file cannot change a cache key
  computed before the run, so a cache hit would return the dictionaries
  without re-reading the folder. The step is cheap: a few small local YAML
  reads and the matcher.
category: calibration
inputs:
  raw_file_configs:
    type: list
    required: false
    description: >
      The raw file configurations to map, normally from
      record_raw_file_configs. Read from the saved raw_file_configs.yaml
      under output_base when omitted.
outputs:
  mapping_dict:
    type: dict
    description: >
      Maps each raw file's channels to their calibration key, keyed by
      filename then channel_id. Feed to extract_standardized_cal_params.
  calibration_dict:
    type: dict
    description: >
      Parsed standardized calibration data keyed by calibration key. Holds the
      values themselves. Feed to extract_standardized_cal_params.
  missing_params:
    type: dict
    required: false
    description: >
      Calibration keys mapped to the required parameters they are missing. An
      empty dict means every required parameter is present.
  unused_files:
    type: list
    required: false
    description: >
      Names of single-channel calibration files the mapping does not
      reference, including the ones this run moved aside. An empty list means
      every calibration file matched a raw channel, so a non-empty one is the
      signal that a channel went unmapped. Under "report" no mapping exists to
      check against, so this carries only the files the run moved aside.
  provenance:
    type: dict
    required: false
    description: >
      Per-channel account of what calibration was applied over which stretch
      of the cruise, and why. Each channel carries segments, one per run of
      raw files that behaved the same way, with a time range, the raw and
      calibration settings behind it, and an outcome: the calibration was
      applied, it was applied only because a tolerance was widened, or nothing
      matched and the channel fell back or stopped the run. A cruise of
      thousands of files reports as a handful of segments per channel.

      JSON-safe, so a server can hand it to a client without reading the file
      off disk. The same content is written to
      mapping_files/calibration_provenance.yaml.

      Complete whatever happens downstream: the mapping stage sees every file
      in the catalogue, so this covers the whole cruise even when the per-file
      tier that consumes the mapping is still running or stopped early.
  provenance_path:
    type: str
    required: false
    description: >
      Where the provenance report was written as YAML, under
      mapping_files/ in output_base.
  conflicts:
    type: dict
    required: false
    description: >
      Unresolved multiple-match conflicts, keyed by a stable conflict id.
      Each carries the candidate calibration keys, a summary of every
      candidate, the raw files and channel ids it affects, and
      distinguishing_fields naming what actually differs between the
      candidates. That list excludes the fields two calibration records differ
      in by construction, such as the source filename and the created
      timestamp, so it names only what a reviewer has to weigh. It is empty
      when the candidates match everywhere it matters. Only populated under
      conflict_resolution
      "report"; empty when the mapping completed. A non-empty value means no
      mapping file was written, so feed the choices back as
      calibration_choices and run the step again.
params:
  output_base:
    type: path
    required: true
    description: >
      Root directory the calibration artifacts are written under. Normally
      wired to initial_setup's calibration_output_dir.
    constraints:
      must_exist: false
  single_channel_dir:
    type: path
    required: false
    description: >
      Folder of standardized single-channel files. Defaults to
      single_channel_calibration_files/ under output_base. Wire it to the
      standardization step's single_channel_dir output for the ordering
      dependency. Not fingerprinted, because a step-output reference is still
      an unresolved placeholder when cache keys are computed; use
      regenerate: always instead.
    constraints:
      must_exist: false
  raw_configs_path:
    type: path
    required: false
    description: >
      Path of the saved raw_file_configs.yaml. Defaults to
      raw_file_configs/raw_file_configs.yaml under output_base, and is only
      consulted when raw_file_configs is not supplied.
    constraints:
      must_exist: false
  conflict_resolution:
    type: str
    required: false
    default: "error"
    description: >
      What to do when one raw channel matches several calibration files.
      "error" (the default) lists the conflicts and stops, so you delete the
      unwanted single-channel file and re-run. "interactive" prompts on the
      terminal, and raises before any file is moved when the run has no
      interactive input. "report" neither raises nor prompts: it returns the
      conflicts on the conflicts output and writes no mapping file, which is
      the mode for a caller with no terminal that will present the choices
      and run the step again with calibration_choices.
  calibration_choices:
    type: dict
    required: false
    description: >
      Conflict decisions supplied up front, mapping a conflict id from a
      previous run's conflicts output to the calibration key to keep. Applied
      in every conflict_resolution mode before that mode's handler runs, so a
      partial map resolves what it covers and leaves the rest to be reported,
      prompted for, or raised on. An unknown conflict id, or a key that is not
      one of that conflict's candidates, is an error.
  tolerances:
    type: dict
    required: false
    description: >
      Per-field match tolerances, merged over the matcher's defaults so a dict
      naming only one field widens only that field. The defaults are exact for
      frequency, frequency_start, frequency_end and transmit_power (1 Hz / 1 W)
      and 1e-6 s for transmit_duration_nominal, because a calibration is
      formally valid only for the configuration it was measured at.

      Widening one is a scientific decision, not a convenience: a channel that
      matches only under a widened tolerance was calibrated at a different
      setting than it is being applied to, and the resulting gain and
      sa_correction carry a bias of that difference. Every override is reported
      on the terminal. Reach for it when a survey changed a setting mid-cruise
      and no calibration exists for the other side of the change, and record
      why in the recipe.
  unmapped_channels:
    type: str
    required: false
    description: >
      The policy the extract_standardized_cal_params step that consumes this
      mapping runs with, "warn" or "error". Informational only: it changes
      nothing about the matching, and only lets the provenance report state
      what actually happened to an unmatched channel instead of listing both
      possibilities. Set it to the same value that step uses, or leave it out
      and the report says the outcome is decided downstream.
  cruise_id:
    type: str
    required: false
    description: Recorded in the provenance report when given.
  keep_unused:
    type: bool
    required: false
    default: true
    description: >
      Move calibration files no raw channel matched into
      unused_calibration_files/ instead of deleting them. They are the
      evidence when a channel comes out unmapped.
  short_filenames:
    type: bool
    required: false
    default: true
    description: >
      Remap the returned dictionaries to compact calibration keys. Should
      match the setting the single-channel files were written with.
  verbose:
    type: bool
    required: false
    default: true
    description: Print the mapping summary, preview, and verification results.
implementations:
  - key: default
    callable_path: aa_si_calibration.calibration.build_calibration_mapping
    default: true
    dependency:
      name: aa-si-calibration
      version: ">=0.1.0"
      source: git
      url: https://github.com/BLayman-NOAA/AA-SI_calibration.git
    output_map:
      mapping_dict: "['mapping_dict']"
      calibration_dict: "['calibration_dict']"
      missing_params: "['missing_params']"
      # Paths are not JSON-safe, so the name list is mapped rather than the
      # Path list the function also returns.
      unused_files: "['unused_file_names']"
      conflicts: "['conflicts']"
      provenance: "['provenance']"
      provenance_path: "['provenance_path']"
