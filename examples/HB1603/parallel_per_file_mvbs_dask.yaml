# parallel_per_file_mvbs.yaml plus an execution: block and per-step execution
# overrides for the Dask executor. Each file's chain runs on one worker and
# merge_mvbs fans in on the client. The command line can still choose:
#   aa-recipe run parallel_per_file_mvbs_dask.yaml --executor dask \
#       --dask-scheduler processes --dask-workers 4
#   aa-recipe run parallel_per_file_mvbs_dask.yaml --executor sequential

recipe:
  name: "parallel_per_file_mvbs_dask"
  description: "Per-file (map_over) Sv -> MVBS with a collect/merge fan-in, run on Dask."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

# --executor overrides execution.executor; a step's execution: block overrides
# these defaults key by key.
execution:
  executor: dask            # "sequential" (default), "dask", or "prefect"
  dask_config:
    scheduler: threads
  checkpoint_format: zarr   # zarr intermediates hand off lazily between steps

inputs:
  raw_input_folder:
    type: path
    default: "./raw_file_inputs"
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  sonar_model:
    type: str
    default: "EK60"
    description: "Echosounder model as echopype names it, such as \"EK60\" or \"EK80\"."
  range_bin:
    type: str
    default: "20m"
    description: "Depth bin height of the MVBS grid, as a length string such as \"2m\"."
  ping_time_bin:
    type: str
    default: "20s"
    description: "Ping-time bin width of the MVBS grid, as a duration string such as \"10s\"."

steps:

  # Survey level: list the raw files once.
  - id: setup
    op: initial_setup
    params:
      raw_input_folder: ${inputs.raw_input_folder}

  # Per-file chain: the steps share one map_over source.
  - id: read_raw
    op: read_raw_files
    map_over: ${setup.raw_file_paths}
    inputs:
      raw_file_paths:
        - ${_item}
    params:
      sonar_model: ${inputs.sonar_model}
      intermediate_format: "none"

  - id: combine_raw
    op: combine_raw_files
    map_over: ${setup.raw_file_paths}
    checkpoint: always
    inputs:
      raw_stores: ${read_raw.raw_stores}

  - id: compute_sv
    op: compute_sv
    map_over: ${setup.raw_file_paths}
    checkpoint: always        # checkpoint so a process worker can reload it
    inputs:
      echodata: ${combine_raw.echodata}

  - id: compute_mvbs
    op: compute_mvbs
    map_over: ${setup.raw_file_paths}
    # CPU-bound, so it runs in a worker process to avoid the GIL, loading
    # compute_sv's checkpoint from the cache.
    execution:
      dask_config:
        scheduler: processes
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}

  # Fan-in: concatenate every file's MVBS along ping_time.
  - id: merge_mvbs
    op: merge_datasets
    collect: ${compute_mvbs.ds_MVBS}
    inputs:
      datasets: ${compute_mvbs.ds_MVBS}
    params:
      dim: "ping_time"
