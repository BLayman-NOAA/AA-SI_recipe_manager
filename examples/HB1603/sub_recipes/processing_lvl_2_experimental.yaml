# Processing level 2 with the seafloor line from HDBSCAN clustering instead of
# the .bot pick. Masking and noise removal match processing_lvl_2.yaml.
#
# Needs its own environment: two steps come from specs/experimental/, and
# ep_resample_to_geometry needs an echopype build pinned to a commit, not on PyPI:
#
#   aa-recipe env create processing_levels_pipeline_experimental.yaml --path ./hb1603_experimental_env
#
# Clustering the native 1548 x 15207 grid runs out of memory on 16 GB, so
# build_range_grid and ep_resample_to_geometry coarsen it to 5 m, capped at
# 2100 m (about 652 thousand points, under two minutes to cluster).
#
# The seafloor steps branch off compute_sv because the resampler keeps only Sv,
# echo_range, frequency_nominal and water_level. ep_add_depth runs again on the
# branch with the main chain's parameters so the line keeps the same vertical
# reference; only the 1-D line rejoins. On EK80 data the resample also aligns
# channels recorded at different sample intervals.
#
# The clustering sizes are not tuned. Smaller values have picked a bottom
# multiple at about twice the real depth; check the line before trusting a run.

recipe:
  name: "processing_lvl_2_experimental"
  description: "Compute Sv with HDBSCAN seafloor detection, build masks, and remove noise."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  echodata:
    type: echodata
    description: "Combined raw EchoData from level 1, calibrated to Sv here and used for transducer depth."
  cal_params:
    type: dict
    description: "Calibration values for each channel, taken from the standardized calibration mapping and applied when computing Sv."
  env_params:
    type: dict
    description: "Environmental values for each channel, such as sound speed and absorption, taken from the standardized calibration mapping and applied when computing Sv."
  noise_chunk_ping_time:
    type: int
    default: 100
    description: >
      Ping-time chunk size set before noise removal, so the noise estimate runs
      in dask chunks rather than as one in-memory block. Keep it a multiple of
      the noise ping_num.

steps:

  - id: compute_sv
    op: compute_sv
    checkpoint: always
    inputs:
      echodata: ${inputs.echodata}
      cal_params: ${inputs.cal_params}
      env_params: ${inputs.env_params}

  - id: ep_add_depth
    op: ep_add_depth
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      use_platform_vertical_offsets: true

  - id: ep_add_splitbeam_angle
    op: ep_add_splitbeam_angle
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      waveform_mode: "CW"
      encode_mode: "power"
      to_disk: false

  # Uncomment to log the .bot seafloor statistics to check the clustered line.
  # - id: log_seafloor_stats
  #   op: log_seafloor_detection_stats
  #   inputs:
  #     echodata: ${inputs.echodata}
  #     ds_Sv: ${compute_sv.ds_Sv}
  #   params:
  #     min_valid_depth_m: 10.0

  - id: seabed_grid
    op: build_range_grid
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      spacing_m: 5.0
      max_range_m: 2100.0

  - id: seabed_resample
    op: ep_resample_to_geometry
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      target_grid: ${seabed_grid.target_grid}

  - id: add_depth
    op: ep_add_depth
    inputs:
      ds_Sv: ${seabed_resample.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      use_platform_vertical_offsets: true

  - id: detect_seafloor
    checkpoint: save
    op: hdbscan_detect_seafloor
    inputs:
      ds_Sv: ${add_depth.ds_Sv}
    params:
      min_cluster_size: 2000
      min_samples: 500
      num_feature_channels: 2
      offset_m: 1.0

  - id: create_seafloor_mask
    op: create_seafloor_mask
    inputs:
      ds_Sv: ${ep_add_splitbeam_angle.ds_Sv}
      seafloor_depth: ${detect_seafloor.seafloor_depth}
    params:
      seafloor_buffer_m: 0

  - id: create_surface_mask
    op: create_surface_mask
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      surface_depth_m: 10.0

  - id: create_frequency_mask
    op: create_frequency_mask
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      frequencies_to_mask: [70, 120, 200]

  - id: combine_masks
    op: combine_masks
    inputs:
      masks:
        - ${create_seafloor_mask.mask}
        - ${create_surface_mask.mask}
        - ${create_frequency_mask.mask}
    params:
      mode: "and"

  # Sourced from ep_add_depth rather than compute_sv so the masked Sv carries
  # the depth variable, which level 3 needs when its range_var is "depth".
  - id: apply_mask
    op: apply_sv_mask
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      mask: ${combine_masks.mask}

  - id: rechunk_before_noise
    op: rechunk_dataset
    inputs:
      ds_Sv: ${apply_mask.ds_Sv}
    params:
      ping_time_chunk: ${inputs.noise_chunk_ping_time}

  - id: remove_noise
    op: remove_background_noise
    checkpoint: always
    inputs:
      ds_Sv: ${rechunk_before_noise.ds_Sv}
    params:
      range_sample_num: 10
      ping_num: 5
