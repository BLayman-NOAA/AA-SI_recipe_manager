# Processing level 3: sparse-bin masking, MVBS and per-cell statistics.

recipe:
  name: "processing_lvl_3"
  description: "Sparse masking, MVBS generation, and per-cell statistics."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  sv_clean_unmasked:
    type: dataset
    description: "Noise-removed Sv before sparse-bin masking; the sparse mask and the per-cell statistics are computed from it."
  range_bin:
    type: str
    default: "20m"
    description: "Depth bin height of the MVBS grid, as a length string such as \"2m\". The sparse-bin mask and the cell statistics use the same bin."
  ping_time_bin:
    type: str
    default: "20s"
    description: "Ping-time bin width of the MVBS grid, as a duration string such as \"10s\". The sparse-bin mask and the cell statistics use the same bin."
  # "depth" needs level 2 to route its masking chain through ep_add_depth. All
  # three binning steps take the same value, and compute_mvbs names its range
  # coordinate after it.
  range_var:
    type: str
    default: "echo_range"
    description: >
      Variable the bins are built on: "depth" (below the surface, shared across
      files and channels) or "echo_range" (from the transducer face).

steps:

  - id: mask_sparse
    op: mask_sparse_bins
    inputs:
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      nan_threshold: 0.6

  - id: compute_mvbs
    op: compute_mvbs
    checkpoint: always
    inputs:
      ds_Sv: ${mask_sparse.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}

  - id: compute_cell_stats
    op: compute_per_cell_statistics
    inputs:
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      range_var: ${inputs.range_var}
      statistics:
        - cv