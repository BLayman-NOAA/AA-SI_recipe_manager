# Processing level 1, per file: each raw file is opened on its own (map_over)
# and selects its calibration from the survey-wide mapping. There is no
# survey-wide combine_raw; the survey is reassembled after Sv in
# processing_lvl_2_parallel.yaml.
#
# The mapped chain continues into processing_lvl_2_parallel.yaml, which must be
# included immediately after this level.

recipe:
  name: "processing_lvl_1_parallel"
  description: "Per-file raw ingest with per-file calibration parameter selection."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_outputs:
    type: str
    default: "calibration"
    description: "Name of the subfolder of the run's outputs folder that calibration artifacts are written to."
  cruise_id:
    type: str
    description: "Cruise identifier, such as \"HB1603\", recorded in every generated single-channel calibration file so it stays traceable to the survey."
  record_author:
    type: str
    default: "<Your Name>"
    description: "Name recorded as the author of every generated single-channel calibration file."
  sonar_model:
    type: str
    default: "EK60"
    description: "Echosounder model as echopype names it, such as \"EK60\" or \"EK80\"."
  raw_file_names:
    type: list
    default: []
    description: >
      Optional list of file names within raw_input_folder to process. An empty
      list uses every .raw file in the folder.

steps:

  - id: initial_setup
    op: initial_setup
    params:
      raw_input_folder: ${inputs.raw_input_folder}
      calibration_outputs: ${inputs.calibration_outputs}
      raw_file_names: ${inputs.raw_file_names}
      clear_previous_json_logs: true

  # Runs once for the survey; each per-file extract_cal_params instance selects
  # its own file's entry from these dicts, so the calibration files are parsed
  # once.
  - id: gen_cal_mapping
    op: generate_standardized_cal_mapping
    params:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      output_base: ${initial_setup.calibration_output_dir}
      cruise_id: ${inputs.cruise_id}
      record_author: ${inputs.record_author}
      short_filenames: true
      keep_unused: true
      conflict_resolution: "error"

  # Per-file chain: every step from here through processing_lvl_2_parallel.yaml's
  # apply_mask shares this map_over source.

  # checkpoint: never because the output is an exe_temp store path deleted at
  # the end of the run; a cached path would dangle.
  - id: read_raw
    op: read_raw_files
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: never
    execution:
      dask_config:
        scheduler: processes
    inputs:
      raw_file_paths:
        - ${_item}          # a single-element list: just this file
    params:
      sonar_model: ${inputs.sonar_model}
      include_bot: true
      intermediate_format: "zarr"

  # Opens this file's store as an EchoData; not a fan-in.
  - id: combine_raw
    op: combine_raw_files
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      raw_stores: ${read_raw.raw_stores}

  # Selects this file's entry from the shared mapping, so each file gets the
  # calibration matching its own channel configuration.
  - id: extract_cal_params
    op: extract_standardized_cal_params
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      calibration_dict: ${gen_cal_mapping.calibration_dict}
      mapping_dict: ${gen_cal_mapping.mapping_dict}
      echodata: ${combine_raw.echodata}
    params:
      raw_file_path: ${_item}
