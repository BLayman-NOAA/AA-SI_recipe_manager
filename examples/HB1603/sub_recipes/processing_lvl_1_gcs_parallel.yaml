# Processing level 1 for data already in a bucket, with read_raw mapped over
# the raw files (one download and convert per instance) and combine_raw as the
# fan-in. gen_cal_mapping is independent of that branch, so a concurrent
# executor (--executor dask) overlaps the two.
#
# The file_time window is wired to both initial_setup and the calibration scan.
# It filters on file names, so out-of-window remote files are never downloaded.
#
# Each concurrent instance holds about one raw file on local disk, so peak use
# is concurrency times one file; cap it with --dask-workers if disk is tight.

recipe:
  name: "processing_lvl_1_gcs_parallel"
  description: "Initial setup through calibration parameter extraction (gs:// inputs)."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_outputs:
    type: str
    default: "calibration"
    description: "Name of the subfolder of the run's outputs folder that calibration artifacts are written to."
  cruise_id:
    type: str
    description: "Cruise identifier, such as \"HB1603\", recorded in every generated single-channel calibration file so it stays traceable to the survey."
  record_author:
    type: str
    default: "<Your Name>"
    description: "Name recorded as the author of every generated single-channel calibration file."
  sonar_model:
    type: str
    default: "EK60"
    description: "Echosounder model as echopype names it, such as \"EK60\" or \"EK80\"."
  raw_file_names:
    type: list
    default: []
    description: >
      Optional list of file names within raw_input_folder to process. An empty
      list uses every .raw file in the folder.
  # Also sets the fan-out width: one read_raw instance per selected file.
  file_time_start:
    type: str
    required: false
    description: >
      Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time
      in each raw file name; files at or after it are processed and scanned for
      calibration. Unset takes every file.
  file_time_end:
    type: str
    required: false
    description: >
      Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time
      in each raw file name; files at or before it are processed and scanned for
      calibration. Unset takes every file.
  ping_time_chunk:
    type: int
    default: 10000
    description: >
      Chunk length along ping_time of each file's EchoData and its checkpoint.
      Larger chunks mean fewer, faster remote writes but more memory per chunk.

steps:

  - id: initial_setup
    op: initial_setup
    params:
      raw_input_folder: ${inputs.raw_input_folder}
      calibration_outputs: ${inputs.calibration_outputs}
      raw_file_names: ${inputs.raw_file_names}
      clear_previous_json_logs: true
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}

  - id: gen_cal_mapping
    op: generate_standardized_cal_mapping
    params:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      output_base: ${initial_setup.calibration_output_dir}
      cruise_id: ${inputs.cruise_id}
      record_author: ${inputs.record_author}
      short_filenames: true
      keep_unused: true
      conflict_resolution: "error"
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}

  # Each instance is keyed by its own file path, so adding a file later
  # re-converts only that file. checkpoint: never because the outputs are
  # exe_temp store paths deleted at the end of the run; a cached path would
  # dangle. combine_raw's EchoData is the durable artifact.
  - id: read_raw
    op: read_raw_files
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: never
    execution:
      dask_config:
        scheduler: processes
    inputs:
      raw_file_paths:
        - ${_item}          # a single-element list: just this file
    params:
      sonar_model: ${inputs.sonar_model}
      include_bot: true
      intermediate_format: "zarr"

  # The collected value is a list of one-element lists ([[s0], [s1], ...]);
  # combine_raw_files flattens it in file order.
  - id: combine_raw
    op: combine_raw_files
    collect: ${read_raw.raw_stores}
    checkpoint: always
    inputs:
      raw_stores: ${read_raw.raw_stores}
    params:
      ping_time_chunk: ${inputs.ping_time_chunk}

  - id: extract_cal_params
    op: extract_standardized_cal_params
    inputs:
      calibration_dict: ${gen_cal_mapping.calibration_dict}
      mapping_dict: ${gen_cal_mapping.mapping_dict}
      echodata: ${combine_raw.echodata}
