# Processing level 2, per file through apply_mask, then merge_sv concatenates
# the masked Sv along ping_time and noise removal runs on the survey.
# Continues the mapped chain from processing_lvl_1_parallel.yaml, which must be
# included immediately before this file; its initial_setup is the map_over
# source here.
#
# The fan-in sits at apply_mask because ep_add_depth and detect_seafloor need
# each file's EchoData, and every step before it is ping-local, so per-file
# results equal survey-wide ones. remove_noise is the first step with a
# cross-ping window, so it stays after the merge and matches the non-parallel
# pipeline.
#
# detect_seafloor and create_seafloor_mask both read ep_add_depth's dataset;
# reading detect_seafloor off compute_sv silently offsets the mask by the
# transducer depth. ep_add_splitbeam_angle is off because nothing downstream
# uses the angles.

recipe:
  name: "processing_lvl_2_parallel"
  description: "Per-file Sv and masking, fan-in to survey Sv, then noise removal."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  echodata:
    type: echodata
    description: "One file's raw EchoData from level 1, calibrated to Sv here and used for transducer depth."
  cal_params:
    type: dict
    description: "Calibration values for each channel of this file, taken from the standardized calibration mapping and applied when computing Sv."
  env_params:
    type: dict
    description: "Environmental values for each channel of this file, such as sound speed and absorption, taken from the standardized calibration mapping and applied when computing Sv."
  # The transducer sits about 8.9 m down, so 10 m of range is roughly the top
  # 19 m of water.
  surface_depth_m:
    type: float
    default: 10.0
    description: "Range from the transducer, in metres, above which samples are masked, to remove the transmit pulse and ringdown."
  seafloor_buffer_m:
    type: float
    default: 100
    description: "Height above the seabed line, in metres, that is also masked, to drop the bottom echo and detection error."
  frequencies_to_mask:
    type: list
    default: [70, 120, 200]
    description: "Nominal channel frequencies in kHz to blank, such as [70, 120, 200]; every sample on those channels is masked. An empty list keeps every channel."
  # Left unset: the seafloor comes from the .bot detector, so the deepest-sample
  # distribution already carries detector misses and an outlier test would cut
  # against them. Set it if one glitch ping holds the range axis open.
  crop_outlier_sigma:
    type: float
    required: false
    description: >
      Standard deviations above the mean per-ping deepest sample at which a
      ping is an outlier; the crop lands on the deepest kept ping. Unset falls
      back to the trailing NaN trim.
  crop_outlier_margin:
    type: float
    default: 1.5
    description: >
      Multiplier on (mean + crop_outlier_sigma * sd) of the per-ping deepest
      sample that gives the reject threshold. Raise it to flag fewer pings.
      Used only when crop_outlier_sigma is set.
  crop_trailing_all_nan:
    type: bool
    default: true
    description: >
      Drop trailing range samples with no finite Sv anywhere. Lossless; ignored
      when crop_outlier_sigma is set. False, with the other two crop inputs
      unset, turns the crop off.
  # Left unset: the seafloor runs past 1000 m, so a fixed ceiling risks
  # dropping real data.
  crop_max_range_m:
    type: float
    required: false
    description: >
      Range ceiling in metres; samples beyond it are dropped even if they hold
      data. With other crop criteria set, the shallowest cut wins. Unset
      derives the crop from the data.
  noise_range_sample_num:
    type: int
    default: 10
    description: "Range samples per bin for the background noise estimate."
  noise_ping_num:
    type: int
    default: 5
    description: "Pings per bin for the background noise estimate."
  # Benchmarked about 40% faster than one block on HB1603 (2026-07-31). It must
  # be smaller than the survey's ping count, or it is a single chunk.
  noise_chunk_ping_time:
    type: int
    default: 100
    description: >
      Ping-time chunk size set before noise removal, so the noise estimate runs
      in dask chunks rather than as one in-memory block. Keep it a multiple of
      noise_ping_num.

steps:

  # Per-file chain, continuing the map_over from level 1.

  - id: compute_sv
    op: compute_sv
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: always
    inputs:
      echodata: ${inputs.echodata}
      cal_params: ${inputs.cal_params}
      env_params: ${inputs.env_params}

  - id: ep_add_depth
    op: ep_add_depth
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      use_platform_vertical_offsets: true

  # Disabled: see the file header.
  # - id: ep_add_splitbeam_angle
  #   op: ep_add_splitbeam_angle
  #   map_over: ${initial_setup.raw_file_paths}
  #   inputs:
  #     ds_Sv: ${ep_add_depth.ds_Sv}
  #     echodata: ${inputs.echodata}
  #   params:
  #     waveform_mode: "CW"
  #     encode_mode: "power"
  #     to_disk: false

  - id: log_seafloor_stats
    op: log_seafloor_detection_stats
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      echodata: ${inputs.echodata}
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      min_valid_depth_m: 10.0

  # Reads ep_add_depth's dataset so the line is surface referenced; see the
  # file header.
  - id: detect_seafloor
    op: detect_seafloor
    map_over: ${initial_setup.raw_file_paths}
    depends_on: [log_seafloor_stats]
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      min_valid_depth_m: 10.0

  - id: create_seafloor_mask
    op: create_seafloor_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      # Must be the same depth-carrying dataset detect_seafloor read.
      ds_Sv: ${ep_add_depth.ds_Sv}
      seafloor_depth: ${detect_seafloor.seafloor_depth}
    params:
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  - id: create_surface_mask
    op: create_surface_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_depth_m}

  - id: create_frequency_mask
    op: create_frequency_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      frequencies_to_mask: ${inputs.frequencies_to_mask}

  - id: combine_masks
    op: combine_masks
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      masks:
        - ${create_seafloor_mask.mask}
        - ${create_surface_mask.mask}
        - ${create_frequency_mask.mask}
    params:
      mode: "and"

  # Sourced from ep_add_depth rather than compute_sv so the masked Sv carries
  # the depth variable, which level 3 needs when its range_var is "depth".
  - id: apply_mask
    op: apply_sv_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      mask: ${combine_masks.mask}

  # Fan-in: reassemble the survey from the per-file masked Sv.

  - id: merge_sv
    op: merge_datasets
    collect: ${apply_mask.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${apply_mask.ds_Sv}
    params:
      dim: "ping_time"

  # Survey-wide from here on.

  # Drops the all-NaN samples below the deepest seafloor, which would otherwise
  # widen every later grid. It sits after the fan-in because cropping per file
  # gives different range_sample lengths that merge_sv pads back with NaN.
  - id: crop_range
    op: crop_range
    checkpoint: always
    inputs:
      ds_Sv: ${merge_sv.merged}
    params:
      outlier_sigma: ${inputs.crop_outlier_sigma}
      outlier_margin: ${inputs.crop_outlier_margin}
      drop_trailing_all_nan: ${inputs.crop_trailing_all_nan}
      max_range_m: ${inputs.crop_max_range_m}

  - id: rechunk_before_noise
    op: rechunk_dataset
    inputs:
      ds_Sv: ${crop_range.ds_Sv}
    params:
      ping_time_chunk: ${inputs.noise_chunk_ping_time}

  - id: remove_noise
    op: remove_background_noise
    checkpoint: always
    inputs:
      ds_Sv: ${rechunk_before_noise.ds_Sv}
    params:
      range_sample_num: ${inputs.noise_range_sample_num}
      ping_num: ${inputs.noise_ping_num}
