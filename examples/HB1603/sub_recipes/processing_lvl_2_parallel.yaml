# Processing Level 2 (Parallel) - Per-File Sv, Masking, then Survey Fan-In
#
# Per-file variant of processing_lvl_2.yaml. Continues the mapped chain
# started in processing_lvl_1_parallel.yaml (which must be included
# immediately before this level), so every step through apply_mask runs once
# per raw file. merge_sv is the single fan-in: it concatenates the per-file
# masked Sv datasets back into one survey-wide Sv along ping_time. Background
# noise removal and everything after it run on that merged survey dataset.
#
#   [per file] compute_sv -> ep_add_depth
#              -> log_seafloor_stats -> detect_seafloor
#              -> seafloor/surface/frequency masks -> combine -> apply_mask
#   [fan-in]   merge_sv (collect, concat along ping_time)
#   [survey]   crop_range -> rechunk_before_noise -> remove_noise
#
# WHY THE FAN-IN SITS AT apply_mask, not immediately after compute_sv:
#
#   * ep_add_depth, log_seafloor_stats and detect_seafloor all need the
#     EchoData that produced the Sv. Merging
#     right after compute_sv would leave them with no per-file EchoData and
#     force a survey-wide combine_raw back into the pipeline -- exactly the
#     up-front combine this design removes.
#   * Every step in the chain is ping-local (per-ping platform offsets,
#     per-ping seafloor detection, elementwise masks), so computing them per
#     file gives the same result as computing them on the whole survey.
#   * remove_noise is the FIRST step with a cross-ping window: its
#     coarsen()-based estimate spans noise_ping_num pings, so running it per
#     file would change the noise estimate at file boundaries. It therefore
#     stays survey-wide, after the merge, and its result is identical to the
#     non-parallel pipeline's.
#
# VERTICAL REFERENCE
#
# ep_add_depth adds the surface-referenced 'depth' variable, and detect_seafloor
# returns a line matched to whichever dataset it is given: surface referenced
# when that dataset carries 'depth', transducer referenced otherwise.
# create_seafloor_mask picks its comparison variable the same way. Both
# therefore read ep_add_depth's dataset, so the line and the samples share one
# reference. Reading detect_seafloor off compute_sv instead pairs a
# transducer-referenced line against surface-referenced samples, which offsets
# the mask by the transducer depth without erroring.
#
# ep_add_splitbeam_angle is commented out below: nothing downstream consumes
# split-beam angles. apply_mask sources ep_add_depth, so the angles never
# reached an output -- the step was per-file work whose result was discarded.
# Restore it, and point create_seafloor_mask back at its output, if a later
# step needs them.
#
# The map_over source below is ${initial_setup.raw_file_paths}, a step
# defined in processing_lvl_1_parallel.yaml. Includes flatten into a single
# step namespace, so this resolves as long as level 1 (parallel) is included
# ahead of this file.

recipe:
  name: "processing_lvl_2_parallel"
  description: "Per-file Sv and masking, fan-in to survey Sv, then noise removal."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  echodata:
    type: echodata
    description: "Per-file EchoData object from the parallel raw ingest stage."
  cal_params:
    type: dict
    description: "Calibration parameters selected for this file."
  env_params:
    type: dict
    description: "Environmental parameters selected for this file."
  surface_depth_m:
    type: float
    default: 10.0
    description: "Depth above which samples are masked out as surface noise."
  seafloor_buffer_m:
    type: float
    default: 100
    description: "Buffer above the detected seafloor to keep in the seafloor mask."
  frequencies_to_mask:
    type: list
    default: [70, 120, 200]
    description: "Frequencies (kHz) removed by the frequency mask."
  crop_outlier_sigma:
    type: float
    required: false
    description: >
      Standard deviations above the mean per-ping deepest sample at which a
      ping is treated as anomalous. The crop then lands on the deepest
      RETAINED ping, so uncommon-but-real depths survive. Left unset here:
      this survey's seafloor is detected per ping from the .bot returns rather
      than read off a hand-verified line, so the deepest-sample distribution
      already carries the detector's own misses and an outlier test would cut
      against them. Set it if a single glitch ping is holding the range axis
      open and defeating the lossless trim below.
  crop_outlier_margin:
    type: float
    default: 1.5
    description: >
      Multiplier on (mean + crop_outlier_sigma * sd) forming the reject
      threshold. Raise to flag fewer pings, lower to flag more. Only used
      when crop_outlier_sigma is set.
  crop_trailing_all_nan:
    type: bool
    default: true
    description: >
      Drop trailing range samples that hold no finite Sv anywhere in the
      survey. Lossless, which is why it is the default for this survey.
      Ignored when crop_outlier_sigma is set. Set false with the other two
      unset to disable the crop step.
  crop_max_range_m:
    type: float
    required: false
    description: >
      Hard depth ceiling for the crop, in metres. Composes with the criteria
      above rather than replacing them: the shallowest cut wins. Drops samples
      whether or not they hold data. Left unset: this is a deep survey whose
      seafloor runs past 1000 m, so a hand-picked ceiling is far more likely
      to discard real data here than on a shelf survey.
  noise_range_sample_num:
    type: int
    default: 10
    description: "Range-sample window for the background noise estimate."
  noise_ping_num:
    type: int
    default: 5
    description: "Ping window for the background noise estimate."
  noise_chunk_ping_time:
    type: int
    default: 100
    description: >
      Ping-time chunk size applied to the MERGED survey Sv before
      remove_noise, so its coarsen()-based noise estimate runs in
      dask-parallel chunks instead of as one in-memory block. Confirmed via
      isolated benchmark (2026-07-31, real compute_sv checkpoint, 1548-ping
      window) to be a genuine ~40% win here, despite echopype's
      add_remove_background_noise_attrs redundant-recompute inefficiency --
      see recipe_optimization_plan.md section 6. Kept a multiple of
      noise_ping_num so coarsen() dispatches across chunks cleanly.

steps:

  # --- Per-file chain (continues the map_over from level 1) ---------------

  - id: compute_sv
    op: compute_sv
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: always
    inputs:
      echodata: ${inputs.echodata}
      cal_params: ${inputs.cal_params}
      env_params: ${inputs.env_params}

  - id: ep_add_depth
    op: ep_add_depth
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      use_platform_vertical_offsets: true

  # Disabled: its output fed only create_seafloor_mask, which now reads
  # ep_add_depth directly, and nothing downstream consumes split-beam angles.
  # See the file header.
  # - id: ep_add_splitbeam_angle
  #   op: ep_add_splitbeam_angle
  #   map_over: ${initial_setup.raw_file_paths}
  #   inputs:
  #     ds_Sv: ${ep_add_depth.ds_Sv}
  #     echodata: ${inputs.echodata}
  #   params:
  #     waveform_mode: "CW"
  #     encode_mode: "power"
  #     to_disk: false

  - id: log_seafloor_stats
    op: log_seafloor_detection_stats
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      echodata: ${inputs.echodata}
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      min_valid_depth_m: 10.0

  # Reads ep_add_depth's dataset, not compute_sv's, so the line comes back
  # surface referenced and matches the 'depth' variable create_seafloor_mask
  # compares it against. See the file header.
  - id: detect_seafloor
    op: detect_seafloor
    map_over: ${initial_setup.raw_file_paths}
    depends_on: [log_seafloor_stats]
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      min_valid_depth_m: 10.0

  - id: create_seafloor_mask
    op: create_seafloor_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      # Must be the same depth-carrying dataset detect_seafloor read.
      ds_Sv: ${ep_add_depth.ds_Sv}
      seafloor_depth: ${detect_seafloor.seafloor_depth}
    params:
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  - id: create_surface_mask
    op: create_surface_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_depth_m}

  - id: create_frequency_mask
    op: create_frequency_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      frequencies_to_mask: ${inputs.frequencies_to_mask}

  - id: combine_masks
    op: combine_masks
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      masks:
        - ${create_seafloor_mask.mask}
        - ${create_surface_mask.mask}
        - ${create_frequency_mask.mask}
    params:
      mode: "and"

  # Sourced from ep_add_depth rather than compute_sv so the masked Sv carries
  # the depth variable, which level 3 needs when its range_var is "depth".
  - id: apply_mask
    op: apply_sv_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      mask: ${combine_masks.mask}

  # --- Fan-in: reassemble the survey from the per-file masked Sv ----------

  - id: merge_sv
    op: merge_datasets
    collect: ${apply_mask.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${apply_mask.ds_Sv}
    params:
      dim: "ping_time"

  # --- Survey-wide from here on ------------------------------------------

  # Everything below the deepest seafloor is NaN after apply_mask, but it still
  # occupies range samples. Dropping them here, once, shrinks every step that
  # follows: remove_noise, mask_sparse, compute_mvbs and the cell-statistics
  # grid all work on the trimmed axis. This survey records well past the
  # seafloor, so the lossless trim alone takes a large bite.
  #
  # It sits after the fan-in deliberately: the crop point is survey-wide, and
  # cropping per file would leave segments with different range_sample lengths
  # that merge_sv pads back out with NaN. See the op's description.
  - id: crop_range
    op: crop_range
    checkpoint: always
    inputs:
      ds_Sv: ${merge_sv.merged}
    params:
      outlier_sigma: ${inputs.crop_outlier_sigma}
      outlier_margin: ${inputs.crop_outlier_margin}
      drop_trailing_all_nan: ${inputs.crop_trailing_all_nan}
      max_range_m: ${inputs.crop_max_range_m}

  - id: rechunk_before_noise
    op: rechunk_dataset
    inputs:
      ds_Sv: ${crop_range.ds_Sv}
    params:
      ping_time_chunk: ${inputs.noise_chunk_ping_time}

  - id: remove_noise
    op: remove_background_noise
    checkpoint: always
    inputs:
      ds_Sv: ${rechunk_before_noise.ds_Sv}
    params:
      range_sample_num: ${inputs.noise_range_sample_num}
      ping_num: ${inputs.noise_ping_num}
