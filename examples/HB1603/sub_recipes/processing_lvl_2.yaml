# Processing level 2: Sv, masking and noise removal.
#
# detect_seafloor and create_seafloor_mask both read ep_add_depth's dataset.
# Each follows the dataset it is given (surface referenced when it carries
# 'depth'), so reading detect_seafloor off compute_sv instead silently offsets
# the mask by the transducer depth.
#
# ep_add_splitbeam_angle is commented out because nothing downstream uses the
# angles. Restore it, and point create_seafloor_mask at its output, if a later
# step needs them.

recipe:
  name: "processing_lvl_2"
  description: "Compute Sv, build masks, and remove noise."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  echodata:
    type: echodata
    description: "Combined raw EchoData from level 1, calibrated to Sv here and used for transducer depth."
  cal_params:
    type: dict
    description: "Calibration values for each channel, taken from the standardized calibration mapping and applied when computing Sv."
  env_params:
    type: dict
    description: "Environmental values for each channel, such as sound speed and absorption, taken from the standardized calibration mapping and applied when computing Sv."
  noise_chunk_ping_time:
    type: int
    default: 1000
    description: >
      Ping-time chunk size set before noise removal, so the noise estimate runs
      in dask chunks rather than as one in-memory block. Keep it a multiple of
      the noise ping_num.

steps:

  - id: compute_sv
    op: compute_sv
    checkpoint: always
    inputs:
      echodata: ${inputs.echodata}
      cal_params: ${inputs.cal_params}
      env_params: ${inputs.env_params}

  - id: ep_add_depth
    op: ep_add_depth
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      use_platform_vertical_offsets: true

  # Disabled: see the file header.
  # - id: ep_add_splitbeam_angle
  #   op: ep_add_splitbeam_angle
  #   inputs:
  #     ds_Sv: ${ep_add_depth.ds_Sv}
  #     echodata: ${inputs.echodata}
  #   params:
  #     waveform_mode: "CW"
  #     encode_mode: "power"
  #     to_disk: false

  # Optional: logs statistics only.
  - id: log_seafloor_stats
    op: log_seafloor_detection_stats
    inputs:
      echodata: ${inputs.echodata}
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      min_valid_depth_m: 10.0

  # Seafloor from the .bot files, surface referenced; see the file header.
  - id: detect_seafloor
    op: detect_seafloor
    depends_on: [log_seafloor_stats]
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      min_valid_depth_m: 10.0

  - id: create_seafloor_mask
    op: create_seafloor_mask
    inputs:
      # Must be the same depth-carrying dataset detect_seafloor read.
      ds_Sv: ${ep_add_depth.ds_Sv}
      seafloor_depth: ${detect_seafloor.seafloor_depth}
    params:
      seafloor_buffer_m: 10

  - id: create_surface_mask
    op: create_surface_mask
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      surface_depth_m: 10.0

  - id: create_frequency_mask
    op: create_frequency_mask
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      frequencies_to_mask: [70, 120, 200]

  - id: combine_masks
    op: combine_masks
    inputs:
      masks:
        - ${create_seafloor_mask.mask}
        - ${create_surface_mask.mask}
        - ${create_frequency_mask.mask}
    params:
      mode: "and"

  # Sourced from ep_add_depth rather than compute_sv so the masked Sv carries
  # the depth variable, which level 3 needs when its range_var is "depth".
  - id: apply_mask
    op: apply_sv_mask
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      mask: ${combine_masks.mask}

  # Drops the all-NaN samples below the deepest seafloor, which would otherwise
  # widen every later grid. Lossless.
  - id: crop_range
    op: crop_range
    checkpoint: always
    inputs:
      ds_Sv: ${apply_mask.ds_Sv}
    params:
      drop_trailing_all_nan: true

  - id: rechunk_before_noise
    op: rechunk_dataset
    inputs:
      ds_Sv: ${crop_range.ds_Sv}
    params:
      ping_time_chunk: ${inputs.noise_chunk_ping_time}

  - id: remove_noise
    op: remove_background_noise
    checkpoint: always
    inputs:
      ds_Sv: ${rechunk_before_noise.ds_Sv}
    params:
      range_sample_num: 10
      ping_num: 5
