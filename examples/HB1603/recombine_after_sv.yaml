# HB1603 processing levels with Sv computed per file and the survey recombined
# after Sv. Each raw file is read, calibrated, converted to Sv and masked on its
# own (map_over); the masked Sv is then concatenated along ping_time.
#
#   level 0    download raw files
#   level 1    per file: read, open, select this file's calibration
#   level 2    per file: Sv, depth, seafloor, masks; fan-in to one survey Sv;
#              survey: crop, rechunk, remove background noise
#   level 3    survey: sparse masking, MVBS, per-cell statistics
#   level 4    survey: ML reshape, clustering, reporting
#
# remove_noise is the first step whose estimate spans pings, so the fan-in comes
# before it and everything from there matches the non-parallel pipeline. See
# processing_lvl_2_parallel.yaml.
#
# Run sequentially, or with the per-file instances on worker processes:
#   aa-recipe run recombine_after_sv.yaml
#   aa-recipe run recombine_after_sv.yaml --executor dask

recipe:
  name: "processing_levels_pipeline_parallel"
  description: "HB1603 processing-levels pipeline with per-file parallel Sv and a post-Sv fan-in."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    default: "./raw_file_inputs"
    description: "Local folder the NCEI download writes raw files into."
  cal_input_folder:
    type: path
    default: "./calibration_files/HB201607_cal"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  line_file_path:
    type: path
    default: "./line_files/SpermWhaleClicks_click_data_HB1603_SpermWhaleDive_Span0.2_07252016_2120_UTC.csv"
    description: "Line file drawn over the MVBS grid and echograms, such as a sperm whale click track (.csv) or an Echoview .evl line. A local path or a gs:// URL."
  range_bin:
    type: str
    default: "20m"
    description: "Depth bin height of the MVBS grid, as a length string such as \"2m\". The sparse-bin mask and the cell statistics use the same bin."
  ping_time_bin:
    type: str
    default: "20s"
    description: "Ping-time bin width of the MVBS grid, as a duration string such as \"10s\". The sparse-bin mask and the cell statistics use the same bin."

steps:

  - include: sub_recipes/processing_lvl_0.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      file_time_start: "2016-07-25T20:58"
      file_time_end: "2016-07-25T23:45"
      cruise_name: "HB1603"

  - include: sub_recipes/processing_lvl_1_parallel.yaml
    input_overrides:
      raw_input_folder: ${download_raw.download_dir}
      cal_input_folder: ${inputs.cal_input_folder}
      cruise_id: "HB1603"
      record_author: "<Your Name>"
      sonar_model: "EK60"

  # Must follow level 1 (parallel) directly: it continues the same per-file
  # mapped chain.
  - include: sub_recipes/processing_lvl_2_parallel.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}

  - id: plot_sv_clean
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${remove_noise.ds_Sv}
    params:
      min_depth: 0
      max_depth: 1800
      ping_min: 0
      ping_max: 515
      x_axis_units: "seconds"
      y_axis_units: "meters"

  - include: sub_recipes/processing_lvl_3.yaml
    input_overrides:
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}

  - id: add_line_overlay
    op: add_line_overlay
    inputs:
      ds: ${compute_mvbs.ds_MVBS}
    params:
      line_file_path: ${inputs.line_file_path}
      line_name: "sw_dive_profile"

  - id: plot_mvbs
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${add_line_overlay.ds}
      ds_Sv_source: ${mask_sparse.ds_Sv}
    params:
      min_depth: 0
      max_depth: 1800
      ping_min: 0
      ping_max: 515
      x_axis_units: "seconds"
      y_axis_units: "meters"
      overlay_lines:
        - var: "sw_dive_profile_fit"
          style:
            color: "red"
            linewidth: 3.5

  # No echodata: this pipeline builds no survey-wide EchoData, and level 4's
  # cell_cv feature does not need it.
  - include: sub_recipes/processing_lvl_4.yaml
    input_overrides:
      mvbs_with_lines: ${add_line_overlay.ds}
      overlay_line_var: "sw_dive_profile"
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      cell_stats_sv: ${compute_cell_stats.ds_Sv}
