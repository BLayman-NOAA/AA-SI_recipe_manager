# ML sub-recipe with two HDBSCAN passes: pass 2 re-clusters the pass 1 noise
# points and the passes are merged. The parent supplies the datasets through
# input_overrides.

recipe:
  name: "machine_learning_multi_pass"
  description: >-
    ML reshape, normalization and two-pass HDBSCAN clustering. Pass 2
    re-clusters the pass 1 noise points with tighter settings to recover finer
    structure, and the passes are merged into one result.
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  mvbs_with_lines:
    type: dataset
    description: "Gridded MVBS with the line overlay variables added, flattened into one ML sample per cell."
  echodata:
    type: echodata
    description: "Raw EchoData supplying the echosounder's own bottom pick for the 'seafloor_depth' and 'altitude' features. Used only when seafloor_depth is not wired."
  overlay_line_var:
    type: str
    default: "overlay_line"
    description: "Name of the line variable drawn over the clustering report plots."
  sv_clean_unmasked:
    type: dataset
    description: >
      Noise-removed Sv before sparse-bin masking, used for the per-cell
      statistics and as the backdrop and ping reference for the ML and cluster
      echograms.
  range_bin:
    type: str
    default: "20m"
    description: "Depth bin height of the MVBS grid, as a length string such as \"2m\". The sparse-bin mask and the cell statistics use the same bin."
  ping_time_bin:
    type: str
    default: "20s"
    description: "Ping-time bin width of the MVBS grid, as a duration string such as \"10s\". The sparse-bin mask and the cell statistics use the same bin."

steps:

  - id: compute_cell_stats
    op: compute_per_cell_statistics
    inputs:
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      statistics:
        - cv

  - id: reshape_ml
    op: reshape_for_ml
    inputs:
      ds_MVBS: ${inputs.mvbs_with_lines}
    params:
      data_var: "Sv"
      dataset_name: "ml_dataset"
      feature_strategy: "mean_centered"
      baseline_channel: 0

  - id: add_aux_features
    op: add_auxiliary_features
    inputs:
      ds_ml: ${reshape_ml.ds_ml_ready}
      echodata: ${inputs.echodata}
      ds_sv: ${compute_cell_stats.ds_Sv}
    params:
      dataset_name: "ml_dataset"
      features:
        - cell_cv
        - depth

  - id: normalize_ml
    op: normalize_ml_data
    checkpoint: always
    inputs:
      ds_ml: ${add_aux_features.ds_ml_ready}
    params:
      method: "flatten"
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      shift_positive: false

  - id: plot_normalized_ml
    op: plot_ml_echogram
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      min_depth: 0
      max_depth: 1800
      ping_min: 0
      ping_max: 515
      x_axis_units: "seconds"
      y_axis_units: "meters"

  - id: run_hdbscan
    op: run_hdbscan
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      ml_result_name: "hdbscan_results"
      min_cluster_size_fraction: 0.02
      min_samples: 10
      sample_size: 1000000
      cluster_selection_method: "leaf"
      use_hdbscan: true
      # soft_membership_threshold: .6

  # Pass 2: re-cluster the noise points.

  - id: filter_noise
    op: filter_normalized_by_cluster
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
    params:
      cluster_label: -1
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"

  - id: run_hdbscan_pass2
    op: run_hdbscan
    inputs:
      ds_normalized: ${filter_noise.ds_normalized_filtered}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      ml_result_name: "hdbscan_pass2"
      min_cluster_size_fraction: 0.005
      min_samples: 4
      sample_size: 1000000
      cluster_selection_method: "eom"
      use_hdbscan: true

  # Merge pass 1 and pass 2.

  - id: merge_passes
    op: merge_clustering_passes
    inputs:
      clustering_results_pass1: ${run_hdbscan.clustering_results}
      clustering_results_pass2:
        - ${run_hdbscan_pass2.clustering_results}
    params:
      ml_result_name: "hdbscan_merged"
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      retain_parent_labels: true

  - id: embed_results
    op: embed_clustering_results
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${merge_passes.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_merged"

  - id: plot_clustering_report
    op: plot_clustering_report
    inputs:
      ds_normalized: ${embed_results.ds_normalized}
      clustering_results: ${merge_passes.clustering_results}
      clustering_model: ${run_hdbscan.clustering_model}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_merged"
      plot_window: [0, 1800, 0, 515]
      overlay_line_var: ${inputs.overlay_line_var}
      cluster_colors:
        - "#9D00FF"
        - "#35E200"
        - "#FF0000"
        - "#2F00FF"
        - "#FF8800"
        - "#00BE8BCA"
        - "#3D8D00FF"
        - "#FFFB1C"
        - "#00FFE5"
        - "#FF44E9"
        - "#9C67FFFF"
      cluster_stats_sv_data_var: "Sv"
