# processing_levels_pipeline.yaml for raw data already in a bucket, with no
# NCEI download (level 0) and level 1 from processing_lvl_1_gcs_parallel.yaml,
# which maps read_raw over the raw files; add --executor dask to run them
# concurrently. Each raw file is downloaded to local scratch, converted to zarr
# and deleted.
#
# Authentication uses Application Default Credentials, for example
# `gcloud auth application-default login` or a Cloud Workstation's identity.
#
# Requirements:
#   pip install -e AA-SI_recipe_manager[gcs] AA-SI_Utils[gcs] AA-SI_calibration[gcs]
#
# Low-disk run, with the cache and scratch in the bucket:
#   aa-recipe run processing_levels_pipeline_gcs_parallel.yaml \
#     --output-dir gs://YOUR_BUCKET/runs/hb1603/recipe_cache \
#     --temp-dir   gs://YOUR_BUCKET/runs/hb1603/exe_temp \
#     --outputs-dir ./outputs
#
# Simple test, with a local cache and scratch:
#   aa-recipe run processing_levels_pipeline_gcs_parallel.yaml --output-dir ./recipe_cache
#
# --outputs-dir must stay local: calibration artifacts and images are written
# through pathlib.

recipe:
  name: "processing_levels_pipeline_gcs"
  description: "HB1603 processing levels pipeline reading all inputs from a GCS bucket."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    default: "gs://ggn-nmfs-aa-dev-1-data/Test_Layman/HB1603/raw"
    description: "Folder of raw .raw files, a local path or a gs:// URL."
    # auto hashes the folder's contents (names and checksums on GCS), not its
    # path.
    fingerprint_mode: auto
  cal_input_folder:
    type: path
    default: "./calibration_files/HB201607_cal"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  line_file_path:
    type: path
    default: "./line_files/SpermWhaleClicks_click_data_HB1603_SpermWhaleDive_Span0.2_07252016_2120_UTC.csv"
    description: "Line file drawn over the MVBS grid and echograms, such as a sperm whale click track (.csv) or an Echoview .evl line. A local path or a gs:// URL."
  # The defaults select a short test window; widen them to process more of
  # the folder.
  file_time_start:
    type: str
    default: "2016-07-25T20:58"
    description: "Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time in each raw file name; files at or after it are processed and scanned for calibration. Unset takes every file."
  file_time_end:
    type: str
    default: "2016-07-25T21:45"
    description: "Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time in each raw file name; files at or before it are processed and scanned for calibration. Unset takes every file."
  range_bin:
    type: str
    default: "20m"
    description: "Depth bin height of the MVBS grid, as a length string such as \"2m\". The sparse-bin mask and the cell statistics use the same bin."
  ping_time_bin:
    type: str
    default: "20s"
    description: "Ping-time bin width of the MVBS grid, as a duration string such as \"10s\". The sparse-bin mask and the cell statistics use the same bin."

steps:

  - include: sub_recipes/processing_lvl_1_gcs_parallel.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      cruise_id: "HB1603"
      record_author: "<Your Name>"
      sonar_model: "EK60"

  - include: sub_recipes/processing_lvl_2.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}

  - id: plot_sv_clean
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${remove_noise.ds_Sv}
    params:
      min_depth: 0
      max_depth: 1800
      ping_min: 0
      ping_max: 515
      x_axis_units: "seconds"
      y_axis_units: "meters"

  - include: sub_recipes/processing_lvl_3.yaml
    input_overrides:
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}

  - id: add_line_overlay
    op: add_line_overlay
    inputs:
      ds: ${compute_mvbs.ds_MVBS}
    params:
      line_file_path: ${inputs.line_file_path}
      line_name: "sw_dive_profile"

  - id: plot_mvbs
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${add_line_overlay.ds}
      ds_Sv_source: ${mask_sparse.ds_Sv}
    params:
      min_depth: 0
      max_depth: 1800
      ping_min: 0
      ping_max: 515
      x_axis_units: "seconds"
      y_axis_units: "meters"
      overlay_lines:
        - var: "sw_dive_profile_fit"
          style:
            color: "red"
            linewidth: 3.5

  - include: sub_recipes/processing_lvl_4.yaml
    input_overrides:
      mvbs_with_lines: ${add_line_overlay.ds}
      echodata: ${combine_raw.echodata}
      overlay_line_var: "sw_dive_profile"
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      cell_stats_sv: ${compute_cell_stats.ds_Sv}
