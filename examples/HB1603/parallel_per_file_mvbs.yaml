# Per-file MVBS demonstrating map_over and collect. The read, combine, Sv and
# MVBS steps are mapped over the raw file list, each file checkpointed under
# its own instance hash, and merge_mvbs concatenates the per-file MVBS.
#
# Usage: aa-recipe generate parallel_per_file_mvbs.yaml
#        aa-recipe dry-run  parallel_per_file_mvbs.yaml --visualize

recipe:
  name: "parallel_per_file_mvbs"
  description: "Per-file (map_over) Sv -> MVBS with a collect/merge fan-in."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    default: "./raw_file_inputs"
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  sonar_model:
    type: str
    default: "EK60"
    description: "Echosounder model as echopype names it, such as \"EK60\" or \"EK80\"."
  range_bin:
    type: str
    default: "20m"
    description: "Depth bin height of the MVBS grid, as a length string such as \"2m\"."
  ping_time_bin:
    type: str
    default: "20s"
    description: "Ping-time bin width of the MVBS grid, as a duration string such as \"10s\"."

steps:

  # Survey level: list the raw files once.
  - id: setup
    op: initial_setup
    params:
      raw_input_folder: ${inputs.raw_input_folder}

  # Per-file chain: the steps share one map_over source, so references between
  # them resolve to the same file's instance.
  - id: read_raw
    op: read_raw_files
    map_over: ${setup.raw_file_paths}
    inputs:
      raw_file_paths:
        - ${_item}          # a single-element list: just this file
    params:
      sonar_model: ${inputs.sonar_model}
      intermediate_format: "none"

  - id: combine_raw
    op: combine_raw_files
    map_over: ${setup.raw_file_paths}
    checkpoint: always
    inputs:
      raw_stores: ${read_raw.raw_stores}

  - id: compute_sv
    op: compute_sv
    map_over: ${setup.raw_file_paths}
    inputs:
      echodata: ${combine_raw.echodata}

  - id: compute_mvbs
    op: compute_mvbs
    map_over: ${setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}

  # Fan-in: concatenate every file's MVBS along ping_time.
  - id: merge_mvbs
    op: merge_datasets
    collect: ${compute_mvbs.ds_MVBS}
    inputs:
      datasets: ${compute_mvbs.ds_MVBS}
    params:
      dim: "ping_time"
