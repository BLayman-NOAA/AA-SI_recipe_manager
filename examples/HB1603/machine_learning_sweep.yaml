# Machine Learning Sub-Recipe — Parameter Sweep (Ensemble) Variant
#
# Stage 8 demonstration of the `sweep` + `collect` (parameter-parallel)
# pattern. Identical to machine_learning.yaml through normalization, but the
# single HDBSCAN run is replaced by a *sweep* over several `min_cluster_size`
# values. Each swept instance is a pure-compute run of `run_hdbscan`, and the
# resulting clustering_results are gathered with `collect` into an ensemble
# that `embed_clustering_results` / `plot_clustering_report` consume as a list
# (both ops already declare `many: true` on `clustering_results`).
#
# Usage: aa-recipe generate machine_learning_sweep.yaml

recipe:
  name: "machine_learning_sweep"
  description: "ML clustering with a min_cluster_size sweep + collect ensemble."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  mvbs_with_lines:
    type: dataset
    description: "MVBS dataset with line overlay variables added."
  echodata:
    type: echodata
    description: "EchoData object used for auxiliary ML features."
  overlay_line_var:
    type: str
    default: "overlay_line"
  sv_clean_unmasked:
    type: dataset
    description: "Pre-sparse-mask Sv used for per-cell stats and echogram backdrop."
  range_bin:
    type: str
    default: "20m"
  ping_time_bin:
    type: str
    default: "20s"

steps:

  - id: compute_cell_stats
    op: compute_per_cell_statistics
    inputs:
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      statistics:
        - cv

  - id: reshape_ml
    op: reshape_for_ml
    inputs:
      ds_MVBS: ${inputs.mvbs_with_lines}
    params:
      data_var: "Sv"
      dataset_name: "ml_dataset"
      feature_strategy: "mean_centered"
      baseline_channel: 0

  - id: add_aux_features
    op: add_auxiliary_features
    inputs:
      ds_ml: ${reshape_ml.ds_ml_ready}
      echodata: ${inputs.echodata}
      ds_sv: ${compute_cell_stats.ds_Sv}
    params:
      dataset_name: "ml_dataset"
      features:
        - cell_cv

  - id: normalize_ml
    op: normalize_ml_data
    checkpoint: always
    inputs:
      ds_ml: ${add_aux_features.ds_ml_ready}
    params:
      method: "flatten"
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      shift_positive: false

  # --- Parameter-parallel fan-out (sweep) ---------------------------------
  # Run HDBSCAN once per min_cluster_size value. Pure compute, so each instance
  # returns a small clustering_results Dataset that is checkpointed under its
  # own content-addressed instance hash.
  - id: hdbscan_sweep
    op: run_hdbscan
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
    sweep:
      min_cluster_size: [500, 1000, 1400, 2000]
      mode: zip
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      ml_result_name: "hdbscan_ensemble"
      min_samples: 30
      sample_size: 1000000
      cluster_selection_method: "eom"
      use_hdbscan: true

  # --- Fan-in (collect) ---------------------------------------------------
  # Gather all swept clustering_results into one list and embed them together.
  - id: embed_ensemble
    op: embed_clustering_results
    collect: ${hdbscan_sweep.clustering_results}
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${hdbscan_sweep.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_ensemble"

  - id: plot_ensemble_report
    op: plot_clustering_report
    collect: ${hdbscan_sweep.clustering_results}
    inputs:
      ds_normalized: ${embed_ensemble.ds_normalized}
      clustering_results: ${hdbscan_sweep.clustering_results}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_ensemble"
      plot_window: [0, 1800, 0, 515]
      overlay_line_var: ${inputs.overlay_line_var}
      cluster_stats_sv_data_var: "Sv"
