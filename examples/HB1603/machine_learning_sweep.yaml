# ML sub-recipe demonstrating sweep and collect. Matches machine_learning.yaml
# through normalization, then sweeps run_hdbscan over min_cluster_size and
# collects the results into an ensemble; embed_clustering_results and
# plot_clustering_report take clustering_results as a list (many: true).
#
# Usage: aa-recipe generate machine_learning_sweep.yaml

recipe:
  name: "machine_learning_sweep"
  description: "ML clustering with a min_cluster_size sweep + collect ensemble."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  mvbs_with_lines:
    type: dataset
    description: "Gridded MVBS with the line overlay variables added, flattened into one ML sample per cell."
  echodata:
    type: echodata
    description: "Raw EchoData supplying the echosounder's own bottom pick for the 'seafloor_depth' and 'altitude' features. Used only when seafloor_depth is not wired."
  overlay_line_var:
    type: str
    default: "overlay_line"
    description: "Name of the line variable drawn over the clustering report plots."
  sv_clean_unmasked:
    type: dataset
    description: "Noise-removed Sv before sparse-bin masking, used for the per-cell statistics and as the backdrop and ping reference for the ML and cluster echograms."
  range_bin:
    type: str
    default: "20m"
    description: "Depth bin height of the MVBS grid, as a length string such as \"2m\". The sparse-bin mask and the cell statistics use the same bin."
  ping_time_bin:
    type: str
    default: "20s"
    description: "Ping-time bin width of the MVBS grid, as a duration string such as \"10s\". The sparse-bin mask and the cell statistics use the same bin."

steps:

  - id: compute_cell_stats
    op: compute_per_cell_statistics
    inputs:
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      statistics:
        - cv

  - id: reshape_ml
    op: reshape_for_ml
    inputs:
      ds_MVBS: ${inputs.mvbs_with_lines}
    params:
      data_var: "Sv"
      dataset_name: "ml_dataset"
      feature_strategy: "mean_centered"
      baseline_channel: 0

  - id: add_aux_features
    op: add_auxiliary_features
    inputs:
      ds_ml: ${reshape_ml.ds_ml_ready}
      echodata: ${inputs.echodata}
      ds_sv: ${compute_cell_stats.ds_Sv}
    params:
      dataset_name: "ml_dataset"
      features:
        - cell_cv

  - id: normalize_ml
    op: normalize_ml_data
    checkpoint: always
    inputs:
      ds_ml: ${add_aux_features.ds_ml_ready}
    params:
      method: "flatten"
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      shift_positive: false

  # Fan-out: one run_hdbscan instance per min_cluster_size value, each
  # checkpointed under its own instance hash.
  - id: hdbscan_sweep
    op: run_hdbscan
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
    sweep:
      min_cluster_size: [500, 1000, 1400, 2000]
      mode: zip
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      ml_result_name: "hdbscan_ensemble"
      min_samples: 30
      sample_size: 1000000
      cluster_selection_method: "eom"
      use_hdbscan: true

  # Fan-in: embed every swept result together.
  - id: embed_ensemble
    op: embed_clustering_results
    collect: ${hdbscan_sweep.clustering_results}
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${hdbscan_sweep.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_ensemble"

  - id: plot_ensemble_report
    op: plot_clustering_report
    collect: ${hdbscan_sweep.clustering_results}
    inputs:
      ds_normalized: ${embed_ensemble.ds_normalized}
      clustering_results: ${hdbscan_sweep.clustering_results}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_ensemble"
      plot_window: [0, 1800, 0, 515]
      overlay_line_var: ${inputs.overlay_line_var}
      cluster_stats_sv_data_var: "Sv"
