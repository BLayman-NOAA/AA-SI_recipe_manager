# HB1603 Full Dive-Profile Analysis - 13 dives, one clustering, per-dive codes
#
# The production run of the investigation. Same structure as
# dive_profiles.yaml, with three deliberate differences:
#
#   1. SWD_20160703-OE20 is excluded. Its dive data is known to be wrong, and a
#      pooled clustering has no way to quarantine one bad dive: every cell it
#      contributes shapes the cluster boundaries that every other dive is then
#      coded against.
#   2. HDBSCAN is sized for the pooled set rather than a three-dive slice.
#   3. The echograms plot on a bin axis, not a time axis. See below - the
#      reason is not the one it looks like.
#
#   survey tier   calibration scanned in place from NCEI, then per-file Sv
#                 merged into the shared store   [included byte-identically]
#   plan          read the dive configs, keep the 13 named below
#   user tier     one chain per dive, fanned in to a combined MVBS
#   ML            reshape -> normalize -> HDBSCAN -> label every point
#   report        per-dive SVCode CSVs and the duration tables
#
#   aa-recipe run full_analysis.yaml --executor dask --dask-workers 6
#
# THE PLOTS MUST USE x_axis_units: bins
#
#   Size is not the problem. The pooled grid is 1285 ping bins by 905 depth
#   bins, about 1.16 M cells, roughly five times the three-dive smoke test and
#   well within what the plotting ops handle.
#
#   The horizontal axis is. The 13 dives carry 214 minutes of data spread
#   across 38 days, and the fan-in concatenates on real ping_time, so any axis
#   built from clock time draws 0.4% data and 99.6% whitespace: each dive
#   becomes a hairline a fraction of a pixel wide. That rules out "datetime"
#   and equally "seconds", which is elapsed time from the first ping and so
#   carries exactly the same 38-day gaps.
#
#   "bins" plots against MVBS bin index instead. The empty time between dives
#   was never binned, so it does not exist on that axis: the 13 dives sit side
#   by side, each about 100 bins wide, still in proportion to its own duration.
#   The only thing given up is a clock-time axis across the set, which was
#   unreadable anyway. "pings" behaves the same way and labels differently.
#
#   For one dive on a real time axis, window a plot with time_min / time_max.
#   embed_results is checkpointed, so an extra figure costs only the figure.
#
#   Cluster ids are also interpretable without any figure: generate_sv_codes
#   writes each cell's 18 and 38 kHz Sv next to its code, so the per-cluster
#   statistics are a group-by on the CSVs.
#
# SIZING HDBSCAN FOR THE POOLED SET
#
#   sample_size 1200000 is a ceiling that is not expected to bind. The pooled
#   grid holds 1.16 M cells before masking, so HDBSCAN fits every point and
#   assign_clusters_to_all_points has nothing left to predict.
#
#   min_cluster_size_fraction is a fraction of the points actually fitted,
#   after any sample_size cap, so the number means the same thing whether or
#   not the ceiling binds: a cluster must hold this share of what the model
#   saw. Raising sample_size raises the absolute floor with it.
#
#   Against the smoke test 0.02 of a much smaller set, 0.01 is a deliberate
#   loosening: a cluster must now be about twice as large in absolute terms to
#   survive, which is what stops one dive local structure from being promoted
#   to a survey-wide code.
#
# SURVEY SCOPE AND COST
#
#   The catalogue query is NOT narrowed here. It is left at
#   calibration_from_ncei.yaml defaults, which is the whole cruise: 3322 files,
#   roughly 175 GB of raw. Counted against the archive, not estimated.
#
#   That is the expensive half of this run by a wide margin, and only 28 of
#   those files contain a dive. It is left whole for two reasons. The Sv is the
#   reusable artifact - a narrowed query produces Sv no other analysis can
#   find, because a query param is part of every hash beneath it - and leaving
#   it alone is what makes every survey step here identical to
#   survey_preprocess.yaml and dive_profiles.yaml, so the three share one cache.
#
#   If the full cruise is more than this run needs, do not narrow the query in
#   this file. Follow the slicing note in survey_preprocess.yaml: narrow
#   file_time_start / file_time_end there, run the per-file work a week at a
#   time, then one full-window run to assemble the merge. Per-file checkpoints
#   are content-addressed on the file URL, so they are found either way.
#
#   For reference, the five days carrying these 13 dives hold 355 files:
#   07-07 (67), 07-19 (65), 07-25 (81), 08-02 (79), 08-14 (63).
#
# CLUSTER IDS ARE RUN SCOPED
#
#   HDBSCAN ids are not stable across runs, so an SVCode integer here does not
#   carry the fixed meaning codes 1, 2 and 3 had in the previous analysis
#   (gas-bearing, indeterminate, non gas-bearing). Read the tables against the
#   per-code Sv statistics, not against the old numbering.
#
# Sanity-check the shape before a long run:
#   aa-recipe dry-run full_analysis.yaml --visualize

recipe:
  name: "hb1603_full_analysis"
  description: "Pooled HDBSCAN clustering of 13 HB1603 sperm whale dives, with per-dive SVCodes."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  cal_input_folder:
    type: path
    default: "../calibration_files/HB201607_cal"
    description: "Manufacturer .cal files."
  calibration_output_dir:
    type: path
    default: "./outputs/calibration"
  mvbs_range_var_max:
    type: str
    default: "1810m"
    description: >
      Depth the per-window MVBS grid is built out to, as the unit string
      echopype parses. It is pinned rather than measured so every window shares
      one depth axis and the fan-in has nothing to pad.

      It must clear the deepest depth the survey tier can produce, which is not
      crop_max_range_m: the crop is applied to echo_range, range from the
      transducer, while depth adds the transducer's own depth below the surface
      on top of it. HB1603's transducer sits about 8.9 m down, so a 1800 m
      echo_range ceiling reaches roughly 1809 m of depth and 1810 m is the next
      2 m bin edge above it. Raise both together, and keep the margin if you
      move the crop: a ceiling below the data silently drops the deepest bins.
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Must match survey_preprocess.yaml exactly, or the merged store is rebuilt."
  survey_chunk_ping_time:
    type: int
    default: 1000
    description: "Must match survey_preprocess.yaml exactly."
  json_dir:
    type: path
    default: "./Auxiliary/JSON_Files"
    description: "Folder of SWD_*.json dive configs."
  evl_root:
    type: path
    default: "./Auxiliary"
    description: "Searched recursively for the .evl files the configs name."
  pad_minutes:
    type: float
    default: 0.0
    description: "Minutes added either side of each dive's line span."
  dive_labels:
    type: list
    default:
      - "SWD_20160707-OE20"
      - "SWD_20160707-OE29"
      - "SWD_20160707-OE32"
      - "SWD_20160719-OE07"
      - "SWD_20160725-OE50"
      - "SWD_20160725-OE54"
      - "SWD_20160725-OE61"
      - "SWD_20160725-OE62"
      - "SWD_20160725-OE64"
      - "SWD_20160802-OE16"
      - "SWD_20160814-OE03"
      - "SWD_20160814-OE09"
      - "SWD_20160814-OE44"
    description: >
      The 13 dives in the analysis: every localized dive HB1603 recorded except
      SWD_20160703-OE20, whose dive data is incorrect.

      Spelled as the set that is included rather than the one excluded, which
      is what plan_dive_datasets accepts and is also the more useful record. It
      states the analysis population outright, and plan_dive_datasets raises if
      a label names a dive no config provides, so a renamed or missing config
      stops the run instead of quietly shrinking the study.

      SWD_20160707-OE20-OE29-OE32 is absent because it is not a fourteenth
      dive. It is a combined view of three July 7 dives that each have their
      own config, and it carries no 99% confidence lines, so it cannot drive
      the coding step. plan_dive_datasets skips it by default.
  sample_size:
    type: int
    default: 1200000
    description: >
      Cap on the points HDBSCAN is fitted on. Set above the expected valid-cell
      count so it does not bind. Read the note on min_cluster_size_fraction in
      the header before lowering it.
  min_cluster_size_fraction:
    type: float
    default: 0.01
    description: >
      Minimum cluster size as a fraction of the points HDBSCAN is fitted on.
      Half the smoke test 0.02 against a pooled set several times larger, so
      the absolute floor roughly doubles.
  min_samples:
    type: int
    default: 4
  code_output_dir:
    type: path
    default: "./outputs/sv_codes"
    description: "Where the per-dive CSVs and the duration tables are written."
  depth_interval_m:
    type: float
    default: 200.0
    description: "Depth bin of the duration table. 200 m matches the report."

steps:

  # --- Survey tier: included byte-identically with survey_preprocess.yaml --
  #
  # No input_overrides on the query window on purpose. Overriding it, even to
  # the value it already has, would change these hashes: a step fingerprint
  # folds in the pipeline inputs it references, so wiring a literal to an input
  # is not cache-neutral. Leaving it alone is what keeps this tier shared with
  # survey_preprocess.yaml and dive_profiles.yaml.

  - include: sub_recipes/calibration_from_ncei.yaml
    input_overrides:
      cal_input_folder: ${inputs.cal_input_folder}
      calibration_output_dir: ${inputs.calibration_output_dir}

  - include: sub_recipes/survey_sv.yaml
    input_overrides:
      calibration_dict: ${build_cal_mapping.calibration_dict}
      mapping_dict: ${build_cal_mapping.mapping_dict}
      crop_max_range_m: ${inputs.crop_max_range_m}
      survey_chunk_ping_time: ${inputs.survey_chunk_ping_time}

  # --- Plan the dives ------------------------------------------------------

  # Below the survey checkpoint, so naming the dives costs nothing in the tier
  # above: include_labels changes this step hash and the per-dive chains
  # beneath it, and no survey step at all.
  - id: plan_dives
    op: custom
    checkpoint: always
    params:
      json_dir: ${inputs.json_dir}
      evl_root: ${inputs.evl_root}
      pad_minutes: ${inputs.pad_minutes}
      include_labels: ${inputs.dive_labels}
    custom_spec:
      description: Turn the NEFSC dive configs into recipe windows.
      callable_path: aa_si_utils.dive_profiles.plan_dive_datasets
      cache_key: dive_profiles_plan_dive_datasets
      version: "1"
      params:
        json_dir: {type: path}
        evl_root: {type: path}
        pad_minutes: {type: float}
        include_labels: {type: list}
      outputs:
        windows: {type: list}
        raw_files: {type: list}
      output_map:
        windows: "['windows']"
        raw_files: "['raw_files']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git

  # --- User tier: one chain per dive, fanned in ---------------------------

  - include: sub_recipes/dive_windows.yaml
    input_overrides:
      survey_sv: ${rechunk_survey_sv.ds_Sv}
      windows: ${plan_dives.windows}
      # One pinned depth axis for every window, so the fan-in has nothing to
      # pad. Spelled as a unit string because echopype parses it, and kept
      # above crop_max_range_m by hand: the crop is on echo_range and depth
      # adds the transducer's own depth on top of it.
      range_var_max: ${inputs.mvbs_range_var_max}

  # --- Machine learning over the pooled cells -----------------------------


  # The pre-MVBS Sv, fanned in, purely so the MVBS plot below has a ping-index
  # reference frame. checkpoint: never because nothing else reads it and the
  # plot only touches its ping_time and depth coordinates, not its Sv values.
  #
  # It reads the fan-in rather than mapping over the windows because remove_noise
  # is mapped: a plain step reading it gets the whole fanned-out list. Mapping
  # this over the same windows does not help either, since dive_windows.yaml
  # ends with its own collect steps and a step declared here lands after them,
  # in a different chain, which the parser rejects.
  - id: merge_window_sv
    op: merge_datasets
    collect: ${remove_noise.ds_Sv}
    checkpoint: never
    inputs:
      datasets: ${remove_noise.ds_Sv}
    params:
      dim: "ping_time"

  # ds_Sv_source is required, not decorative: plot_sv_echogram raises on an
  # MVBS dataset without it, because ping_min and ping_max index the original
  # Sv ping axis and it is what converts them onto the MVBS grid.
  - id: plot_window_mvbs
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${merge_dive_mvbs.merged}
      ds_Sv_source: ${merge_window_sv.merged}
    params:
      min_depth: 0
      # Bin index, not elapsed seconds. See the header: on a clock-time axis
      # the 38 days between the first and last dive squeeze all 13 into a
      # hairline.
      x_axis_units: "bins"
      y_axis_units: "meters"
      overlay_lines:
        - var: "dive_fit"
          style:
            color: "red"
            linewidth: 3.5
        - var: "dive_u99"
          style:
            color: "red"
            linewidth: 1.0
            linestyle: "--"
        - var: "dive_l99"
          style:
            color: "red"
            linewidth: 1.0
            linestyle: "--"


  - id: reshape_ml
    op: reshape_for_ml
    inputs:
      ds_MVBS: ${merge_dive_mvbs.merged}
    params:
      data_var: "Sv"
      dataset_name: "ml_dataset"
      feature_strategy: "mean_centered"
      baseline_channel: 0

  - id: add_aux_features
    op: add_auxiliary_features
    inputs:
      ds_ml: ${reshape_ml.ds_ml_ready}
      ds_sv: ${merge_dive_cell_stats.merged}
    params:
      dataset_name: "ml_dataset"
      features:
        - cell_cv

  - id: normalize_ml
    op: normalize_ml_data
    checkpoint: always
    inputs:
      ds_ml: ${add_aux_features.ds_ml_ready}
    params:
      method: "flatten"
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      shift_positive: false

  - id: run_hdbscan
    op: run_hdbscan
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      ml_result_name: "hdbscan_results"
      min_cluster_size_fraction: ${inputs.min_cluster_size_fraction}
      min_samples: ${inputs.min_samples}
      sample_size: ${inputs.sample_size}
      cluster_selection_method: "leaf"
      use_hdbscan: true

  # Kept even though sample_size is not expected to bind: it is the guard that
  # makes that expectation safe. If the valid count does exceed the ceiling,
  # every cell past it would otherwise stay unlabelled and come back NaN once
  # the result is regridded, which on a pooled survey is most of the data.
  #
  # checkpoint: never because it needs the fitted model, which only the
  # run_hdbscan above it holds: a checkpointed clustering result drops the
  # model, and the model itself would checkpoint as pickle.
  - id: label_all_points
    op: assign_clusters_to_all_points
    checkpoint: never
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
      clustering_model: ${run_hdbscan.clustering_model}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"

  - id: embed_results
    op: embed_clustering_results
    checkpoint: always
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${label_all_points.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"

  - id: plot_clustering_report
    op: plot_clustering_report
    regenerate: if-missing
    inputs:
      ds_normalized: ${embed_results.ds_normalized}
      clustering_results: ${label_all_points.clustering_results}
      clustering_model: ${label_all_points.clustering_model}
      ds_Sv: ${merge_dive_mvbs.merged}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      # Same reason as plot_window_mvbs, and it matters more here: this op
      # defaults to "datetime", which would draw the whole 38-day span.
      x_axis_units: "bins"
      overlay_line_var: "dive_fit"
      cluster_stats_sv_data_var: "Sv"

  # --- SVCodes and the report tables --------------------------------------

  # Per-cell CSVs in the reference layout, plus the per-ping summary the
  # duration table is built from. A ping contributes its whole 10 s bin to the
  # code that dominates the cells between its 99% confidence bounds, which is
  # what makes the per-code minutes add up to the dive length.
  #
  # With no clustering report rendered, these CSVs are also where the codes are
  # interpreted from: each row carries its cell 18 and 38 kHz Sv next to its
  # code, so grouping by code gives the per-cluster statistics that say what
  # each id actually is.
  - id: generate_sv_codes
    op: custom
    checkpoint: always
    inputs:
      ds: ${embed_results.ds_normalized}
    params:
      windows: ${plan_dives.windows}
      output_dir: ${inputs.code_output_dir}
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      range_var: "depth"
      ping_time_bin_s: 10.0
    custom_spec:
      description: Write per-dive SVCode CSVs from the embedded clustering.
      callable_path: aa_si_utils.dive_profiles.generate_sv_codes
      cache_key: dive_profiles_generate_sv_codes
      version: "1"
      inputs:
        ds: {type: Dataset}
      params:
        windows: {type: list}
        output_dir:
          type: path
          constraints:
            must_exist: false
        dataset_name: {type: str}
        ml_result_name: {type: str}
        range_var: {type: str}
        ping_time_bin_s: {type: float}
      outputs:
        code_csv_paths: {type: list}
        summary_csv_path: {type: path}
        dive_labels: {type: list}
      output_map:
        code_csv_paths: "['code_csv_paths']"
        summary_csv_path: "['summary_csv_path']"
        dive_labels: "['dive_labels']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git

  # "Percent of total dive duration the whale spent at 200 m depth intervals
  # per code." Depth comes from the fitted dive profile, not from the cells:
  # the question is how long the whale spent at a depth, and the code says what
  # was around it there.
  - id: sv_code_depth_table
    op: custom
    checkpoint: always
    params:
      summary_csv_path: ${generate_sv_codes.summary_csv_path}
      output_dir: ${inputs.code_output_dir}
      depth_interval_m: ${inputs.depth_interval_m}
    custom_spec:
      description: Percent of dive duration per depth interval per code.
      callable_path: aa_si_utils.dive_profiles.sv_code_depth_table
      cache_key: dive_profiles_sv_code_depth_table
      version: "1"
      params:
        summary_csv_path: {type: path}
        output_dir:
          type: path
          constraints:
            must_exist: false
        depth_interval_m: {type: float}
      outputs:
        per_dive_csv_path: {type: path}
        combined_csv_path: {type: path}
        totals_csv_path: {type: path}
      output_map:
        per_dive_csv_path: "['per_dive_csv_path']"
        combined_csv_path: "['combined_csv_path']"
        totals_csv_path: "['totals_csv_path']"
      dependency:
        name: aa-si-utils
        version: ">=0.1.0"
        source: git
        url: https://github.com/BLayman-NOAA/AA-SI_Utils.git
