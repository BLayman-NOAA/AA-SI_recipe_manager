# HB1603 Survey Sv - streamed from NCEI, one merged checkpoint
#
# The shared artifact this whole workflow is built on: per-file Sv with depth
# added, merged and chunked, checkpointed once for the cruise. Everything a
# user recipe varies - masking, noise removal, binning, windows - sits BELOW
# this line, so a new analysis reuses the Sv instead of recomputing it.
#
#   [per file] read_raw -> combine_raw -> extract_cal_params
#              -> compute_sv -> ep_add_depth -> crop_range (fixed ceiling)
#   [fan-in]   merge_survey_sv (concat along ping_time)
#   [survey]   rechunk_survey_sv -> the shared, chunked Sv store
#
# Must be included immediately after calibration_from_ncei.yaml: it maps over
# that file's query_ncei.raw_urls and consumes its build_cal_mapping outputs.
#
# WHY THERE IS NO DOWNLOAD STEP
#
#   read_raw_files already takes a remote fsspec URL, stages one file at a
#   time to local scratch, converts it, and deletes the local copy before
#   fetching the next. Local disk therefore holds at most one raw file per
#   concurrent instance whatever the size of the cruise, which is the whole
#   point of streaming, and a separate download step would only add a second
#   copy to manage. A recipe that needs the companion .bot or .idx alongside
#   would have to fetch them itself; this analysis takes its seabed from
#   Echoview line files, so include_bot is false.
#
# WHY THE CROP IS PER FILE AND USES A FIXED CEILING
#
#   Concatenating along ping_time needs every segment to share a range_sample
#   length. merge_datasets resolves a mismatch by outer-joining to the longest
#   and NaN-padding the rest, which puts NaN into echo_range, where every
#   downstream range binning reads it. A fixed crop_max_range_m puts every file
#   on the same length. The data-driven crop modes cannot be used here: they
#   would each pick a different depth per file, which is exactly the mismatch
#   being avoided.
#
#   This assumes a uniform sample interval across the cruise. If the merge
#   produces NaN in echo_range, that assumption is what broke, and the fix is
#   to crop by range_sample count rather than by metres.
#
# CHOOSING crop_max_range_m
#
#   Size it to the deepest data any planned analysis needs, not to the seabed:
#   the HB1603 seabed reaches roughly 3000 m in places, while the sperm whale
#   dives bottom out near 1350 m, so the 1800 m default keeps the dive analysis
#   whole and does not pay to store two kilometres of water nothing reads.
#
#   Moving it later is not as expensive as it looks. The crop sits below
#   compute_sv, so raising the ceiling invalidates crop_survey_range,
#   merge_survey_sv and rechunk_survey_sv, and nothing above them: measured on
#   these two recipes, 3 of the 13 survey steps. Sv itself is not recomputed
#   from raw. It still means re-reading every per-file Sv checkpoint and
#   rebuilding the merged store, which is survey-wide I/O, so it is a decision
#   worth making once rather than a trap.
#
# WHAT IS DELIBERATELY NOT HERE
#
#   No masking, no noise removal, no MVBS. Each is something an analysis would
#   reasonably want to vary, and each below this line is cheap while above it
#   is a cruise-wide recompute. remove_background_noise in particular estimates
#   over a ping window, so it must see contiguous pings and belongs with the
#   per-window chain rather than astride the survey's file boundaries.

recipe:
  name: "hb1603_survey_sv"
  description: "Per-file Sv and depth streamed from NCEI, fanned in to the shared HB1603 Sv store."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  calibration_dict:
    type: dict
    description: "Standardized calibration data, from build_cal_mapping."
  mapping_dict:
    type: dict
    description: "Raw channel to calibration key mapping, from build_cal_mapping."
  sonar_model:
    type: str
    default: "EK60"
    description: "Sonar model string for echopype."
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Fixed range ceiling applied per file. See the note above before changing."
  survey_chunk_ping_time:
    type: int
    default: 1000
    description: >
      Ping-time chunk of the shared store. Size it near one analysis window so
      a windowed read touches few chunks: the dive windows here run about 17
      minutes, and at roughly one ping per second that is order 1000 pings.

steps:

  # --- Per-file chain, mapped over the catalogue's raw URLs ---------------

  # checkpoint: never because the output is an exe_temp store path that the
  # run deletes; the Sv below is what is worth caching. Mapping over plain URL
  # strings keeps each instance content-addressed by its own file, so an
  # interrupted survey resumes from what it already converted.
  #
  # intermediate_format IS THE RUN'S LARGEST CONSUMER OF LOCAL DISK
  #
  #   temp_dir/data is cleared once, when the run ends, not as instances
  #   finish. So "zarr" and "netcdf" both leave one store per CATALOGUE FILE on
  #   disk simultaneously - per file, not per worker, so changing the worker
  #   count does not change the total. Measured on the three-dive smoke test:
  #   335 files in the slice, 36+ GB in exe_temp.
  #
  #   "zarr" is what lets those stores live on a bucket instead, by pointing
  #   temp_dir at a gs:// URL. "none" writes nothing at all and holds each
  #   file's EchoData in memory, which does scale with worker count and has
  #   read_raw_files' use_swap="auto" as its backstop.
  #
  #   It is a literal rather than an input on purpose: a step's fingerprint
  #   folds in the pipeline inputs it references, so merely wiring this to an
  #   input changes read_raw's hash and re-runs the whole survey tier even when
  #   the value is unchanged. Editing the literal costs the same recompute, but
  #   only when you actually change it.
  - id: read_raw
    op: read_raw_files
    map_over: ${query_ncei.raw_urls}
    checkpoint: never
    # Delete each file's intermediate store as soon as its instance finishes,
    # instead of letting temp_dir/data grow to one store per catalogue file.
    # Safe because crop_survey_range below is checkpointed: the client reloads
    # a checkpointed member from the cache when it folds the chain in, so
    # nothing that outlives the instance is still rooted in the deleted store.
    dispose_outputs: [raw_stores]
    execution:
      dask_config:
        scheduler: processes
    inputs:
      raw_file_paths:
        - ${_item}
    params:
      sonar_model: ${inputs.sonar_model}
      include_bot: false
      intermediate_format: "zarr"

  - id: combine_raw
    op: combine_raw_files
    map_over: ${query_ncei.raw_urls}
    inputs:
      raw_stores: ${read_raw.raw_stores}

  # Path(url).name gives the bare filename, which is the key the calibration
  # mapping is built under, so a URL resolves the same as a local path would.
  #
  # unmapped_channels is left at its "warn" default, so a channel no
  # calibration file matched falls back to the values the raw file records for
  # it and says so on the terminal. HB1603 needs this: leg 1 transmitted 18 and
  # 38 kHz at 2000 W and the 18 July calibration was measured at 1000 W, which
  # transmit_power matching rejects. Set it to "error" for a survey where an
  # unmatched channel should stop the run.
  - id: extract_cal_params
    op: extract_standardized_cal_params
    map_over: ${query_ncei.raw_urls}
    inputs:
      calibration_dict: ${inputs.calibration_dict}
      mapping_dict: ${inputs.mapping_dict}
      echodata: ${combine_raw.echodata}
    params:
      raw_file_path: ${_item}

  - id: compute_sv
    op: compute_sv
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}

  # The vertical reference, computed explicitly rather than left to
  # echopype's use_platform_vertical_offsets. On an EK60 file that setting is
  # wrong by twice the transducer draft: the ER60 leaves transducer_offset_z
  # at zero and echopype maps the per-ping transducer depth into water_level,
  # which the formula subtracts, so the transducer lands 8.92 m ABOVE the sea
  # surface instead of below it. Measured on HB1603: depth came out
  # echo_range - 8.92 where it should be echo_range + 8.92.
  #
  # Everything vertical in this workflow depends on getting this right. The
  # dive profiles, their 99% CI bounds and the seabed lines are all Echoview
  # EVL files referenced to the sea surface, and the report bins by depth.
  #
  # The heave sign is inherited from HB2407, where it was verified against a
  # hand-drawn EVL seabed line. It cannot be verified the same way here: the
  # HB1603 seabed sits near 2990 m, well below crop_max_range_m, so it is not
  # in this data at all. The term is worth at most +/- 0.45 m against a 2 m
  # depth bin, so it is carried rather than tuned, but it is not confirmed.
  - id: compute_transducer_depth
    op: compute_transducer_depth
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${combine_raw.echodata}
    params:
      use_heave: true
      heave_sign: 1.0

  # Surface-referenced depth, added here because it needs this file's
  # EchoData, which the fan-in below is the last point that still has.
  - id: ep_add_depth
    op: ep_add_depth
    map_over: ${query_ncei.raw_urls}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${combine_raw.echodata}
    params:
      depth_offset: ${compute_transducer_depth.transducer_depth}

  # checkpoint: always because this is the chain's surviving output and
  # read_raw's stores are disposable. The client reloads a checkpointed member
  # from the cache when it folds the chain in (_member_outputs), so the fan-in
  # below reads durable artifacts; left uncheckpointed it would carry a dask
  # graph still rooted in the exe_temp store that disposal has just deleted.
  # This is what lets exe_temp hold one store per concurrent worker instead of
  # one per file in the survey.
  - id: crop_survey_range
    op: crop_range
    map_over: ${query_ncei.raw_urls}
    checkpoint: always
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
    params:
      max_range_m: ${inputs.crop_max_range_m}
      drop_trailing_all_nan: false
      outlier_sigma: null

  # --- Fan-in: the shared survey Sv --------------------------------------

  - id: merge_survey_sv
    op: merge_datasets
    collect: ${crop_survey_range.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${crop_survey_range.ds_Sv}
    params:
      dim: "ping_time"

  - id: rechunk_survey_sv
    op: rechunk_dataset
    checkpoint: always
    inputs:
      ds_Sv: ${merge_survey_sv.merged}
    params:
      ping_time_chunk: ${inputs.survey_chunk_ping_time}
