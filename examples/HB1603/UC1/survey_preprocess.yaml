# HB1603 Survey Preprocess - build the shared Sv store, and nothing else
#
# The expensive pass, run once for the cruise. It exists as its own entrypoint
# so the survey can be built, interrupted and resumed without an analysis
# recipe attached, and so the artifact can be written to the shared survey
# cache tier by someone curating it rather than by every analyst.
#
# It is exactly the two sub-recipes dive_profiles.yaml includes, with the same
# inputs. That is the point: run this, then run the analysis, and every step
# here is a cache hit there.
#
# Run it:
#   aa-recipe run survey_preprocess.yaml --executor dask --dask-workers 6
#
# Curate it into the shared tier (reads and writes the survey tier only):
#   aa-recipe run survey_preprocess.yaml --cache-write-tier survey \
#       --survey-cache-dir gs://.../survey_cache
#
# SCALE
#
#   HB1603 is 3322 files and roughly 175 GB of raw. A DAG with that many
#   mapped instances is untested, so prefer running it in slices - a month, a
#   week, a day - by narrowing file_time_start / file_time_end. Instance hashes
#   are content-addressed on each file's URL, so a sliced run and a whole-cruise
#   run produce the same per-file checkpoints and the analysis recipe finds
#   them either way.
#
#   The one thing a slice does NOT share is the fan-in: merge_survey_sv and
#   rechunk_survey_sv hash over the whole collected set, so the merged store is
#   only complete once a run covers the whole window. Slice the per-file work,
#   then do one final full-window run to assemble it, which will hit every
#   per-file checkpoint and only pay for the merge.

recipe:
  name: "hb1603_survey_preprocess"
  description: "Build the shared HB1603 Sv store from NCEI, calibration included."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  cal_input_folder:
    type: path
    default: "../calibration_files/HB201607_cal"
    description: "Manufacturer .cal files. The one input NCEI cannot supply."
  calibration_output_dir:
    type: path
    default: "./outputs/calibration"
    description: "Root for the calibration artifacts."
  crop_max_range_m:
    type: float
    default: 1800.0
    description: "Fixed range ceiling. Must match dive_profiles.yaml exactly."
  survey_chunk_ping_time:
    type: int
    default: 1000
    description: "Ping-time chunk of the shared store. Must match dive_profiles.yaml."

steps:

  - include: sub_recipes/calibration_from_ncei.yaml
    input_overrides:
      cal_input_folder: ${inputs.cal_input_folder}
      calibration_output_dir: ${inputs.calibration_output_dir}

  - include: sub_recipes/survey_sv.yaml
    input_overrides:
      calibration_dict: ${build_cal_mapping.calibration_dict}
      mapping_dict: ${build_cal_mapping.mapping_dict}
      crop_max_range_m: ${inputs.crop_max_range_m}
      survey_chunk_ping_time: ${inputs.survey_chunk_ping_time}
