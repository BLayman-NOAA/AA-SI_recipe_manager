# Bring-your-own-folder example: no NCEI query or download; processing reads
# the .raw files already in raw_input_folder.
#
# Does not load as is: processing_lvls_1_to_3.yaml and visualization.yaml are
# not in this folder.
#
# Example: --input file_time_start=2016-07-25T20:58 --input file_time_end=2016-07-25T21:45
# Usage: aa-recipe generate byo_folder_example.yaml

recipe:
  name: "byo_folder_example"
  description: >
    Processes a folder of .raw files already on disk, with no NCEI
    download.
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    default: "./raw_file_inputs/HB1603_local"
    description: "Folder of raw .raw files, a local path or a gs:// URL."
    # auto hashes the folder's contents (names and sizes locally), not its
    # path, so the same files in a moved folder still hit the cache.
    fingerprint_mode: auto
  cal_input_folder:
    type: path
    default: "./calibration_files/HB201607_cal"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  line_file_path:
    type: path
    default: "./line_files/SpermWhaleClicks_click_data_HB1603_SpermWhaleDive_Span0.2_07252016_2120_UTC.csv"
    description: "Line file drawn over the MVBS grid and echograms, such as a sperm whale click track (.csv) or an Echoview .evl line. A local path or a gs:// URL."
  raw_file_names:
    type: list
    default: []
    description: "Optional list of file names within raw_input_folder to process. An empty list uses every .raw file in the folder."
  file_time_start:
    type: str
    required: false
    description: "Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time in each raw file name; files at or after it are processed and scanned for calibration. Unset takes every file."
  file_time_end:
    type: str
    required: false
    description: "Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time in each raw file name; files at or before it are processed and scanned for calibration. Unset takes every file."

steps:

  # No download step: levels 1 to 3 read raw_input_folder directly.
  - include: processing_lvls_1_to_3.yaml
    input_overrides:
      cruise_id: "HB1603"
      record_author: "<Your Name>"
      sonar_model: "EK60"

  - id: add_line_overlay
    op: add_line_overlay
    inputs:
      ds: ${compute_mvbs.ds_MVBS}
    params:
      line_file_path: ${inputs.line_file_path}
      line_name: "sw_dive_profile"

  - include: visualization.yaml
    input_overrides:
      sv_clean: ${mask_sparse.ds_Sv}
      mvbs_with_lines: ${add_line_overlay.ds}
      overlay_line_var: "sw_dive_profile_fit"

  # machine_learning computes its own per-cell statistics from
  # sv_clean_unmasked.
  - include: machine_learning.yaml
    input_overrides:
      mvbs_with_lines: ${add_line_overlay.ds}
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      echodata: ${combine_raw.echodata}
      overlay_line_var: "sw_dive_profile"
