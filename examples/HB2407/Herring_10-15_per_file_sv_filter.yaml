# HB2407 Herring 10-15, Sv filter: per raw file pipeline with two-pass clustering
#
# Herring_10-15_per_file.yaml with level 4 swapped for
# processing_lvl_4_sv_filter.yaml, which re-clusters the high-Sv part of the
# pass-1 noise in a second HDBSCAN pass.
#
#   level 1    per file: read -> materialize -> select this file's calibration
#   level 2    per file: Sv -> transducer depth -> depth -> EVL seafloor
#              -> masks -> apply
#              fan-in: merge_sv concatenates the per-file masked Sv on ping_time
#              survey:  crop -> rechunk -> remove background noise
#   level 3    survey: sparse masking, MVBS, per-cell statistics
#   level 4    survey: ML reshape, two-pass clustering, reporting
#
# Run sequentially:
#   aa-recipe run Herring_10-15_per_file_sv_filter.yaml
# Run the per-file instances on worker processes:
#   aa-recipe run Herring_10-15_per_file_sv_filter.yaml --executor dask
#
# Usage: aa-recipe dry-run Herring_10-15_per_file_sv_filter.yaml --visualize

recipe:
  name: "herring_10_15_per_file"
  description: "HB2407 Herring 10-15 per-raw-file pipeline with Sv-filtered two-pass HDBSCAN clustering."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    fingerprint_mode: auto
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    default: "./HB2407_calibration_files"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  seabed_line_folder:
    type: path
    default: "gs://ggn-nmfs-aa-prod-1-data/HDD/Henry_B_Bigelow/HB2407/Auxiliary/EV_seabedlines"
    description: "Folder of Echoview .evl seabed line exports, a local path or a gs:// URL. The files covering the time window are combined into the seafloor; a single .evl file is read whole."

  # Data time range. Also sets the fan-out width: one mapped instance per
  # selected raw file.
  file_time_start:
    type: str
    # default: "2024-10-15T13:38:52"
    default: "2024-10-15T21:38:52"
    description: "Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time in each raw file name; files at or after it are processed and scanned for calibration. Unset takes every file. It also selects the seabed line files to read."
  file_time_end:
    type: str
    default: "2024-10-15T23:43:36"
    description: "Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time in each raw file name; files at or before it are processed and scanned for calibration. Unset takes every file. It also selects the seabed line files to read."

  # Default display window shared by every plotting step; a step or sub-recipe
  # can override it with its own values.
  min_depth:
    type: float
    default: 0
    description: "Shallowest depth shown on the echograms, in metres."
  max_depth:
    type: float
    description: "Deepest depth shown on the echograms, in metres. Unset uses the deepest depth in the data."
    # default: 50
  ping_min:
    type: int
    default: 0
    description: "First ping index shown on the echograms."
  # Restore the commented default to window the echograms.
  ping_max:
    type: int
    description: "Last ping index shown on the echograms. Unset shows through the last ping."
    # default: 500
  x_axis_units:
    type: str
    default: "seconds"
    description: "Echogram x axis: \"datetime\" (UTC clock time), \"seconds\" from the first ping shown, \"pings\", \"meters\" travelled, or \"bins\" (MVBS only)."
  y_axis_units:
    type: str
    default: "meters"
    description: "Echogram y axis: \"meters\", \"range_sample\", or \"bins\" (MVBS only)."


steps:

  - include: sub_recipes/processing_lvl_1_per_file.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      cruise_id: "HB2407"
      record_author: "<Your Name>"
      sonar_model: "EK80"

  # Must follow level 1 (per file) directly: its steps continue the same mapped
  # chain, and its merge_sv fan-in reassembles the survey.
  - include: sub_recipes/processing_lvl_2_per_file.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      # Transducer depth is each raw file's drop keel offset (e.g. 7.5 m) plus
      # datum_correction_m and heave.
      datum_correction_m: -1.0
      use_heave: true
      heave_sign: 1.0
      # surface mask
      surface_depth_m: 5.0
      seafloor_buffer_m: 1
      # Range crop by outlier rejection: one 200 kHz ping (2024-10-16T00:34:34)
      # has finite samples to 507 m and defeats the trailing NaN trim. 1.5 x
      # (mean + 3 sd) puts the threshold at 424 m against a deepest kept ping of
      # 214 m, so only that ping is flagged. Add crop_max_range_m for a hard
      # ceiling.
      crop_outlier_sigma: 3.0
      crop_outlier_margin: 1.5
      # parameters for echopype's remove_background_noise
      noise_ping_num: 5
      noise_range_sample_num: 10
      seabed_line_folder: ${inputs.seabed_line_folder}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}

  - id: plot_sv_clean
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${remove_noise.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      ping_min: ${inputs.ping_min}
      ping_max: ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 100

  - include: sub_recipes/processing_lvl_3.yaml
    input_overrides:
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      # MVBS bin size:
      range_bin: "2m"
      ping_time_bin: "2s"
      nan_threshold: 0.95 # mask bin if NAN's exceed this fraction of data in the cell

  - id: plot_mvbs
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${compute_mvbs.ds_MVBS}
      ds_Sv_source: ${mask_sparse.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      ping_min: ${inputs.ping_min}
      ping_max: ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50

  # Neither echodata nor seafloor_depth is wired: this pipeline builds no
  # survey-wide EchoData, and features: [cell_cv] needs neither. To use the
  # 'seafloor_depth' or 'altitude' features, add this to
  # processing_lvl_2_per_file.yaml after merge_sv and wire
  # seafloor_depth: ${merge_seafloor.merged} below:
  #
  #   - id: merge_seafloor
  #     op: merge_datasets
  #     collect: ${detect_seafloor.seafloor_depth}
  #     checkpoint: always
  #     depends_on: [merge_sv]
  #     inputs:
  #       datasets: ${detect_seafloor.seafloor_depth}
  #     params:
  #       dim: "ping_time"
  #
  # depends_on is required: without it the sort places merge_seafloor inside
  # the mapped chain and splits it. On an already-populated cache its first run
  # fails, since merge_sv is a hit and the chain is pruned; seed it once with
  # --force. Referencing ${detect_seafloor.seafloor_depth} directly here breaks
  # on resume for the same reason.
  - include: sub_recipes/processing_lvl_4_sv_filter.yaml
    input_overrides:
      mvbs: ${compute_mvbs.ds_MVBS}
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      cell_stats_sv: ${compute_cell_stats.ds_Sv}
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      ping_min: ${inputs.ping_min}
      ping_max: ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      hdbscan_min_cluster_size_fraction: .005
      hdbscan_min_samples: 4
      hdbscan_cluster_selection_method: "eom"
      hdbscan_sample_size: 10000000

