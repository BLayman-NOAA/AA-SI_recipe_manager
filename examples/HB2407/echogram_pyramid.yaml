# HB2407 masked Sv into an echogram viewer pyramid, segment-parallel
#
# echogram_masked.yaml continued into the viewer store. Everything through
# apply_mask is that recipe unchanged, so it hashes identically and comes back
# as cache hits; this adds three steps that build a level-of-detail pyramid in
# parallel.
#
#   plan_segments   -> ping ranges cut on the reduction's own cell boundaries
#   build_pyramid   -> mapped over those ranges, one pyramid per segment
#   echogram_store  -> collected, concatenated per level, checkpointed
#
# Level k merges 2**k pings, so a segment reduces to whole cells at every level
# only when its ping count is a multiple of 2**(levels-1). A cut anywhere else
# shifts every coarse level after it while still looking plausible.
# plan_pyramid_segments cuts on that grid and leaves the remainder in the last
# segment, so the result equals a serial build (asserted in AA-SI_EchogramGL's
# tests/test_ops.py).
#
# echogram_store is checkpointed, so the pyramid lands in the recipe or survey
# cache as one zarr group with a subgroup per level. Point the viewer at it:
#
#   aa-recipe run echogram_pyramid.yaml
#   aa-echogram serve --store <cache>/echogram_store/<hash>/<run>/zarr/pyramid.zarr \
#                     --app src/aa_si_echogram_gl/static --port 8129
#
# This four-file test segment (13,320 pings) plans as one segment; the parallel
# form pays off at survey scale.
#
# Usage: aa-recipe dry-run echogram_pyramid.yaml --visualize
recipe:
  name: "hb2407_echogram_pyramid"
  description: "HB2407 masked Sv built into an echogram viewer pyramid, segment-parallel."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  # Survey level: matches survey_preprocess.yaml apart from the window.
  raw_input_folder:
    type: path
    default: "./raw"
    fingerprint_mode: auto
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    default: "./HB2407_calibration_files"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."

  # The test segment: four contiguous files from the evening of 2024-09-24,
  # 3330 pings each. The end bound is inclusive on filename stamps, so this
  # selects T194054 through T222726 and stops short of T232256.
  survey_time_start:
    type: str
    default: "2024-09-24T19:40:54"
    description: "Optional inclusive ISO datetime bounding the start of the survey, matched to the time in each raw file name. Unset ingests every file."
  survey_time_end:
    type: str
    default: "2024-09-24T22:27:26"
    description: "Optional inclusive ISO datetime upper bound of the survey, matched to the time in each raw file name. Unset ingests through the last file."

  # Not the survey-wide 250 m: the .evl line puts this segment's seabed between
  # 17.9 and 53.3 m, so 250 m would leave the store four fifths nodata. 70 m
  # keeps a margin of blank water under the deepest seabed.
  crop_max_range_m:
    type: float
    default: 70.0
    description: >
      Range ceiling in metres; samples beyond it are dropped even if they hold
      data. Changing it recomputes the whole survey Sv.
  survey_chunk_ping_time:
    type: int
    default: 2000
    description: >
      Ping-time chunk size of the shared survey store, which sets the
      granularity a window reads at. Size it near the window users usually ask
      for.

  # Viewer pyramid
  pyramid_levels:
    type: int
    default: 8
    description: "Pyramid levels to build, halving the column axis each time; eight reduce it by 128 at the coarsest."
  # Sized for what one mapped instance holds: a segment is kept whole while its
  # levels are reduced, about a gigabyte at level zero on an uncropped water
  # column and twice that through the cascade.
  pyramid_segment_pings:
    type: int
    default: 32768
    description: "Target pings per pyramid segment, rounded down to a multiple of 2**(levels-1) (128 at eight levels). Each segment is built by its own mapped instance."

  # User level
  seabed_line_folder:
    type: path
    default: "./seabed_lines"
    description: >
      Folder of Echoview .evl seabed line exports, a local path or a gs:// URL.
      The files covering the time window are combined into the seafloor; a
      single .evl file is read whole.

  # Bound the pings, not the filename stamps: the last file runs about 55
  # minutes past its own stamp.
  file_time_start:
    type: str
    default: "2024-09-24T19:40:54"
    description: >
      Inclusive ISO UTC datetime start of this analysis segment. Selects its
      pings from the shared survey Sv and the seabed line files to read; unset
      leaves the start open.
  file_time_end:
    type: str
    default: "2024-09-24T23:25:00"
    description: >
      Inclusive ISO UTC datetime end of this analysis segment. Selects its
      pings from the shared survey Sv and the seabed line files to read; unset
      leaves the end open.

  surface_depth_m:
    type: float
    default: 5.0
    description: "Range from the transducer, in metres, above which samples are masked, to remove the transmit pulse and ringdown."
  seafloor_buffer_m:
    type: float
    default: 1.0
    description: "Height above the seabed line, in metres, that is also masked, to drop the bottom echo and detection error."

steps:

  # Survey level

  - include: sub_recipes/processing_lvl_1_survey.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      cruise_id: "HB2407"
      record_author: "<Your Name>"
      sonar_model: "EK80"
      survey_time_start: ${inputs.survey_time_start}
      survey_time_end: ${inputs.survey_time_end}

  - include: sub_recipes/processing_lvl_2_survey.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      datum_correction_m: -1.0
      use_heave: true
      heave_sign: 1.0
      crop_max_range_m: ${inputs.crop_max_range_m}
      survey_chunk_ping_time: ${inputs.survey_chunk_ping_time}

  # User level: the window enters here and nowhere above.

  - include: sub_recipes/processing_lvl_2_user_masked.yaml
    input_overrides:
      survey_sv: ${rechunk_survey_sv.ds_Sv}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      seabed_line_folder: ${inputs.seabed_line_folder}
      surface_depth_m: ${inputs.surface_depth_m}
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  # Viewer pyramid: the only part that is not echogram_masked.yaml

  # Every range but the last is a multiple of 2**(levels-1), so each reduces to
  # a whole number of cells at every level.
  - id: plan_segments
    op: plan_pyramid_segments
    inputs:
      ds_Sv: ${apply_mask.ds_Sv}
    params:
      levels: ${inputs.pyramid_levels}
      target_pings: ${inputs.pyramid_segment_pings}

  # One pyramid per segment. The op slices, so a mapped instance reads only its
  # own pings.
  - id: build_pyramid
    op: build_echogram_pyramid
    map_over: ${plan_segments.ranges}
    inputs:
      ds_Sv: ${apply_mask.ds_Sv}
    params:
      ping_range: ${_item}
      levels: ${inputs.pyramid_levels}
      range_var: echo_range
      aggregation: linear_mean

  # Concatenate level k of every segment; each part already carries every
  # level, so nothing is reduced again.
  - id: echogram_store
    op: merge_echogram_pyramids
    collect: ${build_pyramid.pyramid}
    checkpoint: always
    inputs:
      parts: ${build_pyramid.pyramid}
    params:
      dim: ping_time
