
recipe:
  name: "processing_levels_pipeline_gcs"
  description: "HB2407 processing levels pipeline reading all inputs from a GCS bucket."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    fingerprint_mode: auto
  cal_input_folder:
    type: path
    default: "./HB2407_calibration_files"
  seabed_line_folder:
    type: path
    default: "./seabed_lines"

  # Data time range. Selects the raw files to process AND the Echoview seabed
  # line exports to read, so the line always spans the pings. Leave both unset
  # to process the whole folder and read every line file.
  file_time_start:
    type: str
    default: "2024-10-12T00:15"
  file_time_end:
    type: str
    default: "2024-10-12T11:15"
  range_bin:
    type: str
    default: "5m"
  ping_time_bin:
    type: str
    default: "5s"

  # Default display window shared by every plotting step in this pipeline.
  min_depth:
    type: float
    default: 0
  max_depth:
    type: float
    default: 100
  ping_min:
    type: int
    default: 0
  ping_max:
    type: int
    default: 515
  x_axis_units:
    type: str
    default: "seconds"
  y_axis_units:
    type: str
    default: "meters"

steps:

  - include: sub_recipes/processing_lvl_1_parallel.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      cruise_id: "HB2407"
      record_author: "<Your Name>"
      sonar_model: "EK80"

  - include: sub_recipes/processing_lvl_2.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      seabed_line_folder: ${inputs.seabed_line_folder}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      surface_depth_m: 10.0
      noise_range_sample_num: 10
      noise_ping_num: 5

  - id: plot_sv_clean
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${remove_noise.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      ping_min: ${inputs.ping_min}
      ping_max: ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}

  - include: sub_recipes/processing_lvl_3.yaml
    input_overrides:
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      range_bin: ${inputs.range_bin}
      ping_time_bin: ${inputs.ping_time_bin}
      nan_threshold: 0.6


  - id: plot_mvbs
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${compute_mvbs.ds_MVBS}
      ds_Sv_source: ${mask_sparse.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      ping_min: ${inputs.ping_min}
      ping_max: ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}

  - include: sub_recipes/processing_lvl_4.yaml
    input_overrides:
      mvbs: ${compute_mvbs.ds_MVBS}
      echodata: ${combine_raw.echodata}
      overlay_line_var: "sw_dive_profile"
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      cell_stats_sv: ${compute_cell_stats.ds_Sv}
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      ping_min: ${inputs.ping_min}
      ping_max: ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
