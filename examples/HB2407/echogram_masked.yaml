# HB2407 masked Sv for the echogram viewer
#
# Sv with the seabed and surface cut out and nothing else done to it, the
# artifact an analyst checks a mask against.
#
#   level 1   per file: read -> calibration params
#   level 2a  per file: Sv -> transducer depth -> depth -> crop; merged, chunked
#   level 2b  select_window -> EVL seafloor -> masks -> apply_mask [checkpoint]
#
# It stops at apply_mask on purpose: noise removal rewrites every sample, and
# the viewer's reduction averages only the samples that survived the mask,
# which NaN marks. Level 2b is processing_lvl_2_user.yaml's chain stopped at
# apply_mask, so its checkpoints are shared with the full analysis recipe.
#
# The survey window is set here, which is not the usual choice: the four local
# raw files are a test segment, so survey_time_start / survey_time_end bound
# the ingest. That re-keys the survey checkpoints away from a real survey-wide
# run, which is correct since they are different data.
#
# Build the viewer store from the checkpoint this leaves, with the stand-in for
# the milestone 13 op in AA-SI_EchogramGL:
#
#   aa-recipe run echogram_masked.yaml
#   python scripts/build_viewer_store.py \
#       --cache    <this folder>/recipe_cache \
#       --manifest <this folder>/outputs/manifest.json \
#       --raw      <this folder>/raw/D20240924-T19*.raw \
#                  <this folder>/raw/D20240924-T2[012]*.raw \
#       --out stores/hb2407_masked --levels 8
#
# Usage: aa-recipe dry-run echogram_masked.yaml --visualize

recipe:
  name: "hb2407_echogram_masked"
  description: "HB2407 masked Sv, seabed and surface removed, no noise removal."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  # Survey level: matches survey_preprocess.yaml apart from the window.
  raw_input_folder:
    type: path
    default: "./raw"
    fingerprint_mode: auto
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    default: "./HB2407_calibration_files"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."

  # The test segment: four contiguous files from the evening of 2024-09-24,
  # 3330 pings each. The end bound is inclusive on filename stamps, so this
  # selects T194054 through T222726 and stops short of T232256.
  survey_time_start:
    type: str
    default: "2024-09-24T19:40:54"
    description: "Optional inclusive ISO datetime bounding the start of the survey, matched to the time in each raw file name. Unset ingests every file."
  survey_time_end:
    type: str
    default: "2024-09-24T22:27:26"
    description: "Optional inclusive ISO datetime upper bound of the survey, matched to the time in each raw file name. Unset ingests through the last file."

  # Not the survey-wide 250 m: the .evl line puts this segment's seabed between
  # 17.9 and 53.3 m, so 250 m would leave the store four fifths nodata. 70 m
  # keeps a margin of blank water under the deepest seabed.
  crop_max_range_m:
    type: float
    default: 70.0
    description: >
      Range ceiling in metres; samples beyond it are dropped even if they hold
      data. Changing it recomputes the whole survey Sv.
  survey_chunk_ping_time:
    type: int
    default: 2000
    description: >
      Ping-time chunk size of the shared survey store, which sets the
      granularity a window reads at. Size it near the window users usually ask
      for.

  # User level
  seabed_line_folder:
    type: path
    default: "./seabed_lines"
    description: >
      Folder of Echoview .evl seabed line exports, a local path or a gs:// URL.
      The files covering the time window are combined into the seafloor; a
      single .evl file is read whole.

  # Bound the pings, not the filename stamps: the last file runs about 55
  # minutes past its own stamp.
  file_time_start:
    type: str
    default: "2024-09-24T19:40:54"
    description: >
      Inclusive ISO UTC datetime start of this analysis segment. Selects its
      pings from the shared survey Sv and the seabed line files to read; unset
      leaves the start open.
  file_time_end:
    type: str
    default: "2024-09-24T23:25:00"
    description: >
      Inclusive ISO UTC datetime end of this analysis segment. Selects its
      pings from the shared survey Sv and the seabed line files to read; unset
      leaves the end open.

  surface_depth_m:
    type: float
    default: 5.0
    description: "Range from the transducer, in metres, above which samples are masked, to remove the transmit pulse and ringdown."
  seafloor_buffer_m:
    type: float
    default: 1.0
    description: "Height above the seabed line, in metres, that is also masked, to drop the bottom echo and detection error."

steps:

  # Survey level

  - include: sub_recipes/processing_lvl_1_survey.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      cruise_id: "HB2407"
      record_author: "<Your Name>"
      sonar_model: "EK80"
      survey_time_start: ${inputs.survey_time_start}
      survey_time_end: ${inputs.survey_time_end}

  - include: sub_recipes/processing_lvl_2_survey.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      datum_correction_m: -1.0
      use_heave: true
      heave_sign: 1.0
      crop_max_range_m: ${inputs.crop_max_range_m}
      survey_chunk_ping_time: ${inputs.survey_chunk_ping_time}

  # User level: the window enters here and nowhere above.

  - include: sub_recipes/processing_lvl_2_user_masked.yaml
    input_overrides:
      survey_sv: ${rechunk_survey_sv.ds_Sv}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      seabed_line_folder: ${inputs.seabed_line_folder}
      surface_depth_m: ${inputs.surface_depth_m}
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}
