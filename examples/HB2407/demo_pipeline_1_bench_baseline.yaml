# Benchmark variant of demo_pipeline_1.yaml: baseline, single chunk.
#
# Identical to demo_pipeline_1.yaml except two oversized chunk sizes that put
# remove_noise and compute_mvbs on one ping_time chunk each, the behaviour
# before chunking. Run it and demo_pipeline_1_bench_chunked.yaml with matching
# --input values but separate --user-cache-dir and --outputs-dir, then compare
# remove_noise's and compute_mvbs's elapsed_seconds in the two manifest.json
# files:
#
#   aa-recipe run demo_pipeline_1_bench_baseline.yaml \
#     --input raw_input_folder=<your gs:// or local path> \
#     --user-cache-dir ./bench_baseline/cache \
#     --outputs-dir ./bench_baseline/outputs
#
#   python -c "
#   import json
#   m = json.load(open('bench_baseline/outputs/manifest.json'))
#   print('remove_noise:', m['steps']['remove_noise']['elapsed_seconds'])
#   print('compute_mvbs:', m['steps']['compute_mvbs']['elapsed_seconds'])
#   "

recipe:
  name: "processing_levels_pipeline_gcs_bench_baseline"
  description: "Benchmark baseline of demo_pipeline_1.yaml: noise removal and MVBS each run on a single ping_time chunk."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    fingerprint_mode: auto
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    default: "./HB2407_calibration_files"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  seabed_line_folder:
    type: path
    default: "./seabed_lines"
    description: "Folder of Echoview .evl seabed line exports, a local path or a gs:// URL. The files covering the time window are combined into the seafloor; a single .evl file is read whole."

  # Data time range
  file_time_start:
    type: str
    default: "2024-10-12T00:15"
    description: "Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time in each raw file name; files at or after it are processed and scanned for calibration. Unset takes every file. It also selects the seabed line files to read."
  file_time_end:
    type: str
    default: "2024-10-12T11:15"
    description: "Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time in each raw file name; files at or before it are processed and scanned for calibration. Unset takes every file. It also selects the seabed line files to read."

  # Default display window shared by every plotting step; a step or sub-recipe
  # can override it with its own values.
  min_depth:
    type: float
    default: 0
    description: "Shallowest depth shown on the echograms, in metres."
  max_depth:
    type: float
    default: 100
    description: "Deepest depth shown on the echograms, in metres. Unset uses the deepest depth in the data."
  ping_min:
    type: int
    default: 0
    description: "First ping index shown on the echograms."
  ping_max:
    type: int
    default: 515
    description: "Last ping index shown on the echograms. Unset shows through the last ping."
  x_axis_units:
    type: str
    default: "seconds"
    description: "Echogram x axis: \"datetime\" (UTC clock time), \"seconds\" from the first ping shown, \"pings\", \"meters\" travelled, or \"bins\" (MVBS only)."
  y_axis_units:
    type: str
    default: "meters"
    description: "Echogram y axis: \"meters\", \"range_sample\", or \"bins\" (MVBS only)."


steps:

  - include: sub_recipes/processing_lvl_1_parallel.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      cruise_id: "HB2407"
      record_author: "<Your Name>"
      sonar_model: "EK80"
      # Fixed in both variants; it sets only combine_raw's checkpoint chunking,
      # not the noise or MVBS chunking.
      ping_time_chunk: 1000

  - include: sub_recipes/processing_lvl_2.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      # Transducer depth is each raw file's drop keel offset (e.g. 7.5 m) plus
      # datum_correction_m and heave.
      datum_correction_m: -1.0
      use_heave: true
      heave_sign: 1.0
      # surface mask
      surface_depth_m: 5.0
      # parameters for echopype's remove_background_noise:
      noise_range_sample_num: 10
      noise_ping_num: 5
      seabed_line_folder: ${inputs.seabed_line_folder}
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      # Benchmark: oversized, so remove_noise gets a single ping_time chunk.
      noise_chunk_ping_time: 999999999

  - id: plot_sv_clean
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${remove_noise.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      ping_min: ${inputs.ping_min}
      ping_max: ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 100

  - include: sub_recipes/processing_lvl_3.yaml
    input_overrides:
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      # MVBS bin size:
      range_bin: "4m"
      ping_time_bin: "2s"
      nan_threshold: 0.6 # mask bin if NAN's exceed this fraction of data in the cell
      # Benchmark: oversized, so compute_mvbs gets a single ping_time chunk.
      mvbs_chunk_ping_time: 999999999

  - id: plot_mvbs
    op: plot_sv_echogram
    regenerate: if-missing
    inputs:
      ds_Sv: ${compute_mvbs.ds_MVBS}
      ds_Sv_source: ${mask_sparse.ds_Sv}
    params:
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      ping_min: ${inputs.ping_min}
      ping_max: ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50

  - include: sub_recipes/processing_lvl_4.yaml
    input_overrides:
      mvbs: ${compute_mvbs.ds_MVBS}
      echodata: ${combine_raw.echodata}
      overlay_line_var: "sw_dive_profile"
      sv_clean_unmasked: ${remove_noise.ds_Sv}
      cell_stats_sv: ${compute_cell_stats.ds_Sv}
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      ping_min: ${inputs.ping_min}
      ping_max: ${inputs.ping_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}