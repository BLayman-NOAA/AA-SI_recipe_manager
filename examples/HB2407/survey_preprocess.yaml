# HB2407 survey pre-processing: build the shared Sv store
#
# Runs levels 1 and 2a only, producing the chunked survey-wide Sv store every
# user recipe starts from (see Herring_10-15_windowed.yaml). Slow and run
# rarely; the user recipes that read it are fast.
#
#   level 1   per file: read -> materialize -> select this file's calibration
#   level 2a  per file: Sv -> transducer depth -> depth -> fixed range crop
#             fan-in:   merge on ping_time -> rechunk -> checkpoint
#
# No user window on purpose: a window wired into initial_setup would re-key
# every downstream checkpoint, so no two user segments would share cached work.
# Nothing here needs the survey in memory; the steps that scale with survey
# length run after the user's window.
#
# Publish to the shared cache tier so user runs read it, and run it where the
# bucket is (a survey-scale store over a 2.8 MiB/s uplink takes days):
#   aa-recipe run survey_preprocess.yaml --cache-write-tier survey
#
# Usage: aa-recipe dry-run survey_preprocess.yaml --visualize

recipe:
  name: "hb2407_survey_preprocess"
  description: "HB2407 survey-wide Sv store: per-file calibration and depth, merged and chunked."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  # fingerprint_mode: auto puts the folder's contents in the hash, not its
  # location, so a local copy and the gs:// original give the same survey hash.
  raw_input_folder:
    type: path
    fingerprint_mode: auto
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    default: "./HB2407_calibration_files"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."

  # One constant for every file, so they share a range_sample length. 250 m
  # clears the deepest seabed seen on this survey (214 m in the 10-15 window);
  # confirm against the .evl line files before changing it.
  crop_max_range_m:
    type: float
    default: 250.0
    description: >
      Range ceiling in metres; samples beyond it are dropped even if they hold
      data. Changing it recomputes the whole survey Sv.

  # User recipes must pass the same value, or they miss the shared cache.
  survey_chunk_ping_time:
    type: int
    default: 2000
    description: >
      Ping-time chunk size of the shared survey store, which sets the
      granularity a window reads at. Size it near the window users usually ask
      for.

steps:

  - include: sub_recipes/processing_lvl_1_survey.yaml
    input_overrides:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      cruise_id: "HB2407"
      record_author: "<Your Name>"
      sonar_model: "EK80"

  - include: sub_recipes/processing_lvl_2_survey.yaml
    input_overrides:
      echodata: ${combine_raw.echodata}
      cal_params: ${extract_cal_params.cal_params}
      env_params: ${extract_cal_params.env_params}
      # Transducer depth is the raw file's drop keel offset (e.g. 7.5 m) plus
      # datum_correction_m and heave.
      datum_correction_m: -1.0
      use_heave: true
      heave_sign: 1.0
      crop_max_range_m: ${inputs.crop_max_range_m}
      survey_chunk_ping_time: ${inputs.survey_chunk_ping_time}
