# HB2407 calibration only, staged: the calibration_pipeline.yaml outputs as
# four separately cached steps.
#
#   initial_setup        resolve the raw file set and the calibration output
#                        directory under outputs/
#   scan_raw_config      one instance per raw file, reading that file's channel
#                        configuration and nothing else
#   record_raw_configs   fans the per-file results back in and writes
#                        raw_file_configs.yaml
#   standardize_cal      parses the manufacturer .cal / .xml files into one
#                        standardized file per channel
#   build_cal_mapping    matches each raw channel to its calibration data and
#                        writes the mapping files
#
# Artifacts land under <outputs_dir>/<calibration_outputs>/, as the fused
# recipe leaves them:
#
#   raw_file_configs/                  raw_file_configs.yaml
#   single_channel_calibration_files/  one standardized .yaml per channel (required by NCEI)
#   mapping_files/                     channel_mapping.yaml (required by NCEI),
#                                      calibration_configurations.yaml
#   unused_calibration_files/          cal files no raw channel matched
#   logs/                              calibration_flags.json
#   standardization.fingerprint.json   which manufacturer files produced the
#                                      single-channel files above
#
# The fused generate_standardized_cal_mapping is one cache entry, so a crash
# mid-scan loses the whole scan and a corrected calibration file invalidates
# the scan too. Split, each stage answers to its own inputs. On a re-run:
#
#   nothing changed          everything cached except build_cal_mapping
#   scan interrupted         only the unscanned files are read
#   a manufacturer cal file  standardize_cal and build_cal_mapping re-run, the
#     corrected or replaced  raw scan does not
#   raw_file_configs.yaml    rebuilt from the cached per-file scans without
#     deleted                re-reading a raw file
#   the single-channel       rebuilt in full
#     FOLDER deleted
#   ONE single-channel       not put back, which is the conflict workflow;
#     file deleted by hand   build_cal_mapping re-runs against what is left
#
# Adding a raw file still re-scans every file: initial_setup fingerprints the
# raw folder, and every scan_raw_config instance descends from it.
#
# The default checkpoint mode is "explicit", so all four steps say
# checkpoint: always. Recorded output files let regenerate: if-missing tell
# when an output was deleted.
#
# outputs_dir comes from the run config and stays local. The input folders may
# be gs:// URLs, which needs the gcs extra: pip install aa-si-calibration[gcs].
#
# Usage:
#   aa-recipe run calibration_pipeline_staged.yaml

recipe:
  name: "hb2407_calibration_staged"
  description: "Standardize manufacturer calibration files and build the raw-channel mapping for HB2407, as separately cached stages."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    default: "./raw"
    fingerprint_mode: auto
    description: "Folder of raw .raw files, a local path or a gs:// URL, read for channel configuration only."
  cal_input_folder:
    type: path
    default: "./HB2407_calibration_files"
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_outputs:
    type: str
    default: "calibration"
    description: "Name of the subfolder of the run's outputs folder that calibration artifacts are written to."
  cruise_id:
    type: str
    default: "HB2407"
    description: "Cruise identifier, such as \"HB1603\", recorded in every generated single-channel calibration file so it stays traceable to the survey."
  record_author:
    type: str
    default: "<Your Name>"
    description: "Name recorded as the author of every generated single-channel calibration file."
  # Applied once, by initial_setup; the scan fans out over the files it selects.
  file_time_start:
    type: str
    required: false
    description: >
      Optional inclusive ISO datetime, for debugging, matched to the
      D{YYYYMMDD}-T{HHMMSS} time in each raw file name; files at or after it
      are processed and scanned for calibration. Unset takes every file.
  file_time_end:
    type: str
    required: false
    description: "Optional inclusive ISO datetime, for debugging, matched to the D{YYYYMMDD}-T{HHMMSS} time in each raw file name; files at or before it are processed and scanned for calibration. Unset takes every file."
  conflict_resolution:
    type: str
    default: "error"
    description: >
      What to do when one raw channel matches several calibration files:
      "error" lists the conflicts and stops; "interactive" prompts on the
      terminal, so it cannot run unattended.

steps:

  - id: initial_setup
    op: initial_setup
    params:
      raw_input_folder: ${inputs.raw_input_folder}
      calibration_outputs: ${inputs.calibration_outputs}
      clear_previous_json_logs: true
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}

  # One instance per raw file, so an interrupted scan resumes from what it
  # already read. verbose is off because one banner per file buries the log.
  - id: scan_raw_config
    op: read_raw_file_config
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: always
    params:
      raw_file_path: ${_item}
      verbose: false

  - id: record_raw_configs
    op: record_raw_file_configs
    collect: ${scan_raw_config.file_config}
    checkpoint: always
    regenerate: if-missing
    inputs:
      file_configs: ${scan_raw_config.file_config}
    params:
      output_base: ${initial_setup.calibration_output_dir}

  # regenerate: if-missing is safe here only because this step records its
  # output directory: wiping the folder rebuilds it, deleting one file inside
  # it does not. The conflict workflow depends on that distinction.
  - id: standardize_cal
    op: standardize_calibration_files
    checkpoint: always
    regenerate: if-missing
    inputs:
      frequencies: ${record_raw_configs.frequencies}
    params:
      cal_input_folder: ${inputs.cal_input_folder}
      output_base: ${initial_setup.calibration_output_dir}
      cruise_id: ${inputs.cruise_id}
      record_author: ${inputs.record_author}
      short_filenames: true

  # single_channel_dir and raw_configs_path are wired for the ordering edges;
  # both would otherwise default to the same locations under output_base.
  - id: build_cal_mapping
    op: build_calibration_mapping
    checkpoint: always
    regenerate: always
    inputs:
      raw_file_configs: ${record_raw_configs.raw_file_configs}
    params:
      output_base: ${initial_setup.calibration_output_dir}
      single_channel_dir: ${standardize_cal.single_channel_dir}
      raw_configs_path: ${record_raw_configs.raw_configs_path}
      short_filenames: true
      # Keep unmatched calibration files rather than deleting them: they are
      # the evidence when a channel comes out unmapped.
      keep_unused: true
      conflict_resolution: ${inputs.conflict_resolution}
