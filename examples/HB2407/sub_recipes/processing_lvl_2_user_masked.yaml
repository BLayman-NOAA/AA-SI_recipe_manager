# Processing level 2b, user, masked only: window selection and masking
#
# processing_lvl_2_user.yaml's chain stopped at apply_mask, with the masked Sv
# checkpointed for something downstream to read.
#
#   select_window -> detect_seafloor (EVL line) -> seafloor/surface masks
#                 -> combine -> apply_mask [checkpoint]
#
# Masked but not denoised Sv is what an analyst checks the mask against, since
# noise removal changes the picture everywhere.
#
# Step ids and params match processing_lvl_2_user.yaml exactly, so the two
# share every checkpoint up to apply_mask and each warms the other's cache.
# Keep them identical; this is a duplicate rather than a refactor so its
# hashes do not move.
#
# The output is NaN wherever the mask rejected a sample (drawn as nodata) and
# keeps echo_range as well as depth: the grid is regular in echo_range but not
# in heave-corrected depth.

recipe:
  name: "processing_lvl_2_user_masked"
  description: "Select a ping_time window from the survey Sv and mask it, without denoising."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  survey_sv:
    type: dataset
    description: "Merged, chunked survey-wide Sv from the shared survey level, which this segment selects its pings from."
  file_time_start:
    type: str
    required: false
    description: >
      Inclusive ISO UTC datetime start of this analysis segment. Selects its
      pings from the shared survey Sv and the seabed line files to read; unset
      leaves the start open.
  file_time_end:
    type: str
    required: false
    description: "Inclusive ISO UTC datetime end of this analysis segment. Selects its pings from the shared survey Sv and the seabed line files to read; unset leaves the end open."
  seabed_line_folder:
    type: path
    description: >
      Folder of Echoview .evl seabed line exports, a local path or a gs:// URL.
      The files covering the time window are combined into the seafloor; a
      single .evl file is read whole.
  seabed_line_max_gap_s:
    type: float
    default: 600
    description: >
      Widest gap in the combined seabed line, in seconds, to interpolate across;
      pings in a wider gap get no seafloor. Only a break between survey legs is
      this wide.
  seabed_line_min_coverage:
    type: float
    default: 0.99
    description: >
      Fraction of the window's pings (0 to 1) the seabed line must cover, or the
      step fails. Lower it or widen the window rather than let uncovered pings
      through, since all their samples are masked.
  surface_depth_m:
    type: float
    default: 10.0
    description: "Range from the transducer, in metres, above which samples are masked, to remove the transmit pulse and ringdown."
  seafloor_buffer_m:
    type: float
    default: 1.0
    description: "Height above the seabed line, in metres, that is also masked, to drop the bottom echo and detection error."

steps:

  # Entry point into the shared survey store: everything above this step is
  # shared, everything below is this user's.
  - id: select_window
    op: select_ping_time_range
    checkpoint: always
    inputs:
      ds_Sv: ${inputs.survey_sv}
    params:
      start: ${inputs.file_time_start}
      end: ${inputs.file_time_end}

  - id: detect_seafloor
    op: read_seafloor_line
    checkpoint: save
    inputs:
      ds_Sv: ${select_window.ds_Sv}
    params:
      evl_path: ${inputs.seabed_line_folder}
      # The window that selected the pings. A line file spans from its own name
      # stamp to the next file's, which pulls in the export straddling the
      # window start.
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      # No extrapolation past the line's ends: uncovered pings come back NaN
      # and are masked entirely, so min_coverage fails the run instead.
      edge_extend_s: 0.0
      max_gap_s: ${inputs.seabed_line_max_gap_s}
      min_coverage: ${inputs.seabed_line_min_coverage}

  # ds_Sv must carry 'depth' to match the surface-referenced line, or
  # create_seafloor_mask silently falls back to echo_range. The survey store
  # has been through ep_add_depth, so select_window's output does.
  - id: create_seafloor_mask
    op: create_seafloor_mask
    inputs:
      ds_Sv: ${select_window.ds_Sv}
      seafloor_depth: ${detect_seafloor.seafloor_depth}
    params:
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  # create_surface_mask always compares against echo_range.
  - id: create_surface_mask
    op: create_surface_mask
    inputs:
      ds_Sv: ${select_window.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_depth_m}

  - id: combine_masks
    op: combine_masks
    inputs:
      masks:
        - ${create_seafloor_mask.mask}
        - ${create_surface_mask.mask}
    params:
      mode: "and"

  # The end of the chain here, checkpointed because it is the artifact. In
  # processing_lvl_2_user.yaml this step feeds rechunk_before_noise instead.
  - id: apply_mask
    op: apply_sv_mask
    checkpoint: always
    inputs:
      ds_Sv: ${select_window.ds_Sv}
      mask: ${combine_masks.mask}
