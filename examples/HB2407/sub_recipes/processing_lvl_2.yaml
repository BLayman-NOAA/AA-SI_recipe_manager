# Processing level 2: Sv, masking and noise removal on the combined EchoData

recipe:
  name: "processing_lvl_2"
  description: "Compute Sv, build masks, and remove noise."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  echodata:
    type: echodata
    description: "Combined raw EchoData from level 1, calibrated to Sv here and used for transducer depth."
  cal_params:
    type: dict
    description: "Calibration values for each channel, taken from the standardized calibration mapping and applied when computing Sv."
  env_params:
    type: dict
    description: "Environmental values for each channel, such as sound speed and absorption, taken from the standardized calibration mapping and applied when computing Sv."
  datum_correction_m:
    type: float
    default: 0.0
    description: >
      Metres added to each file's recorded drop keel offset to give depth below
      the waterline; positive pushes the transducer deeper. 0 takes the
      recorded offset as waterline referenced.
  use_heave:
    type: bool
    default: true
    description: "Add the per-ping platform heave to transducer depth. False holds the static keel depth on every ping."
  # Found by correlating raw heave against the EVL line: 0.14 m residual for
  # +1.0 against 0.75 m for -1.0.
  heave_sign:
    type: float
    default: 1.0
    description: >
      Sign applied to platform heave when computing transducer depth, +1.0 or
      -1.0. +1.0 fits the hand-verified EVL seabed line best on HB2407.
  seabed_line_folder:
    type: path
    description: >
      Folder of Echoview .evl seabed line exports, a local path or a gs:// URL.
      The files covering the time window are combined into the seafloor; a
      single .evl file is read whole.
  file_time_start:
    type: str
    required: false
    description: >
      Optional inclusive ISO datetime selecting the seabed line files to read,
      by the time span in their names. Pass the window that selected the raw
      files; unset reads every line file.
  file_time_end:
    type: str
    required: false
    description: "Optional inclusive ISO datetime selecting the seabed line files to read, by the time span in their names. Pass the window that selected the raw files; unset reads every line file."
  # Consecutive line files meet to within a second, so this only bites across a
  # leg gap, where interpolating would draw a straight seafloor over days of
  # missing line.
  seabed_line_max_gap_s:
    type: float
    default: 600
    description: >
      Widest gap in the combined seabed line, in seconds, to interpolate across;
      pings in a wider gap get no seafloor. Only a break between survey legs is
      this wide.
  surface_depth_m:
    type: float
    default: 10.0
    description: "Range from the transducer, in metres, above which samples are masked, to remove the transmit pulse and ringdown."
  seafloor_buffer_m:
    type: float
    default: 1.0
    description: "Height above the seabed line, in metres, that is also masked, to drop the bottom echo and detection error."
  noise_range_sample_num:
    type: int
    default: 10
    description: "Range samples per bin for the background noise estimate."
  noise_ping_num:
    type: int
    default: 5
    description: "Pings per bin for the background noise estimate."
  # Independent of combine_raw_files's ping_time_chunk, which is for checkpoint
  # writes. Must be smaller than the window's ping count or it is one chunk.
  noise_chunk_ping_time:
    type: int
    default: 1000
    description: >
      Ping-time chunk size set before noise removal, so the noise estimate runs
      in dask chunks rather than as one in-memory block. Keep it a multiple of
      noise_ping_num.

steps:

  - id: compute_sv
    op: compute_sv
    checkpoint: always
    inputs:
      echodata: ${inputs.echodata}
      cal_params: ${inputs.cal_params}
      env_params: ${inputs.env_params}
      waveform_mode: "CW" 
      encode_mode: "power"

  # Checkpointed because it is tiny and records the vertical reference the run
  # used, so it can be inspected without recomputing Sv.
  - id: compute_transducer_depth
    op: compute_transducer_depth
    checkpoint: always
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      datum_correction_m: ${inputs.datum_correction_m}
      use_heave: ${inputs.use_heave}
      heave_sign: ${inputs.heave_sign}

  - id: ep_add_depth
    op: ep_add_depth
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      depth_offset: ${compute_transducer_depth.transducer_depth}

  - id: ep_add_splitbeam_angle
    op: ep_add_splitbeam_angle
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      waveform_mode: "CW"
      encode_mode: "power"
      to_disk: false

  # Alternative: echopype's basic bottom detector instead of the .evl line.
  # - id: detect_seafloor
  #   op: ep_detect_seafloor
  #   checkpoint: save
  #   inputs:
  #     ds_Sv: ${ep_add_splitbeam_angle.ds_Sv}
  #   params:
  #     method: "basic"
  #     method_params:
  #       var_name: "Sv"
  #       channel: "WBT 400503-15 ES70-7C_ES"

  - id: detect_seafloor
    op: read_seafloor_line
    checkpoint: save
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
    params:
      evl_path: ${inputs.seabed_line_folder}
      # Same window that selects the raw files. A line file spans from its own
      # name stamp to the next file's, which pulls in the export straddling the
      # window start.
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      # No extrapolation past the line's ends: pings outside it come back NaN
      # and are masked entirely, so min_coverage fails the run instead.
      edge_extend_s: 0.0
      max_gap_s: ${inputs.seabed_line_max_gap_s}
      min_coverage: 0.99

  - id: create_seafloor_mask
    op: create_seafloor_mask
    inputs:
      ds_Sv: ${ep_add_splitbeam_angle.ds_Sv}
      seafloor_depth: ${detect_seafloor.seafloor_depth}
    params:
      # The seabed sits at 55-71 m in this line; a buffer anywhere near that
      # depth keeps nothing at all.
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  - id: create_surface_mask
    op: create_surface_mask
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_depth_m}

  - id: combine_masks
    op: combine_masks
    inputs:
      masks:
        - ${create_seafloor_mask.mask}
        - ${create_surface_mask.mask}
    params:
      mode: "and"

  - id: apply_mask
    op: apply_sv_mask
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      mask: ${combine_masks.mask}

  - id: rechunk_before_noise
    op: rechunk_dataset
    inputs:
      ds_Sv: ${apply_mask.ds_Sv}
    params:
      ping_time_chunk: ${inputs.noise_chunk_ping_time}

  - id: remove_noise
    op: remove_background_noise
    checkpoint: always
    inputs:
      ds_Sv: ${rechunk_before_noise.ds_Sv}
    params:
      range_sample_num: ${inputs.noise_range_sample_num}
      ping_num: ${inputs.noise_ping_num}
      # Must be a dB string, not a bare number. Lower it to keep more weak data.
      # SNR_threshold: "0dB"