# Processing level 1, survey: raw ingest and per-file calibration
#
# Same steps as processing_lvl_1_per_file.yaml, but the time window is a fixed
# survey-wide constant, not the window a user asks for. initial_setup and
# gen_cal_mapping take the window as params, so a user window wired in here
# would change every hash below them and two users' segments would share no
# cached work. User recipes narrow to their segment later, with
# select_ping_time_range in processing_lvl_2_user.yaml.
#
# Do not wire a user's file_time_start into this include. Override
# survey_time_start / survey_time_end only when the survey itself changes.
# Included by survey_preprocess.yaml and every user recipe built on it.

recipe:
  name: "processing_lvl_1_survey"
  description: "Per-file raw ingest and calibration over a fixed survey-wide window."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  # Declare it with fingerprint_mode: auto in the parent recipe so the folder's
  # contents, not its location, enter the hash; a local copy and the bucket
  # then give the same survey hash.
  raw_input_folder:
    type: path
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_outputs:
    type: str
    default: "calibration"
    description: "Name of the subfolder of the run's outputs folder that calibration artifacts are written to."
  cruise_id:
    type: str
    description: "Cruise identifier, such as \"HB1603\", recorded in every generated single-channel calibration file so it stays traceable to the survey."
  record_author:
    type: str
    default: "<Your Name>"
    description: "Name recorded as the author of every generated single-channel calibration file."
  sonar_model:
    type: str
    default: "EK80"
    description: "Echosounder model as echopype names it, such as \"EK60\" or \"EK80\"."
  raw_file_names:
    type: list
    default: []
    description: >
      Optional list of file names within raw_input_folder to process. An empty
      list uses every .raw file in the folder.
  # Changing it re-keys every downstream checkpoint. It bounds the survey, not
  # a user's segment.
  survey_time_start:
    type: str
    required: false
    description: >
      Optional inclusive ISO datetime bounding the start of the survey, matched
      to the time in each raw file name. Unset ingests every file.
  survey_time_end:
    type: str
    required: false
    description: "Optional inclusive ISO datetime upper bound of the survey, matched to the time in each raw file name. Unset ingests through the last file."
  ping_time_chunk:
    type: int
    default: 10000
    description: >
      Chunk length along ping_time of each file's EchoData and its checkpoint.
      Larger chunks mean fewer, faster remote writes but more memory per chunk.
      The default keeps each file in one chunk; lower it if a file does not fit
      in memory.

steps:

  - id: initial_setup
    op: initial_setup
    params:
      raw_input_folder: ${inputs.raw_input_folder}
      calibration_outputs: ${inputs.calibration_outputs}
      raw_file_names: ${inputs.raw_file_names}
      clear_previous_json_logs: true
      file_time_start: ${inputs.survey_time_start}
      file_time_end: ${inputs.survey_time_end}

  - id: gen_cal_mapping
    op: generate_standardized_cal_mapping
    params:
      raw_input_folder: ${inputs.raw_input_folder}
      cal_input_folder: ${inputs.cal_input_folder}
      output_base: ${initial_setup.calibration_output_dir}
      cruise_id: ${inputs.cruise_id}
      record_author: ${inputs.record_author}
      short_filenames: true
      keep_unused: true
      conflict_resolution: "error"
      file_time_start: ${inputs.survey_time_start}
      file_time_end: ${inputs.survey_time_end}

  # Per-file fan-out
  # One mapped instance per raw file, each checkpointed under its own
  # content-addressed hash, so adding a file runs the chain for that file only.

  # checkpoint: never: the output is an exe_temp store path deleted at the end
  # of the run.
  - id: read_raw
    op: read_raw_files
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: never
    execution:
      dask_config:
        scheduler: processes
    inputs:
      raw_file_paths:
        - ${_item}
    params:
      sonar_model: ${inputs.sonar_model}
      include_bot: false
      intermediate_format: "zarr"

  - id: combine_raw
    op: combine_raw_files
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      raw_stores: ${read_raw.raw_stores}
    params:
      ping_time_chunk: ${inputs.ping_time_chunk}

  - id: extract_cal_params
    op: extract_standardized_cal_params
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      calibration_dict: ${gen_cal_mapping.calibration_dict}
      mapping_dict: ${gen_cal_mapping.mapping_dict}
      echodata: ${combine_raw.echodata}
    params:
      raw_file_path: ${_item}
