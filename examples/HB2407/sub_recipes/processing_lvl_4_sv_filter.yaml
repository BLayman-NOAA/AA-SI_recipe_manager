# Processing level 4, Sv-filtered two pass: machine learning and clustering
#
# Like processing_lvl_4.yaml with a second clustering pass. Pass 1 clusters
# every sample; pass 2 re-clusters only the high-Sv part of the pass-1 noise
# (filter_normalized_by_cluster, then filter_normalized_by_feature). The passes
# are merged, and each pass and the merge get their own report.
#
# The Sv filter recovers a compact aggregation that pass 1 left as noise: it
# lands there from its small share of the population, not from being diffuse,
# and removing the background makes it a dominant mode. Re-clustering the whole
# noise pool does not, since the background still dominates it.
#
# Pass 2 reuses the pass-1 normalization on purpose: re-normalizing the subset
# stretches it across the full range and breaks up the group pass 2 is after.

recipe:
  name: "processing_lvl_4_sv_filter"
  description: "ML reshape, normalization, Sv-filtered two-pass clustering, and reporting."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  mvbs:
    type: dataset
    description: "Gridded MVBS to cluster, one ML sample per cell, with any line overlay variables already added."
  echodata:
    type: echodata
    required: false
    description: >
      Raw EchoData supplying the echosounder's own bottom pick for the
      'seafloor_depth' and 'altitude' features. Used only when seafloor_depth
      is not wired.
  seafloor_depth:
    type: dataarray
    required: false
    description: >
      Seafloor line over ping_time, preferred over echodata for the
      'seafloor_depth' and 'altitude' features so they use the line the
      masking used.
  overlay_line_var:
    type: str
    default: "overlay_line"
    description: "Name of the line variable drawn over the clustering report plots."
  sv_clean_unmasked:
    type: dataset
    description: >
      Noise-removed Sv before sparse-bin masking, used as the backdrop and ping
      reference for the ML and cluster echograms.
  cell_stats_sv:
    type: dataset
    description: "Per-cell statistics, such as the coefficient of variation, on the MVBS grid. Needed when the cell_cv feature is listed."
  min_depth:
    type: float
    default: 0
    description: "Shallowest depth shown on the ML and clustering echograms, in metres."
  max_depth:
    type: float
    default: 100
    description: "Deepest depth shown on the ML and clustering echograms, in metres. Unset uses the deepest depth in the data."
  time_min:
    type: str
    description: >
      Start of the window of the ML and clustering echograms, as a UTC
      timestamp such as "2024-10-15T12:30". Unset starts at the first ping.
  time_max:
    type: str
    description: >
      End of the window of the ML and clustering echograms, as a UTC timestamp
      such as "2024-10-15T12:30". Unset runs to the last ping.
  x_axis_units:
    type: str
    default: "datetime"
    description: "Echogram x axis: \"datetime\" (UTC clock time), \"seconds\" from the first ping shown, \"pings\", \"meters\" travelled, or \"bins\" (MVBS only)."
  y_axis_units:
    type: str
    default: "meters"
    description: "Echogram y axis: \"meters\", \"range_sample\", or \"bins\" (MVBS only)."

  # Pass-1 HDBSCAN tuning, exposed so a parent recipe can sweep it.
  hdbscan_min_cluster_size_fraction:
    type: float
    default: 0.001
    description: >
      Smallest cluster HDBSCAN keeps in pass 1, as a fraction of the points it
      is fitted on.
  hdbscan_min_samples:
    type: int
    default: 7
    description: >
      Neighbourhood size HDBSCAN uses to judge density in pass 1; higher values
      leave more points unclustered as noise.
  hdbscan_cluster_selection_method:
    type: str
    default: "eom"
    description: >
      How HDBSCAN draws clusters from its condensed tree in pass 1: "eom"
      (excess of mass) or "leaf" (the finest leaves).
  hdbscan_sample_size:
    type: int
    default: 1500000
    description: >
      Cap on the points HDBSCAN clusters in pass 1. Points over the cap are
      dropped at random and come back unlabelled, not as noise, so keep it
      above the point count.

  # Pass-2 Sv filter.
  sv_filter_min_value:
    type: float
    default: -70
    description: >
      Lowest mean_Sv, in dB, kept for pass 2. Set it below the aggregation
      being recovered and above the bulk of the echogram; a threshold inside
      the aggregation's range splits it.

  # The "#" inside the quoted color strings are not comments; leave them.
  cluster_colors:
    type: list
    description: "Hex color strings, one per cluster label, shared by the pass 1, pass 2 and merged reports."
    default:
      - "#9D00FF"
      - "#35E200"
      - "#FF0000"
      - "#2F00FF"
      - "#FF8800"
      - "#FFFB1C"
      - "#FF44E9"
      - "#00BE8BCA"
      - "#00FFE5"
      - "#3D8D00FF"
      - "#9C67FFFF"

steps:

  - id: reshape_ml
    op: reshape_for_ml
    inputs:
      ds_MVBS: ${inputs.mvbs}
    params:
      data_var: "Sv"
      dataset_name: "ml_dataset"
      feature_strategy: "mean_centered"
      baseline_channel: 0

  - id: add_aux_features
    op: add_auxiliary_features
    inputs:
      ds_ml: ${reshape_ml.ds_ml_ready}
      echodata: ${inputs.echodata}
      ds_sv: ${inputs.cell_stats_sv}
      seafloor_depth: ${inputs.seafloor_depth}
    params:
      dataset_name: "ml_dataset"
      features:
        - cell_cv

  - id: normalize_ml
    op: normalize_ml_data
    checkpoint: always
    inputs:
      ds_ml: ${add_aux_features.ds_ml_ready}
    params:
      method: "flatten"
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      shift_positive: false

  - id: plot_normalized_ml
    op: plot_ml_echogram
    regenerate: if-missing
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      min_depth: ${inputs.min_depth}
      max_depth: ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 30

  # Pass 1: cluster every sample

  - id: run_hdbscan
    op: run_hdbscan
    checkpoint: save
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      ml_result_name: "hdbscan_results"
      min_cluster_size_fraction: ${inputs.hdbscan_min_cluster_size_fraction}
      min_samples: ${inputs.hdbscan_min_samples}
      sample_size: ${inputs.hdbscan_sample_size}
      cluster_selection_method: ${inputs.hdbscan_cluster_selection_method}
      use_hdbscan: true
      soft_membership_threshold: 0.6

  # Pass 2: re-cluster the high-Sv part of the pass-1 noise
  # The first filter keeps the pass-1 noise, the second narrows it to the
  # high-Sv end. Both carry the pass-1 normalized features through untouched.

  - id: filter_noise
    op: filter_normalized_by_cluster
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
    params:
      cluster_label: -1
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"

  - id: filter_high_sv
    op: filter_normalized_by_feature
    inputs:
      ds_normalized: ${filter_noise.ds_normalized_filtered}
    params:
      feature_name: "mean_Sv"
      min_value: ${inputs.sv_filter_min_value}
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"

  - id: run_hdbscan_pass2
    op: run_hdbscan
    inputs:
      ds_normalized: ${filter_high_sv.ds_normalized_filtered}
    params:
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      ml_result_name: "hdbscan_pass2"
      min_cluster_size_fraction: .005
      min_samples: 8
      sample_size: 10000000
      cluster_selection_method: "eom"
      use_hdbscan: true

  # Merge pass 1 and pass 2 results

  - id: merge_passes
    op: merge_clustering_passes
    inputs:
      clustering_results_pass1: ${run_hdbscan.clustering_results}
      clustering_results_pass2:
        - ${run_hdbscan_pass2.clustering_results}
    params:
      ml_result_name: "hdbscan_merged"
      dataset_name: "ml_dataset"
      normalization_name: "normalized_flatten_mean_centered"
      retain_parent_labels: true

  # Embed all three label sets into one dataset
  # Each result is stored under its own ml_result_name. Pass 2 covers only the
  # filtered samples; the rest of its grid stays NaN.

  - id: embed_pass1
    op: embed_clustering_results
    inputs:
      ds_normalized: ${normalize_ml.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"

  - id: embed_pass2
    op: embed_clustering_results
    inputs:
      ds_normalized: ${embed_pass1.ds_normalized}
      clustering_results: ${run_hdbscan_pass2.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_pass2"

  - id: embed_results
    op: embed_clustering_results
    checkpoint: always
    inputs:
      ds_normalized: ${embed_pass2.ds_normalized}
      clustering_results: ${merge_passes.clustering_results}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_merged"

  # One report per pass, plus the merged report
  # Each pass gets its own clustering_model for its hierarchy plot; the merged
  # result has no single model, so its report has no hierarchy panel.

  - id: plot_pass1_report
    op: plot_clustering_report
    regenerate: if-missing
    inputs:
      ds_normalized: ${embed_results.ds_normalized}
      clustering_results: ${run_hdbscan.clustering_results}
      clustering_model: ${run_hdbscan.clustering_model}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_results"
      # [min_depth, max_depth]; the ping slots are left off because time_min
      # and time_max below window the plot instead.
      plot_window:
        - ${inputs.min_depth}
        - ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50
      cluster_stats_dpi: 200
      overlay_line_var: ${inputs.overlay_line_var}
      cluster_colors: ${inputs.cluster_colors}
      cluster_stats_sv_data_var: "Sv"

  - id: plot_pass2_report
    op: plot_clustering_report
    regenerate: if-missing
    inputs:
      ds_normalized: ${embed_results.ds_normalized}
      clustering_results: ${run_hdbscan_pass2.clustering_results}
      clustering_model: ${run_hdbscan_pass2.clustering_model}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_pass2"
      plot_window:
        - ${inputs.min_depth}
        - ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50
      cluster_stats_dpi: 200
      overlay_line_var: ${inputs.overlay_line_var}
      cluster_colors: ${inputs.cluster_colors}
      cluster_stats_sv_data_var: "Sv"

  - id: plot_final_report
    op: plot_clustering_report
    regenerate: if-missing
    inputs:
      ds_normalized: ${embed_results.ds_normalized}
      clustering_results: ${merge_passes.clustering_results}
      ds_Sv: ${inputs.sv_clean_unmasked}
    params:
      dataset_name: "ml_dataset"
      ml_result_name: "hdbscan_merged"
      plot_window:
        - ${inputs.min_depth}
        - ${inputs.max_depth}
      time_min: ${inputs.time_min}
      time_max: ${inputs.time_max}
      x_axis_units: ${inputs.x_axis_units}
      y_axis_units: ${inputs.y_axis_units}
      dpi: 50
      cluster_stats_dpi: 200
      overlay_line_var: ${inputs.overlay_line_var}
      cluster_colors: ${inputs.cluster_colors}
      cluster_stats_sv_data_var: "Sv"
