# Processing level 1, per file: raw ingest and per-file calibration
#
# Unlike processing_lvl_1_parallel.yaml this never combines: each raw file is
# read and calibrated as its own instance until the fan-in in
# processing_lvl_2_per_file.yaml, which must be included right after this
# level.
#
#   initial_setup
#     |-- scan_raw_config     (per file, calibration scan only)
#     |     record_raw_configs  (fan-in)
#     |     standardize_cal
#     |     build_cal_mapping ----------------------+
#     +-- read_raw            (per file)            |
#           combine_raw       (per file) -----------+
#           extract_cal_params (per file, picks this file's mapping)
#
# The calibration branch is four staged steps (see
# calibration_pipeline_staged.yaml), so an interrupted raw scan resumes and a
# corrected calibration file does not invalidate the scan.

recipe:
  name: "processing_lvl_1_per_file"
  description: "Per-file raw ingest, with each file's calibration parameters picked from one survey-wide calibration mapping (gs:// inputs)."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  raw_input_folder:
    type: path
    description: "Folder of raw .raw files, a local path or a gs:// URL."
  cal_input_folder:
    type: path
    description: "Folder of manufacturer calibration files (.cal for EK60, .xml for EK80), a local path or a gs:// URL."
  calibration_outputs:
    type: str
    default: "calibration"
    description: "Name of the subfolder of the run's outputs folder that calibration artifacts are written to."
  cruise_id:
    type: str
    description: "Cruise identifier, such as \"HB1603\", recorded in every generated single-channel calibration file so it stays traceable to the survey."
  record_author:
    type: str
    default: "<Your Name>"
    description: "Name recorded as the author of every generated single-channel calibration file."
  sonar_model:
    type: str
    default: "EK80"
    description: "Echosounder model as echopype names it, such as \"EK60\" or \"EK80\"."
  raw_file_names:
    type: list
    default: []
    description: >
      Optional list of file names within raw_input_folder to process. An empty
      list uses every .raw file in the folder.
  # Also sets the fan-out width: one mapped instance per selected file. On a
  # gs:// folder the filter runs on names, before any download.
  file_time_start:
    type: str
    required: false
    description: >
      Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time
      in each raw file name; files at or after it are processed and scanned for
      calibration. Unset takes every file.
  file_time_end:
    type: str
    required: false
    description: "Optional inclusive ISO datetime matched to the D{YYYYMMDD}-T{HHMMSS} time in each raw file name; files at or before it are processed and scanned for calibration. Unset takes every file."
  ping_time_chunk:
    type: int
    default: 10000
    description: >
      Chunk length along ping_time of each file's EchoData and its checkpoint.
      Larger chunks mean fewer, faster remote writes but more memory per chunk.
      The default keeps each file in one chunk; lower it if a file does not fit
      in memory.

steps:

  - id: initial_setup
    op: initial_setup
    params:
      raw_input_folder: ${inputs.raw_input_folder}
      calibration_outputs: ${inputs.calibration_outputs}
      raw_file_names: ${inputs.raw_file_names}
      clear_previous_json_logs: true
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}

  # Survey-wide calibration, run once. Each per-file extract_cal_params below
  # picks its own file's entry from these dicts. No time window here: the scan
  # maps over raw_file_paths, which is already filtered.
  - id: scan_raw_config
    op: read_raw_file_config
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: always
    params:
      raw_file_path: ${_item}
      verbose: false

  - id: record_raw_configs
    op: record_raw_file_configs
    collect: ${scan_raw_config.file_config}
    checkpoint: always
    regenerate: if-missing
    inputs:
      file_configs: ${scan_raw_config.file_config}
    params:
      output_base: ${initial_setup.calibration_output_dir}

  - id: standardize_cal
    op: standardize_calibration_files
    checkpoint: always
    regenerate: if-missing
    inputs:
      frequencies: ${record_raw_configs.frequencies}
    params:
      cal_input_folder: ${inputs.cal_input_folder}
      output_base: ${initial_setup.calibration_output_dir}
      cruise_id: ${inputs.cruise_id}
      record_author: ${inputs.record_author}
      short_filenames: true

  - id: build_cal_mapping
    op: build_calibration_mapping
    checkpoint: always
    regenerate: always
    inputs:
      raw_file_configs: ${record_raw_configs.raw_file_configs}
    params:
      output_base: ${initial_setup.calibration_output_dir}
      single_channel_dir: ${standardize_cal.single_channel_dir}
      raw_configs_path: ${record_raw_configs.raw_configs_path}
      short_filenames: true
      keep_unused: true
      conflict_resolution: "error"

  # Per-file fan-out
  # Every step from here through apply_mask in processing_lvl_2_per_file.yaml
  # shares this map_over source and forms one mapped chain, each instance
  # checkpointed under its own content-addressed hash.

  # checkpoint: never: the output is an exe_temp store path deleted at the end
  # of the run.
  # depends_on is required: without it the topological sort interleaves this
  # chain with scan_raw_config's and merges them, handing combine_raw every
  # file's store. tests/test_parallel.py pins the grouping.
  - id: read_raw
    op: read_raw_files
    map_over: ${initial_setup.raw_file_paths}
    depends_on: [build_cal_mapping]
    checkpoint: never
    execution:
      dask_config:
        scheduler: processes
    inputs:
      raw_file_paths:
        - ${_item}          # a single-element list: just this file
    params:
      sonar_model: ${inputs.sonar_model}
      include_bot: false
      intermediate_format: "zarr"

  # Opens this file's store as an EchoData; not a survey-wide fan-in.
  - id: combine_raw
    op: combine_raw_files
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      raw_stores: ${read_raw.raw_stores}
    params:
      ping_time_chunk: ${inputs.ping_time_chunk}

  # Selects this file's channel-to-calibration mapping from the shared dicts.
  - id: extract_cal_params
    op: extract_standardized_cal_params
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      calibration_dict: ${build_cal_mapping.calibration_dict}
      mapping_dict: ${build_cal_mapping.mapping_dict}
      echodata: ${combine_raw.echodata}
    params:
      raw_file_path: ${_item}
