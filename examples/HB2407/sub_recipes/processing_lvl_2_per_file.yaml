# Processing level 2, per file: per-file Sv and masking, then survey fan-in
#
# Continues the mapped chain from processing_lvl_1_per_file.yaml, which must be
# included immediately before this level (map_over refers to its initial_setup).
# merge_sv concatenates the per-file masked Sv along ping_time; cropping, noise
# removal and everything after run on the merged survey.
#
#   [per file] compute_sv -> compute_transducer_depth -> ep_add_depth
#              -> detect_seafloor (EVL line) -> seafloor/surface masks
#              -> combine -> apply_mask
#   [fan-in]   merge_sv (collect, concat along ping_time)
#   [survey]   crop_range -> rechunk_before_noise -> remove_noise
#
# The fan-in sits at apply_mask because every step before it is ping-local, so
# per file equals survey-wide. remove_background_noise bins across pings and
# would restart its bins at every file boundary, so it runs after the merge.

recipe:
  name: "processing_lvl_2_per_file"
  description: "Per-file Sv and masking, fan-in to survey Sv, then noise removal."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  echodata:
    type: echodata
    description: "One file's raw EchoData from level 1, calibrated to Sv here and used for transducer depth."
  cal_params:
    type: dict
    description: "Calibration values for each channel of this file, taken from the standardized calibration mapping and applied when computing Sv."
  env_params:
    type: dict
    description: "Environmental values for each channel of this file, such as sound speed and absorption, taken from the standardized calibration mapping and applied when computing Sv."
  datum_correction_m:
    type: float
    default: 0.0
    description: >
      Metres added to each file's recorded drop keel offset to give depth below
      the waterline; positive pushes the transducer deeper. 0 takes the
      recorded offset as waterline referenced.
  use_heave:
    type: bool
    default: true
    description: "Add the per-ping platform heave to transducer depth. False holds the static keel depth on every ping."
  heave_sign:
    type: float
    default: 1.0
    description: >
      Sign applied to platform heave when computing transducer depth, +1.0 or
      -1.0. +1.0 fits the hand-verified EVL seabed line best on HB2407.
  seabed_line_folder:
    type: path
    description: >
      Folder of Echoview .evl seabed line exports, a local path or a gs:// URL.
      The files covering the time window are combined into the seafloor; a
      single .evl file is read whole.
  # The window is survey-wide: every mapped instance reads the same line files
  # and interpolates them onto its own pings.
  file_time_start:
    type: str
    required: false
    description: >
      Optional inclusive ISO datetime selecting the seabed line files to read,
      by the time span in their names. Pass the window that selected the raw
      files; unset reads every line file.
  file_time_end:
    type: str
    required: false
    description: "Optional inclusive ISO datetime selecting the seabed line files to read, by the time span in their names. Pass the window that selected the raw files; unset reads every line file."
  seabed_line_max_gap_s:
    type: float
    default: 600
    description: >
      Widest gap in the combined seabed line, in seconds, to interpolate across;
      pings in a wider gap get no seafloor. Only a break between survey legs is
      this wide.
  # Per file this is stricter than it looks: a short uncovered stretch can be a
  # large fraction of the one file it falls in.
  seabed_line_min_coverage:
    type: float
    default: 0.99
    description: >
      Fraction of a file's pings (0 to 1) the seabed line must cover, or the
      step fails. Lower it or widen the window rather than let uncovered pings
      through, since all their samples are masked.
  surface_depth_m:
    type: float
    default: 10.0
    description: "Range from the transducer, in metres, above which samples are masked, to remove the transmit pulse and ringdown."
  seafloor_buffer_m:
    type: float
    default: 1.0
    description: "Height above the seabed line, in metres, that is also masked, to drop the bottom echo and detection error."
  crop_outlier_sigma:
    type: float
    required: false
    description: >
      Standard deviations above the mean per-ping deepest sample at which a
      ping is an outlier; the crop lands on the deepest kept ping. Unset falls
      back to the trailing NaN trim.
  crop_outlier_margin:
    type: float
    default: 1.5
    description: >
      Multiplier on (mean + crop_outlier_sigma * sd) of the per-ping deepest
      sample that gives the reject threshold. Raise it to flag fewer pings.
      Used only when crop_outlier_sigma is set.
  crop_trailing_all_nan:
    type: bool
    default: true
    description: >
      Drop trailing range samples with no finite Sv anywhere. Lossless; ignored
      when crop_outlier_sigma is set. False, with the other two crop inputs
      unset, turns the crop off.
  crop_max_range_m:
    type: float
    required: false
    description: >
      Range ceiling in metres; samples beyond it are dropped even if they hold
      data. With other crop criteria set, the shallowest cut wins. Unset
      derives the crop from the data.
  noise_range_sample_num:
    type: int
    default: 10
    description: "Range samples per bin for the background noise estimate."
  noise_ping_num:
    type: int
    default: 5
    description: "Pings per bin for the background noise estimate."
  noise_chunk_ping_time:
    type: int
    default: 1000
    description: >
      Ping-time chunk size set before noise removal, so the noise estimate runs
      in dask chunks rather than as one in-memory block. Keep it a multiple of
      noise_ping_num.

steps:

  # Per-file chain (continues the map_over from level 1)

  - id: compute_sv
    op: compute_sv
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: always
    inputs:
      echodata: ${inputs.echodata}
      cal_params: ${inputs.cal_params}
      env_params: ${inputs.env_params}
      waveform_mode: "CW"
      encode_mode: "power"

  # Checkpointed because it is tiny and records the vertical reference the run
  # used, so it can be inspected without recomputing Sv.
  - id: compute_transducer_depth
    op: compute_transducer_depth
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: always
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      datum_correction_m: ${inputs.datum_correction_m}
      use_heave: ${inputs.use_heave}
      heave_sign: ${inputs.heave_sign}

  # Adds the surface-referenced 'depth'. Seabed comparisons below read this
  # dataset, not compute_sv's: without 'depth', create_seafloor_mask silently
  # falls back to echo_range and offsets the mask by the transducer depth.
  - id: ep_add_depth
    op: ep_add_depth
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      depth_offset: ${compute_transducer_depth.transducer_depth}

  # Disabled: HB2407's calibration mapping has no angle_sensitivity, so
  # echopype's add_splitbeam_angle raises TypeError. Nothing downstream uses the
  # angles; restore it once the calibration carries angle sensitivity.
  # - id: ep_add_splitbeam_angle
  #   op: ep_add_splitbeam_angle
  #   map_over: ${initial_setup.raw_file_paths}
  #   inputs:
  #     ds_Sv: ${ep_add_depth.ds_Sv}
  #     echodata: ${inputs.echodata}
  #   params:
  #     waveform_mode: "CW"
  #     encode_mode: "power"
  #     to_disk: false

  # Alternative: the phase-aware DP picker, amplitude-only until
  # ep_add_splitbeam_angle is enabled. On D20241012-T064618 it sat 2 m below
  # the Echoview line. r_min and r_max are metres below the surface.
  # - id: detect_seafloor
  #   op: phase_detect_seafloor
  #   map_over: ${initial_setup.raw_file_paths}
  #   checkpoint: save
  #   inputs:
  #     ds_Sv: ${ep_add_depth.ds_Sv}
  #   params:
  #     r_min: 30.0
  #     r_max: 100.0
  #     regime: "shelf"

  - id: detect_seafloor
    op: read_seafloor_line
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: save
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
    params:
      evl_path: ${inputs.seabed_line_folder}
      # Same window that selects the raw files. A line file spans from its own
      # name stamp to the next file's, which pulls in the export straddling the
      # window start.
      file_time_start: ${inputs.file_time_start}
      file_time_end: ${inputs.file_time_end}
      # No extrapolation past the line's ends: pings outside it come back NaN
      # and are masked entirely, so min_coverage fails the run instead.
      edge_extend_s: 0.0
      max_gap_s: ${inputs.seabed_line_max_gap_s}
      min_coverage: ${inputs.seabed_line_min_coverage}

  - id: create_seafloor_mask
    op: create_seafloor_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      # Must carry 'depth' to match the surface-referenced line (see ep_add_depth).
      ds_Sv: ${ep_add_depth.ds_Sv}
      seafloor_depth: ${detect_seafloor.seafloor_depth}
    params:
      # The seabed sits at 55-71 m in this line; a buffer anywhere near that
      # depth keeps nothing at all.
      seafloor_buffer_m: ${inputs.seafloor_buffer_m}

  # create_surface_mask always compares against echo_range, so compute_sv's
  # dataset is the right input here.
  - id: create_surface_mask
    op: create_surface_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
    params:
      surface_depth_m: ${inputs.surface_depth_m}

  - id: combine_masks
    op: combine_masks
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      masks:
        - ${create_seafloor_mask.mask}
        - ${create_surface_mask.mask}
    params:
      mode: "and"

  - id: apply_mask
    op: apply_sv_mask
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
      mask: ${combine_masks.mask}

  # Fan-in: reassemble the survey from the per-file masked Sv

  - id: merge_sv
    op: merge_datasets
    collect: ${apply_mask.ds_Sv}
    checkpoint: always
    inputs:
      datasets: ${apply_mask.ds_Sv}
    params:
      dim: "ping_time"

  # Survey-wide from here on

  # Drops trailing range samples that are all NaN after masking, so every later
  # step works on the shorter axis (2024-10-15: range_sample 2806 to 1139, no
  # finite sample lost, which keeps compute_per_cell_statistics in memory).
  # After the fan-in because the crop point is survey-wide; cropping per file
  # gives different range_sample lengths that merge_sv pads back with NaN.
  - id: crop_range
    op: crop_range
    checkpoint: always
    inputs:
      ds_Sv: ${merge_sv.merged}
    params:
      outlier_sigma: ${inputs.crop_outlier_sigma}
      outlier_margin: ${inputs.crop_outlier_margin}
      drop_trailing_all_nan: ${inputs.crop_trailing_all_nan}
      max_range_m: ${inputs.crop_max_range_m}

  - id: rechunk_before_noise
    op: rechunk_dataset
    inputs:
      ds_Sv: ${crop_range.ds_Sv}
    params:
      ping_time_chunk: ${inputs.noise_chunk_ping_time}

  - id: remove_noise
    op: remove_background_noise
    checkpoint: always
    inputs:
      ds_Sv: ${rechunk_before_noise.ds_Sv}
    params:
      range_sample_num: ${inputs.noise_range_sample_num}
      ping_num: ${inputs.noise_ping_num}
      # Must be a dB string, not a bare number. Lower it to keep more weak data.
      # SNR_threshold: "0dB"
