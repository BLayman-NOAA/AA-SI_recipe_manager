# Processing level 2a, survey: per-file Sv and depth, then the survey fan-in
#
# The survey half of level 2 and the boundary of the shared artifact: it runs
# once per cruise, and every user recipe includes it verbatim, hits the cache
# and picks up from merge_survey_sv. Must be included immediately after
# processing_lvl_1_survey.yaml, whose mapped chain it continues.
#
#   [per file] compute_sv -> compute_transducer_depth -> ep_add_depth
#              -> crop_range (fixed ceiling, so every file ends the same length)
#   [fan-in]   merge_survey_sv (collect, concat along ping_time)
#   [survey]   rechunk_survey_sv -> the shared, chunked Sv store
#
# The merge sits after ep_add_depth: Sv, the vertical reference and the range
# axis are properties of the raw data, while seabed detection, masking, noise
# removal and MVBS vary per analysis and live in processing_lvl_2_user.yaml.
# compute_transducer_depth and ep_add_depth need the file's EchoData, so they
# must stay before the merge.
#
# The crop is per file with a fixed ceiling because HB2407's files differ in
# range_sample length (2783 to 2806) and merge_datasets NaN-pads them, leaving
# NaN in echo_range. The sample interval is uniform (0.18804 m), so a fixed
# crop_max_range_m gives every file the same length; data-driven crops would
# pick a different depth per file.
#
# ep_add_splitbeam_angle is omitted: the calibration mapping has no
# angle_sensitivity, so echopype raises TypeError. Nothing downstream needs it.

recipe:
  name: "processing_lvl_2_survey"
  description: "Per-file Sv and depth, fan-in to the shared survey Sv store."
  version: "1.0"
  author: "<Your Name>"
  schema_version: "1"

inputs:
  echodata:
    type: echodata
    description: "One file's raw EchoData from level 1, calibrated to Sv here and used for transducer depth."
  cal_params:
    type: dict
    description: "Calibration values for each channel of this file, taken from the standardized calibration mapping and applied when computing Sv."
  env_params:
    type: dict
    description: "Environmental values for each channel of this file, such as sound speed and absorption, taken from the standardized calibration mapping and applied when computing Sv."
  datum_correction_m:
    type: float
    default: 0.0
    description: >
      Metres added to each file's recorded drop keel offset to give depth below
      the waterline; positive pushes the transducer deeper. 0 takes the
      recorded offset as waterline referenced.
  use_heave:
    type: bool
    default: true
    description: "Add the per-ping platform heave to transducer depth. False holds the static keel depth on every ping."
  heave_sign:
    type: float
    default: 1.0
    description: >
      Sign applied to platform heave when computing transducer depth, +1.0 or
      -1.0. +1.0 fits the hand-verified EVL seabed line best on HB2407.
  # Must be one constant for every file, or files get different range_sample
  # lengths. Pick it from the deepest seabed in the .evl lines plus a margin,
  # and check the crop step's reported "deepest kept".
  crop_max_range_m:
    type: float
    default: 250.0
    description: >
      Range ceiling in metres; samples beyond it are dropped even if they hold
      data. Changing it recomputes the whole survey Sv.
  # A 15-file segment is about 42000 pings, so 2000 gives about 21 chunks.
  survey_chunk_ping_time:
    type: int
    default: 2000
    description: >
      Ping-time chunk size of the shared survey store, which sets the
      granularity a window reads at. Size it near the window users usually ask
      for.

steps:

  # Per-file chain (continues the map_over from level 1)

  - id: compute_sv
    op: compute_sv
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: always
    inputs:
      echodata: ${inputs.echodata}
      cal_params: ${inputs.cal_params}
      env_params: ${inputs.env_params}
      waveform_mode: "CW"
      encode_mode: "power"

  - id: compute_transducer_depth
    op: compute_transducer_depth
    map_over: ${initial_setup.raw_file_paths}
    checkpoint: always
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      datum_correction_m: ${inputs.datum_correction_m}
      use_heave: ${inputs.use_heave}
      heave_sign: ${inputs.heave_sign}

  - id: ep_add_depth
    op: ep_add_depth
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${compute_sv.ds_Sv}
      echodata: ${inputs.echodata}
    params:
      depth_offset: ${compute_transducer_depth.transducer_depth}

  # Fixed ceiling only; see the header.
  - id: crop_survey_range
    op: crop_range
    map_over: ${initial_setup.raw_file_paths}
    inputs:
      ds_Sv: ${ep_add_depth.ds_Sv}
    params:
      max_range_m: ${inputs.crop_max_range_m}
      drop_trailing_all_nan: false

  # Fan-in: the shared survey artifact

  - id: merge_survey_sv
    op: merge_datasets
    collect: ${crop_survey_range.ds_Sv}
    inputs:
      datasets: ${crop_survey_range.ds_Sv}
    params:
      dim: "ping_time"

  # The store users read. Its checkpoint write streams chunk by chunk, so
  # building it does not need the survey in memory.
  - id: rechunk_survey_sv
    op: rechunk_dataset
    checkpoint: always
    inputs:
      ds_Sv: ${merge_survey_sv.merged}
    params:
      ping_time_chunk: ${inputs.survey_chunk_ping_time}
