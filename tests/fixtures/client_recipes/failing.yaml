# A step that raises, for failed run tests.
recipe:
  name: client_failing
  version: "1.0"
  description: A chain whose second step raises RuntimeError.
  schema_version: "1"

steps:
  - id: start
    op: custom
    custom_spec:
      description: Return the constant 7.
      callable_path: _stage9_helpers.const7
      outputs:
        v: {type: int}
      output_map: {v: __return__}
      dependency: {name: pytest, version: ">=7.0", source: pypi}

  - id: blow
    op: custom
    inputs:
      x: ${start.v}
    custom_spec:
      description: Raise RuntimeError.
      callable_path: _stage9_helpers.boom
      inputs:
        x: {type: int}
      outputs:
        out: {type: int}
      output_map: {out: __return__}
      dependency: {name: pytest, version: ">=7.0", source: pypi}
